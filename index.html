<style>
:root{
  --sage:#a8b5a0;            /* verdolino chiaro */
  --sage-2:#9cab92;          /* verdolino medio: barra in alto */
  --sage-wash:#eef1ea;
  --sage-mist:#f5f7f2;
  --bg:#f9f9f5; --card:#fff;
  --ink:#2c332a;             /* testo: verde così scuro da leggersi quasi nero */
  --ink-soft:#55634d;        /* accento leggibile, stessa famiglia */
  --muted:#7e8379;
  --line:#e9ebe3;
  --clay:#b9705a;            /* allarmi e giorni di ciclo */
  --clay-wash:#f9efeb;
  --ok:#5d8a6a; --ok-wash:#ebf1eb;
  --sky:#7d99b4; --sky-wash:#eff3f7;
  --lilac:#a389b0; --lilac-wash:#f4eff6;
  --safe-b:env(safe-area-inset-bottom,0px);
  --serif:ui-serif,"New York","Iowan Old Style",Georgia,Cambria,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  --shadow:0 1px 2px rgba(44,51,42,.03), 0 12px 30px -18px rgba(44,51,42,.18);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-size:16px;line-height:1.62;font-family:var(--sans);
  padding-bottom:calc(80px + var(--safe-b));-webkit-font-smoothing:antialiased}
.wrap{max-width:600px;margin:0 auto;padding:0 17px}
h1,h2,h3,h4{margin:0}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:inherit;font-size:16px;color:var(--ink)}

/* ---------- header ---------- */
.top{background:var(--sage-2);color:var(--ink);padding:calc(env(safe-area-inset-top,0px) + 22px) 0 22px;position:sticky;top:0;z-index:40}
.top .wrap{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.dt{font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;opacity:.62;font-weight:600}
.dn{font-family:var(--serif);font-size:31px;font-weight:400;letter-spacing:-.018em;line-height:1.02;margin-top:5px}
.navdate{display:flex;gap:6px;align-items:center;padding-bottom:4px}
.navdate button{height:33px;min-width:33px;border-radius:17px;background:rgba(255,255,255,.4);font-size:15px;
  line-height:1;display:grid;place-items:center;color:var(--ink)}
.navdate button:active{background:rgba(255,255,255,.8)}
#bToday{padding:0 13px;font-size:10.5px;font-weight:700;letter-spacing:.14em}

/* ---------- generico ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:19px;margin:14px 0;box-shadow:var(--shadow)}
.sec-t{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:28px 0 10px;padding-left:3px}
.muted{color:var(--muted)}
.sm{font-size:14px;line-height:1.62}
.xs{font-size:12.5px;line-height:1.58;color:var(--muted)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
h3{font-family:var(--serif);font-weight:400;letter-spacing:-.014em}
h4{font-family:var(--serif);font-weight:400;font-size:17.5px;letter-spacing:-.008em}

.pill{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;padding:5px 12px;border-radius:20px}
.pill-a{background:var(--clay-wash);color:var(--clay)}
.pill-g{background:var(--ok-wash);color:var(--ok)}
.pill-b{background:var(--sky-wash);color:var(--sky)}
.pill-p{background:var(--lilac-wash);color:var(--lilac)}

.callout{background:var(--sage-wash);padding:15px 17px;border-radius:18px;margin:14px 0;font-size:13.5px;line-height:1.62}
.callout b,.callout strong{color:var(--ink-soft);font-weight:700}
.callout.g{background:var(--ok-wash)} .callout.g b,.callout.g strong{color:var(--ok)}
.callout.p{background:var(--lilac-wash)} .callout.p b,.callout.p strong{color:var(--lilac)}
.callout.w{background:var(--clay-wash)} .callout.w b,.callout.w strong{color:var(--clay)}

.btn{display:inline-block;background:var(--ink);color:#fff;border-radius:15px;padding:13px 18px;font-weight:600;font-size:14.5px;text-align:center}
.btn:active{opacity:.78}
.btn.sec{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.wide{display:block;width:100%}
.btn.acc{background:var(--sage-2);color:var(--ink);font-weight:700}

/* ---------- esercizi ---------- */
.exr{border-bottom:1px solid var(--line)}
.exr:last-child{border-bottom:none}
.exhead{display:flex;align-items:center;gap:13px;padding:13px 0}
.cb{width:25px;height:25px;border-radius:50%;border:1.5px solid #d7dcd0;flex:0 0 auto;display:grid;place-items:center;background:#fff;transition:.15s}
.cb.on{background:var(--sage-2);border-color:var(--sage-2)}
.cb svg{width:13px;height:13px;opacity:0;stroke:#fff;stroke-width:3.2;fill:none}
.cb.on svg{opacity:1}
.exname{flex:1;min-width:0}
.exname b{display:block;font-size:15px;font-weight:600;line-height:1.36}
.exr.done .exname b{opacity:.4;text-decoration:line-through}
.exdose{font-size:12.5px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.chev{width:24px;text-align:center;color:#c5cabe;font-size:11px;transition:.2s}
.exr.open .chev{transform:rotate(180deg)}
.exbody{display:none;padding:2px 0 16px}
.exr.open .exbody{display:block}
figure{margin:0 0 12px;background:var(--sage-mist);border-radius:18px;overflow:hidden}
figure svg{display:block;width:100%;height:auto;background:var(--sage-mist)}
.figcap{display:flex;gap:5px;padding:7px}
.figcap button{flex:1;padding:8px;font-size:11.5px;font-weight:600;color:var(--muted);border-radius:12px;letter-spacing:.02em}
.figcap button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(44,51,42,.1)}
.errl{list-style:none;padding:0;margin:12px 0 0}
.errl li{position:relative;padding-left:18px;font-size:13px;color:var(--muted);margin-bottom:6px;line-height:1.52}
.errl li::before{content:"";position:absolute;left:2px;top:8px;width:5px;height:5px;border-radius:5px;background:var(--clay)}
.logrow{display:flex;gap:9px;align-items:center;margin-top:13px}
.logrow input{flex:1;min-width:0;border:1px solid var(--line);border-radius:14px;padding:11px 13px;background:var(--sage-mist)}
.prev{font-size:12px;color:var(--muted);margin-top:7px}
.yt{display:inline-flex;align-items:center;gap:6px;margin-top:13px;font-size:13px;font-weight:600;color:var(--ink-soft);text-decoration:none}

.pbar{height:6px;border-radius:6px;background:var(--sage-wash);overflow:hidden;margin-top:11px}
.pbar i{display:block;height:100%;background:var(--sage-2);width:0;transition:.35s;border-radius:6px}

/* ---------- pasti ---------- */
.mcard{border:1px solid var(--line);border-radius:22px;margin:12px 0;overflow:hidden;background:#fff;box-shadow:var(--shadow)}
.mhead{padding:16px 18px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.mslot{font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);font-weight:600}
.mname{font-family:var(--serif);font-size:19.5px;font-weight:400;margin-top:5px;line-height:1.2;letter-spacing:-.014em}
.mmac{font-size:11.5px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums;text-align:right;line-height:1.7}
.mbody{padding:15px 18px 16px;background:var(--sage-mist)}
.ingl{list-style:none;padding:0;margin:0 0 12px}
.ingl li{font-size:13.5px;padding:3px 0 3px 15px;position:relative}
.ingl li::before{content:"";position:absolute;left:2px;top:12px;width:4px;height:4px;border-radius:4px;background:var(--sage-2)}
.procl{padding-left:18px;margin:0;font-size:13.5px}
.procl li{margin-bottom:7px;line-height:1.58}
.macts{display:flex;gap:9px;padding:13px 18px 15px}
.macts button{flex:1;border:1px solid var(--line);border-radius:14px;padding:11px;font-size:12.5px;font-weight:600;color:var(--muted);background:#fff}
.macts button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.alt{padding:0 18px 16px}
.altitem{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:8px}
.altitem:active{background:var(--sage-mist)}
.altitem.cur{border-color:var(--sage-2);background:var(--sage-wash)}

/* ---------- tabelle ---------- */
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:9.5px;text-transform:uppercase;letter-spacing:.18em;color:var(--muted);padding:8px 8px 8px 0;border-bottom:1px solid var(--line);font-weight:600}
td{padding:11px 8px 11px 0;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:none}
td.n{white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right;padding-right:0}
td.n b{color:var(--ink);font-weight:600}

/* ---------- form ---------- */
.f{display:flex;flex-direction:column;gap:6px;margin-bottom:13px}
.f label{font-size:10px;text-transform:uppercase;letter-spacing:.18em;color:var(--muted);font-weight:600}
.f input,.f select{border:1px solid var(--line);border-radius:15px;padding:13px;background:var(--sage-mist);width:100%}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:11px}

/* ---------- calendario ---------- */
.calhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.calhead b{font-family:var(--serif);font-size:18.5px;font-weight:400;letter-spacing:-.012em}
.calhead button{width:33px;height:33px;border-radius:17px;background:var(--sage-mist);color:var(--muted);font-size:14px;line-height:1;display:grid;place-items:center}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cdow{text-align:center;font-size:9px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;padding-bottom:6px}
.cd{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:13.5px;font-weight:500;
    border:1.5px solid transparent;background:var(--sage-mist);color:var(--ink);position:relative;cursor:pointer;user-select:none;font-variant-numeric:tabular-nums}
.cd.emp{background:none;cursor:default}
.cd.fut{opacity:.38;cursor:default}
.cd.mes{background:#f4e2db;color:#8d5040}
.cd.fol{background:var(--sage-wash);color:var(--ink-soft)}
.cd.ovu{background:var(--sky-wash);color:#4c6480}
.cd.lut{background:var(--lilac-wash);color:#775a83}
.cd.per{background:var(--clay);color:#fff;border-color:var(--clay)}
.cd.per::after{content:"";position:absolute;bottom:5px;width:3px;height:3px;border-radius:3px;background:rgba(255,255,255,.9)}
.cd.per.prov{background:repeating-linear-gradient(135deg,var(--clay),var(--clay) 4px,#d1917d 4px,#d1917d 9px)}
.cd.per.autoc{background:#e3b6a7;color:#7d3f2c;border:1.5px dashed var(--clay)}
.cd.pred{background:repeating-linear-gradient(135deg,#fbf1ec,#fbf1ec 4px,#f3e0d7 4px,#f3e0d7 8px);color:#b08876;border-color:#f1ddd4}
.cd.tod{border-color:var(--ink)}
.leg{display:flex;flex-wrap:wrap;gap:11px;margin-top:15px}
.leg span{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.leg i{width:11px;height:11px;border-radius:50%;display:block;flex:0 0 auto}
.legprov{background:repeating-linear-gradient(135deg,var(--clay),var(--clay) 3px,#d1917d 3px,#d1917d 7px)}

/* ---------- spesa ---------- */
.shrow{display:flex;align-items:flex-start;gap:13px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.shrow:last-child{border-bottom:none}
.shtxt{flex:1;min-width:0;font-size:14px;line-height:1.42}
.shq{font-weight:700;color:var(--ink-soft);margin-right:7px;font-variant-numeric:tabular-nums}
.shrow.on .shtxt{opacity:.36;text-decoration:line-through}
.shrow.on .shq{color:var(--muted)}
.shadd{display:flex;gap:9px;margin-top:12px}
.shadd input{flex:1;min-width:0;border:1px solid var(--line);border-radius:15px;padding:12px;background:var(--sage-mist)}

/* ---------- nav ---------- */
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(252,252,249,.94);backdrop-filter:blur(18px);
    border-top:1px solid var(--line);display:flex;z-index:50;padding-bottom:var(--safe-b)}
nav button{flex:1;padding:11px 1px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--muted);font-size:9.5px;font-weight:600;letter-spacing:.04em;min-width:0}
nav button svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--ink)}
nav button.on svg{stroke-width:2}
.view{display:none}
.view.on{display:block}

details{border:1px solid var(--line);border-radius:22px;background:#fff;margin:12px 0;overflow:hidden;box-shadow:var(--shadow)}
details summary{padding:17px 19px;font-family:var(--serif);font-weight:400;font-size:17.5px;letter-spacing:-.01em;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:12px}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"";width:7px;height:7px;border-right:1.5px solid #bcc2b5;border-bottom:1.5px solid #bcc2b5;transform:rotate(45deg) translateY(-2px);transition:.2s;flex:0 0 auto}
details[open] summary::after{transform:rotate(-135deg) translateY(1px)}
details .dc{padding:0 19px 19px}
.chart{width:100%;height:auto;display:block}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(94px + var(--safe-b));background:var(--ink);color:#fff;
  padding:13px 21px;border-radius:18px;font-size:13.5px;font-weight:500;z-index:99;opacity:0;pointer-events:none;transition:.28s;max-width:88%;
  box-shadow:0 10px 30px -12px rgba(44,51,42,.5)}
.toast.on{opacity:1}
</style>
</head>

<header class="top">
  <div class="wrap">
    <div>
      <div class="dt" id="hDate">—</div>
      <div class="dn" id="hDay">—</div>

    <div class="navdate">
      <button id="bPrev" aria-label="Giorno precedente">‹</button>
      <button id="bToday" aria-label="Oggi">OGGI</button>

  </div>
</header>

<main class="wrap">

</main>

  lut:{n:"Fase luteale",    cls:"pill-p", kcal:1800, adv:"Mezzo grado di temperatura in più rende tutto più faticoso: mantieni la frequenza ma non aspettarti record. Le calorie salgono a 1.800, non è un cedimento. Sulla bilancia stai guardando acqua, ignorala."}
};
const DAYMS = 86400000;
const FLOW_DEFAULT = 5;   /* durata presunta finché non ne conosco una tua */
const GRACE = 3;          /* giorni di attesa prima di convalidare da sola */

/* Un ciclo = {s:"inizio", e:"fine"|null, auto:true se l'ha chiuso l'app} */
function cycles(){ return st.cycles || (st.cycles=[]); }
function addD(s,n){ const d=parseD(s); d.setDate(d.getDate()+n); return k(d); }
function dlen(a,b){ return Math.round((parseD(b)-parseD(a))/DAYMS)+1; }
function avgFlow(){
  const c=cycles().filter(x=>x.e && !x.auto);
  if(!c.length) return FLOW_DEFAULT;
  return Math.max(1, Math.round(c.reduce((a,x)=>a+dlen(x.s,x.e),0)/c.length));
}
function effEnd(cy){ return cy.e || addD(cy.s, avgFlow()-1); }
function openCycle(){ return cycles().find(c=>!c.e) || null; }
/* chiude da sola i cicli lasciati aperti, ma li marca come "convalidati dall'app" */
function autoConfirm(){
  const today=k(new Date()); let ch=false;
  cycles().forEach(cy=>{
    if(!cy.e){
      const pe=addD(cy.s, avgFlow()-1);
      /* il periodo di tolleranza parte dal più recente fra la fine presunta e il giorno
         in cui hai inserito il ciclo: così un ciclo segnato a ritroso non viene chiuso
         all'istante, e hai il tempo di toccare il suo ultimo giorno. */
      const from = (cy.t && cy.t > pe) ? cy.t : pe;
      if(today > addD(from, GRACE)){ cy.e=pe; cy.auto=true; ch=true; }
    }
  });
  if(ch) save();
}
function dayState(ks){
  const cy = cycles().find(c=> ks>=c.s && ks<=effEnd(c));
  if(!cy) return null;
  if(!cy.e) return "prov";
  return cy.auto ? "auto" : "sure";
}
function cstats(){
  autoConfirm();
  const g=cycles().slice().sort((a,b)=>a.s<b.s?-1:1), lens=[];
  for(let i=1;i<g.length;i++){ const L=Math.round((parseD(g[i].s)-parseD(g[i-1].s))/DAYMS); if(L>=18&&L<=70) lens.push(L); }
  const conf=g.filter(x=>x.e&&!x.auto);
  return { g:g, lens:lens,
    avg: lens.length?Math.round(lens.reduce((a,b)=>a+b,0)/lens.length):null,
    min: lens.length?Math.min.apply(null,lens):null,
    max: lens.length?Math.max.apply(null,lens):null,
    varia: lens.length?Math.max.apply(null,lens)-Math.min.apply(null,lens):null,
    dur: conf.length?Math.round(conf.reduce((a,x)=>a+dlen(x.s,x.e),0)/conf.length):null,
    nconf: conf.length };
}
function mk(key,day,conf,extra){
  const p=PHASES[key];
  return {known:true, key:key, day:day, conf:conf, kcal:p.kcal, n:p.n, cls:p.cls, adv:(extra?extra+" ":"")+p.adv};
}
function cyc(d){
  const S=cstats(), ks=k(d);
  const inCy = S.g.find(c=> ks>=c.s && ks<=effEnd(c));
  if(inCy){
    const day=dlen(inCy.s,ks);
    if(!inCy.e) return mk("mes",day,"in corso","Ciclo in corso: sto assumendo una durata di "+avgFlow()+" giorni. Quando finisce, tocca l'ultimo giorno sul calendario.");
    if(inCy.auto) return mk("mes",day,"convalidata dall'app","Non avevi segnato la fine, quindi ho chiuso il ciclo a "+dlen(inCy.s,inCy.e)+" giorni. Se non è esatto, correggilo sul calendario.");
    return mk("mes",day,"certa","Giorno di ciclo che hai registrato.");
  }
  const past=S.g.filter(c=> c.s<=ks);
  if(!past.length) return {known:false,kcal:1650,n:"Ciclo da registrare",cls:"pill-b",day:null,key:null,conf:null,
    adv:"Sul calendario qui sotto tocca il primo giorno del ciclo, poi l'ultimo. Puoi farlo anche a ritroso, se te li ricordi. Da due cicli in poi l'app calcola i tuoi intervalli reali e stima le fasi; fino ad allora l'obiettivo resta 1.650 kcal fissi."};
  const last=past[past.length-1];
  const day=dlen(last.s,ks);
  if(S.lens.length<2) return {known:true,kcal:1650,n:"Fase non stimabile",cls:"pill-b",day:day,key:null,conf:"nessuna",
    adv:"Ho un solo ciclo registrato: per stimare le fasi servono almeno due intervalli, e con un ciclo irregolare anche di più. Continua a segnare. Intanto usa l'autoregolazione: senti il carico al primo esercizio e aggiusta in base a come esce, invece di seguire il calendario."};
  /* La fase luteale dura ~12–14 giorni ed è la parte stabile anche nei cicli irregolari:
     l'ovulazione si stima all'indietro dalla lunghezza dei tuoi cicli, non in avanti.
     Ampiezza legata alla tua variabilità, ma limitata a ±5 giorni. */
  const centro=Math.max(10,(S.avg||28)-14), half=Math.min(5,Math.max(2,Math.round((S.varia||4)/2)));
  const ovLo=Math.max(8,centro-half), ovHi=centro+half;
  const wide=(S.varia||0)>=8;
  if(day<ovLo) return mk("fol",day, wide?"larga":"buona",
    wide?"I tuoi cicli variano parecchio, quindi la stima è larga: prendila come indicazione, non come certezza.":"");
  if(day<=ovHi) return mk("ovu",day, wide?"molto larga":"stimata",
    "Finestra ovulatoria stimata tra il giorno "+ovLo+" e il "+ovHi+(wide?", ampia perché i tuoi cicli variano molto: tieni la cautela sui salti per tutto l'intervallo.":"."));
  const late=(S.max||0)?day-S.max:0;
  return mk("lut",day,"stimata", late>3
    ? "Sei "+late+" giorni oltre il tuo ciclo più lungo registrato. Con cicli irregolari succede spesso; se il ritardo si allunga molto o si ripete, vale una parola col medico."
    : "");
}
function nextWindow(){
  const S=cstats(); if(!S.g.length||!S.min) return null;
  const s=parseD(S.g[S.g.length-1].s).getTime();
  return {lo:new Date(s+S.min*DAYMS), hi:new Date(s+S.max*DAYMS)};
}

function progPhase(d){ if(st.phaseOverride) return st.phaseOverride; return d >= parseD(PHASE2_START) ? 2 : 1; }

/* ---------------- disegno esercizi ---------------- */
function fig(ex, w){
  const P = w==="b" ? ex.b : ex.a;
  const L=(a,b,c)=> a&&b ? `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${c}"/>` : "";
  let pr = "", eq = "";
  (ex.props||[]).forEach(o=>{
    if(o[0]==="line") pr += `<line x1="${o[1]}" y1="${o[2]}" x2="${o[3]}" y2="${o[4]}" stroke="#c3bbb1" stroke-width="5"/>`;
    if(o[0]==="rect") pr += `<rect x="${o[1]}" y="${o[2]}" width="${o[3]}" height="${o[4]}" rx="3" fill="#d9d2c8"/>`;
    if(o[0]==="circ") pr += `<circle cx="${o[1]}" cy="${o[2]}" r="${o[3]}" fill="none" stroke="#c3bbb1" stroke-width="4"/>`;
    if(o[0]==="db")   eq += `<g fill="#8e8880"><rect x="${o[1]-7}" y="${o[2]-2}" width="14" height="4" rx="2"/><rect x="${o[1]-10}" y="${o[2]-5}" width="5" height="10" rx="2"/><rect x="${o[1]+5}" y="${o[2]-5}" width="5" height="10" rx="2"/></g>`;
    if(o[0]==="bar")  eq += `<g fill="#8e8880"><rect x="${o[1]-30}" y="${o[2]-2}" width="60" height="4" rx="2"/><rect x="${o[1]-34}" y="${o[2]-9}" width="6" height="18" rx="2"/><rect x="${o[1]+28}" y="${o[2]-9}" width="6" height="18" rx="2"/></g>`;
  });
  const far = "#a9a29a", near = "#1b1a18";
  return `<svg viewBox="0 0 200 160" role="img" aria-label="${esc(ex.n)}">
    <g stroke-linecap="round" stroke-width="4.5" fill="none">${pr}
      ${L(P.n,P.e2,far)}${L(P.e2,P.w2,far)}${L(P.p,P.k2,far)}${L(P.k2,P.f2,far)}
      <line x1="${P.n[0]}" y1="${P.n[1]}" x2="${P.p[0]}" y2="${P.p[1]}" stroke="${near}" stroke-width="6"/>
      ${L(P.n,P.e,near)}${L(P.e,P.w,near)}${L(P.p,P.k,near)}${L(P.k,P.f,near)}
      <circle cx="${P.h[0]}" cy="${P.h[1]}" r="9" fill="#faf8f5" stroke="${near}" stroke-width="4.5"/>
      ${eq}
    </g></svg>`;
}

      h += `<div class="callout" style="margin-bottom:2px"><b>Fase mestruale.</b> Fai due giri invece di tre. Se oggi non ce la fai, una camminata vale più di una seduta saltata per sensi di colpa.</div>`;

  } else if(plan.type === "steps"){
    h += `<div class="sec-t">Giorno di scarico attivo</div><div class="card">
      <h3 style="font-size:20px">8.000–10.000 passi</h3>

      ${chk("steps", rec.steps, "Obiettivo raggiunto")}</div>`;
  } else {
    h += `<div class="sec-t">Riposo</div><div class="card">
      <h3 style="font-size:20px">Giorno di recupero</h3>
      <div class="sm muted" style="margin-top:7px">Solo i cinque minuti di mobilità, se ti va. Il recupero è parte del piano, non una pausa dal piano: è mentre riposi che il corpo incassa il lavoro delle sedute.</div></div>`;

function chk(id,on,label){
  return `<div class="exhead" style="padding-top:13px;cursor:pointer" onclick="tglSteps()">
    <span class="cb ${on?"on":""}"><svg viewBox="0 0 24 24"><path d="M4 12l6 6L20 6"/></svg></span>
    <span class="exname"><b style="${on?"opacity:.5;text-decoration:line-through":""}">${esc(label)}</b></span></div>`;
}

function exRow(id, dose, key, rec, ph, mobIdx){
  const ex = EX[id]; if(!ex) return "";
  const isMob = mobIdx!==undefined;
  const on = isMob ? !!rec.mob[mobIdx] : !!rec.ex[id];
  const lg = (st.log[key]||{})[id] || {};
  const prev = prevLog(id, key);
  const logBox = isMob ? "" : `<div class="logrow">
      <input placeholder="${ph===1?"kg":"giri"}" value="${esc(lg.w||"")}" oninput="setLog('${id}','w',this.value)">
      <input placeholder="ripetizioni" value="${esc(lg.r||"")}" oninput="setLog('${id}','r',this.value)">
    </div>${prev?`<div class="prev">Ultima volta (${prev.when}): ${esc(prev.txt)}</div>`:`<div class="prev">Segna qui cosa hai fatto: è l'unico modo per sapere se stai progredendo.</div>`}`;
  return `<div class="exr ${on?"done":""}" id="row-${id}${isMob?"-m":""}">
    <div class="exhead">
      <span class="cb ${on?"on":""}" onclick="tgl('${id}',${isMob?mobIdx:-1})"><svg viewBox="0 0 24 24"><path d="M4 12l6 6L20 6"/></svg></span>
      <span class="exname" onclick="opn('${id}${isMob?"-m":""}')"><b>${esc(ex.n)}</b></span>
      <span class="exdose" onclick="opn('${id}${isMob?"-m":""}')">${esc(dose)}</span>
      <span class="chev" onclick="opn('${id}${isMob?"-m":""}')">▾</span>
    </div>

      <figure><div id="fg-${id}${isMob?"-m":""}">${fig(ex,"a")}</div>
        <div class="figcap">
          <button class="on" onclick="swf(this,'${id}${isMob?"-m":""}','${id}','a')">Partenza</button>
          <button onclick="swf(this,'${id}${isMob?"-m":""}','${id}','b')">Arrivo</button>
        </div></figure>
      <div class="sm">${esc(ex.cue)}</div>
      <ul class="errl">${ex.err.map(e=>`<li>${esc(e)}</li>`).join("")}</ul>
      ${logBox}
      <a class="yt" target="_blank" rel="noopener" href="https://www.youtube.com/results?search_query=${encodeURIComponent("come fare "+ex.n+" tecnica")}">▶ Guarda il video su YouTube</a>
    </div></div>`;
}
function prevLog(id, key){
  const ks = Object.keys(st.log).filter(x=>x<key && st.log[x][id] && (st.log[x][id].w||st.log[x][id].r)).sort();
  if(!ks.length) return null;
  const kk = ks[ks.length-1], v = st.log[kk][id], d = parseD(kk);
  return { when: d.getDate()+" "+MONTHS[d.getMonth()].slice(0,3), txt: [v.w,v.r].filter(Boolean).join(" × ") };
}
function tgl(id, mobIdx){
  const rec = dayRec(k(cur));
  if(mobIdx>=0) rec.mob[mobIdx] = !rec.mob[mobIdx]; else rec.ex[id] = !rec.ex[id];
  save(); renderOggi();
}
function tglSteps(){ const r=dayRec(k(cur)); r.steps=!r.steps; save(); renderOggi(); }
function allMob(){ const r=dayRec(k(cur)); const all=MOBILITY.every((m,i)=>r.mob[i]);
  MOBILITY.forEach((m,i)=>r.mob[i]=!all); save(); renderOggi(); }
function opn(rid){ const el=document.getElementById("row-"+rid); if(el) el.classList.toggle("open"); }
function swf(btn, rid, exid, w){
  btn.parentNode.querySelectorAll("button").forEach(b=>b.classList.remove("on")); btn.classList.add("on");
  document.getElementById("fg-"+rid).innerHTML = fig(EX[exid], w);
}
function setLog(id, f, v){
  const key=k(cur); if(!st.log[key]) st.log[key]={}; if(!st.log[key][id]) st.log[key][id]={};
  st.log[key][id][f]=v; save();
}

function tapDay(ks){
  const cy=cycles(), open=openCycle();
  if(open){
    if(ks===open.s){ st.cycles=cy.filter(c=>c!==open); toast("Inizio annullato"); }
    else if(ks>open.s){ open.e=ks; delete open.auto; toast("Ciclo di "+dlen(open.s,ks)+" giorni registrato"); }
    else { open.s=ks; toast("Inizio spostato al "+parseD(ks).getDate()); }
  } else {
    const prev = cy.filter(c=> c.s<=ks).pop();
    if(prev && ks===prev.s){                       /* di nuovo sull'inizio = elimina */
      st.cycles=cy.filter(c=>c!==prev); toast("Ciclo eliminato");
    } else if(prev && dlen(prev.s,ks)<=12){        /* dentro o poco oltre = sposta la fine */
      prev.e=ks; delete prev.auto;
      toast("Fine spostata: ciclo di "+dlen(prev.s,ks)+" giorni");
    } else {
      cy.push({s:ks,e:null,t:k(new Date())});
      toast("Inizio segnato — ora tocca l'ultimo giorno");

  st.cycles.sort((a,b)=> a.s<b.s?-1:1);

}

function chart(ms){
  const W=320,H=176,pad=34;
  const series=[["w","Girovita","#b0441c"],["h","Fianchi","#2b5580"],["p","Peso","#2f6b4f"]].filter(s=>ms.filter(m=>m[s[0]]!=null).length>=2);
  if(!series.length) return `<div class="xs">Servono almeno due valori della stessa misura per disegnare il grafico.</div>`;
  const all=[]; series.forEach(s=>ms.forEach(m=>{ if(m[s[0]]!=null) all.push(m[s[0]]); }));
  let lo=Math.min.apply(null,all), hi=Math.max.apply(null,all); const sp=(hi-lo)||4; lo-=sp*.25; hi+=sp*.25;
  const t0=parseD(ms[0].d).getTime(), t1=parseD(ms[ms.length-1].d).getTime(), td=(t1-t0)||1;
  const X=d=>pad+(parseD(d).getTime()-t0)/td*(W-pad-12);
  const Y=v=>H-24-(v-lo)/(hi-lo)*(H-24-22);
  let g=`<svg class="chart" viewBox="0 0 ${W} ${H}">`;
  [0,.5,1].forEach(f=>{ const y=Y(lo+(hi-lo)*f);
    g+=`<line x1="${pad}" y1="${y}" x2="${W-8}" y2="${y}" stroke="#ece7e0" stroke-width="1"/><text x="3" y="${y+3.5}" font-size="9.5" fill="#9b948c">${(lo+(hi-lo)*f).toFixed(0)}</text>`; });
  series.forEach(s=>{
    const pts=ms.filter(m=>m[s[0]]!=null);
    g+=`<polyline fill="none" stroke="${s[2]}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" points="${pts.map(m=>X(m.d).toFixed(1)+","+Y(m[s[0]]).toFixed(1)).join(" ")}"/>`;
    pts.forEach(m=>g+=`<circle cx="${X(m.d).toFixed(1)}" cy="${Y(m[s[0]]).toFixed(1)}" r="3.1" fill="#fff" stroke="${s[2]}" stroke-width="2"/>`);
  });
  g+=`</svg><div style="display:flex;gap:14px;flex-wrap:wrap;margin-top:6px">`+
    series.map(s=>`<span class="xs"><span style="display:inline-block;width:9px;height:9px;border-radius:9px;background:${s[2]};margin-right:5px"></span>${s[1]}</span>`).join("")+`</div>`;
  return g;
}

/* ---------------- generatore di settimane dentro il budget ----------------
   Enumera tutte le giornate valide (calorie in range e proteine sopra soglia),
   parte dalla settimana più economica possibile e poi la "arricchisce" finché
   resta sotto il tetto di spesa. Nessun pranzo o cena si ripete nella settimana. */
const KMIN=1470, KMAX=1830, PMIN=98;
let _combos=null;
function bySlot(){
  const b={col:[],pra:[],spu:[],cen:[]};
  Object.keys(MEALS).forEach(id=>b[MEALS[id].s].push(id));
  return b;
}
function combos(){
  if(_combos) return _combos;
  const B=bySlot(), out=[];
  B.col.forEach(c=>B.pra.forEach(a=>B.spu.forEach(s2=>B.cen.forEach(e=>{
    const k=MEALS[c].k+MEALS[a].k+MEALS[s2].k+MEALS[e].k;
    const p=MEALS[c].p+MEALS[a].p+MEALS[s2].p+MEALS[e].p;
    if(k>=KMIN && k<=KMAX && p>=PMIN)
      out.push({c:c,a:a,s:s2,e:e,k:k,p:p,eur:MEALS[c].eur+MEALS[a].eur+MEALS[s2].eur+MEALS[e].eur});
  }))));
  _combos=out; return out;
}
function shuffled(arr){ const x=arr.slice(); for(let i=x.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [x[i],x[j]]=[x[j],x[i]]; } return x; }
function cheapWeek(){
  const asc=shuffled(combos()).sort((x,y)=>x.eur-y.eur);
  const uA=new Set(), uE=new Set(), days=[];
  for(const x of asc){
    if(days.length===7) break;
    if(uA.has(x.a)||uE.has(x.e)) continue;
    uA.add(x.a); uE.add(x.e); days.push(x);
  }
  return days.length===7 ? days : null;
}
function enrich(days, cap){
  const desc=shuffled(combos()).sort((x,y)=>y.eur-x.eur);
  let cost=days.reduce((a,x)=>a+x.eur,0), moved=true, guard=0;
  while(moved && guard++<40){
    moved=false;
    for(let i=0;i<7;i++){
      const uA=new Set(), uE=new Set();
      days.forEach((d,j)=>{ if(j!==i){ uA.add(d.a); uE.add(d.e); } });
      for(const x of desc){
        if(x.eur<=days[i].eur) break;                  /* desc: da qui in giù non migliora */
        if(uA.has(x.a)||uE.has(x.e)) continue;
        const nc=cost-days[i].eur+x.eur;
        if(nc<=cap){ cost=nc; days[i]=x; moved=true; break; }
      }
    }
  }
  return {days:days, cost:cost};
}
function applyWeek(days){
  const start=parseD(weekKey()), order=[1,2,3,4,5,6,0];
  order.forEach((dow,i)=>{
    for(let j=0;j<7;j++){
      const d=new Date(start); d.setDate(d.getDate()+j); d.setHours(12,0,0,0);
      if(d.getDay()===dow){ st.meals[k(d)]={col:days[i].c, pra:days[i].a, spu:days[i].s, cen:days[i].e}; }
    }
  });
  save();
}
function stats(days){
  const k2=days.reduce((a,x)=>a+x.k,0)/7, p2=days.reduce((a,x)=>a+x.p,0)/7;
  return {k:Math.round(k2), p:Math.round(p2), e:days.reduce((a,x)=>a+x.eur,0)};
}
function fitBudget(){
  const cap=budget()/4.33;
  const base=cheapWeek();
  if(!base){ toast("Non riesco a comporre la settimana"); return; }
  const floor=base.reduce((a,x)=>a+x.eur,0);
  if(floor>cap){
    applyWeek(base);
    const s2=stats(base);
    st.lastFit={ok:false, cap:cap, floor:floor, k:s2.k, p:s2.p}; save(); render();
    toast("Budget troppo stretto — leggi la nota");
    return;
  }
  const r=enrich(base, cap);
  applyWeek(r.days);
  const s2=stats(r.days);
  st.lastFit={ok:true, cap:cap, e:s2.e, k:s2.k, p:s2.p}; save(); render();
  toast("Settimana rigenerata: "+eur(s2.e));
}

/* ---------------- vista SPESA ---------------- */
function weekKey(){ const x=new Date(); x.setHours(12,0,0,0); x.setDate(x.getDate()-x.getDay()); return k(x); }
function shopRec(){
  const w=weekKey();
  st.shop = st.shop||{};
  if(!st.shop[w]) st.shop[w]={c:{},x:[]};
  Object.keys(st.shop).forEach(kk=>{ if(kk<addD(w,-28)) delete st.shop[kk]; });  /* tengo un mese */
  return st.shop[w];
}
function parseIng(s){
  const m = s.match(/^([\d.,]+)\s*(kg|g|ml|l)?\s+(.+)$/i);
  if(!m) return {q:null,u:"",n:s.trim()};
  let q=parseFloat(m[1].replace(",",".")), u=(m[2]||"").toLowerCase();
  if(u==="kg"){ q*=1000; u="g"; } if(u==="l"){ q*=1000; u="ml"; }
  return {q:q, u:u, n:m[3].trim()};
}
const SYN=[[/^uovo$/i,"uova"],[/^insalata mista$/i,"insalata"],[/^verdure (miste|di stagione|da grigliare)$/i,"verdure miste"],
  [/^pomodorini$/i,"pomodori"],[/^pomodoro$/i,"pomodori"],[/^fiocchi d'avena$/i,"avena"]];
function normIng(n){ for(const [re,v] of SYN){ if(re.test(n)) return v; } return n; }
function priceOf(name,q,u){
  for(const [re,pr,un] of PRICES){
    if(re.test(name)){
      if(un==="pz") return (q||1)*pr;
      if(q==null)   return 0.35;                       /* erbe, spezie, condimenti */
      if(u==="")    { const g=PZ_G[Object.keys(PZ_G).find(x=>name.toLowerCase().includes(x))]||150; return q*g/1000*pr; }
      return q/1000*pr;
    }
  }
  return 0.30;
}
function eur(v){ return "€ "+v.toFixed(2).replace(".",","); }
function budget(){ return st.budget || 150; }
function fmtQ(q,u){
  if(q==null) return "";
  if(u==="g"  && q>=1000) return String(Math.round(q/100)/10).replace(".",",")+" kg";
  if(u==="ml" && q>=1000) return String(Math.round(q/100)/10).replace(".",",")+" l";
  const v=String(Math.round(q*10)/10).replace(".",",");
  return u ? v+" "+u : v+" ×";
}
function shopList(){
  const start=parseD(weekKey()), bag={};
  for(let i=0;i<7;i++){
    const d=new Date(start); d.setDate(d.getDate()+i); d.setHours(12,0,0,0);
    const sel=dayMeals(k(d), d.getDay());
    ["col","pra","spu","cen"].forEach(sl=>{
      const id=sel[sl], m=MEALS[id];
      if(!m || id==="p9") return;                       /* il pasto libero non si compra */
      m.ing.forEach(raw=>{
        const it=parseIng(raw);
        let a="Altro"; for(const [re,name] of AISLE){ if(re.test(raw)){ a=name; break; } }
        it.n=normIng(it.n);
        const key=(a+"|"+it.n+"|"+it.u).toLowerCase();
        if(!bag[key]) bag[key]={a:a, n:it.n, u:it.u, q:it.q===null?null:0, key:key, e:0};
        if(it.q!==null && bag[key].q!==null) bag[key].q+=it.q;
        bag[key].e += priceOf(it.n, it.q, it.u);
      });
    });
  }
  const out={};
  Object.values(bag).forEach(x=>{ (out[x.a]=out[x.a]||[]).push(x); });
  Object.keys(out).forEach(a=>out[a].sort((x,y)=>x.n.localeCompare(y.n)));
  return out;
}
function renderSpesa(){
  const R=shopRec(), L=shopList(), start=parseD(weekKey());
  const end=new Date(start); end.setDate(end.getDate()+6);
  const all=[]; Object.keys(L).forEach(a=>L[a].forEach(x=>all.push(x.key)));
  R.x.forEach((x,i)=>all.push("x"+i));
  const done=all.filter(kk=>R.c[kk]).length;
  const fdate=d=>d.getDate()+" "+MONTHS[d.getMonth()].slice(0,3);

  let tot=0; Object.keys(L).forEach(a=>L[a].forEach(x=>tot+=x.e));
  const wTarget=budget()/4.33, over=tot>wTarget;
  let h=`<div class="card">
    <div class="row"><div><div class="xs">Settimana del</div>
      <div style="font-family:var(--serif);font-size:21px;font-weight:400;line-height:1.15;letter-spacing:-.015em">${fdate(start)} – ${fdate(end)}</div></div>
      <div style="text-align:right"><div style="font-family:var(--serif);font-size:28px;font-weight:400;line-height:1.06;letter-spacing:-.02em">${done}<span class="muted" style="font-size:15px">/${all.length}</span></div>
      <div class="xs">presi</div></div></div>
    <div class="pbar"><i style="width:${all.length?Math.round(done/all.length*100):0}%"></i></div>
    <div class="xs" style="margin-top:9px">Costruita dai piatti che hai scelto per questi sette giorni: se cambi un piatto nella scheda Cibo, la lista si aggiorna e le quantità si ricalcolano. <b>Si azzera da sola ogni domenica.</b></div></div>

  <div class="card">
    <div class="row"><div><div class="xs">Costo stimato della settimana</div>
      <div style="font-family:var(--serif);font-size:30px;font-weight:400;line-height:1.06;letter-spacing:-.02em;color:${over?"var(--clay)":"var(--ok)"}">${eur(tot)}</div></div>
      <div style="text-align:right"><div class="xs">Su ${eur(wTarget)} a settimana</div>
      <div class="xs" style="margin-top:2px">${eur(tot*4.33)} al mese</div></div></div>
    <div class="pbar"><i style="width:${Math.min(100,Math.round(tot/wTarget*100))}%;background:${over?"var(--clay)":"var(--ok)"}"></i></div>
    <div class="xs" style="margin-top:9px">${over
      ? "Sei sopra di "+eur(tot-wTarget)+". Guarda i piatti più cari nella scheda Cibo: accanto a ognuno c'è il prezzo, e sostituirne uno solo di solito basta."
      : "Sei dentro, e ti restano "+eur(wTarget-tot)+" questa settimana ("+eur((wTarget-tot)*4.33)+" al mese)."}</div>
    <div class="f" style="margin-top:12px"><label>Budget mensile per il cibo</label>
      <input type="number" inputmode="decimal" value="${budget()}" onchange="st.budget=Math.max(40,+this.value||150);save();renderSpesa()"></div>
    <button class="btn acc wide" onclick="fitBudget()">Adatta i pasti a questo budget</button>
    <div class="xs" style="margin-top:8px">Rigenera i sette giorni cercando la combinazione più ricca che ci sta dentro, rispettando calorie e proteine. <b>Sovrascrive i piatti che hai scelto a mano per questa settimana.</b></div>
    ${fitNote()}
    <div class="xs" style="margin-top:9px">I prezzi sono stime da discount italiano. Nel tuo supermercato cambieranno un po': quello che conta è il confronto fra i piatti, non la cifra esatta.</div></div>`;

  const order=["Carne","Pesce","Frigo e uova","Legumi","Pane e cereali","Frutta e verdura","Dispensa","Altro"];
  order.filter(a=>L[a]).forEach(a=>{
    h+=`<div class="sec-t">${a}</div><div class="card" style="padding-top:4px;padding-bottom:6px">`;
    L[a].forEach(x=>{
      const on=!!R.c[x.key];
      h+=`<div class="shrow ${on?"on":""}" onclick="shTick('${x.key}')">
        <span class="cb ${on?"on":""}"><svg viewBox="0 0 24 24"><path d="M4 12l6 6L20 6"/></svg></span>
        <span class="shtxt">${x.q!==null?`<span class="shq">${fmtQ(x.q,x.u)}</span>`:""}${esc(x.n)}</span>
        <span class="xs" style="white-space:nowrap;padding-top:2px">${eur(x.e)}</span></div>`;
    });
    h+=`</div>`;
  });

  h+=`<div class="sec-t">Altro che ti serve</div><div class="card" style="padding-top:4px">`;
  if(R.x.length) R.x.forEach((n,i)=>{
    const kk="x"+i, on=!!R.c[kk];
    h+=`<div class="shrow ${on?"on":""}">
      <span class="cb ${on?"on":""}" onclick="shTick('${kk}')"><svg viewBox="0 0 24 24"><path d="M4 12l6 6L20 6"/></svg></span>
      <span class="shtxt" onclick="shTick('${kk}')">${esc(n)}</span>
      <button onclick="shDel(${i})" style="color:var(--muted);padding:0 4px">✕</button></div>`;
  });
  else h+=`<div class="xs" style="padding:8px 0">Niente per ora. Aggiungi qui detersivi, caffè, quello che vuoi.</div>`;
  h+=`<div class="shadd"><input id="shi" placeholder="Aggiungi una voce" onkeydown="if(event.key==='Enter')shAdd()">
    <button class="btn" onclick="shAdd()">Aggiungi</button></div></div>`;

  h+=`<button class="btn sec wide" style="margin-top:12px" onclick="shReset()">Azzera le spunte</button>
    <div class="callout g" style="margin-top:14px"><b>Domenica sera, 40 minuti.</b> Cuoci il pollo, lessa il riso, taglia e griglia le verdure. Metà della settimana si risolve così, e nei giorni senza tempo non devi scegliere tra cucinare e mangiare male.</div>`;
  document.getElementById("v-spesa").innerHTML=h;
}
function fitNote(){
  const f=st.lastFit; if(!f) return "";
  if(f.ok) return `<div class="callout g" style="margin-bottom:0"><b>Settimana adattata al budget.</b> ${eur(f.e)} di spesa, ${f.k} kcal e ${f.p} g di proteine al giorno in media. Ho preso la combinazione più ricca che stava nel tetto di ${eur(f.cap)}: il margine che avanzava l'ho speso in piatti migliori — polipo, salmone, carne — invece di lasciarlo lì. Ripremendo il pulsante ottieni una settimana diversa allo stesso prezzo.</div>`;
  return `<div class="callout w" style="margin-bottom:0"><b>Con ${eur(f.cap)} a settimana non ci sto.</b> Ho provato tutte le combinazioni possibili: il minimo che rispetta insieme calorie e proteine è <b>${eur(f.floor)} a settimana</b>, cioè ${eur(f.floor*4.33)} al mese. Ti ho messo quella — è la settimana più economica che esista con questo ricettario, ${f.k} kcal e ${f.p} g di proteine al giorno. Sotto quella soglia non è questione di scelte furbe: tagliare ancora significa tagliare proteine, e in deficit calorico vuol dire perdere muscolo insieme al grasso. Se il budget è davvero più basso, meglio saperlo e alzarlo di qualche euro che seguire un piano che non regge.</div>`;
}
function shTick(kk){ const R=shopRec(); R.c[kk]=!R.c[kk]; save(); renderSpesa(); }
function shAdd(){ const i=document.getElementById("shi"); const v=(i.value||"").trim();
  if(!v) return; shopRec().x.push(v); save(); renderSpesa(); toast("Aggiunto"); }
function shDel(i){ const R=shopRec(); R.x.splice(i,1); R.c={}; save(); renderSpesa(); }
function shReset(){ shopRec().c={}; save(); renderSpesa(); toast("Spunte azzerate"); }

/* ---------------- vista INFO ---------------- */
function renderInfo(){
  const ph=progPhase(cur);
  let h = `<div class="sec-t">Come funziona</div>
  <div class="card"><div class="sm">Sei nella <b>Fase ${ph}</b> del programma: ${ph===1?"allenamenti in palestra, fino al 6 settembre.":"allenamenti a casa, con tappetino, sedia e zaino carico."} L'app cambia da sola le schede il 7 settembre.</div>
  <div class="g2" style="margin-top:11px">
    <button class="btn sec" onclick="setPh(1)" style="${ph===1?"background:var(--ink);color:#fff":""}">Fase 1 · palestra</button>
    <button class="btn sec" onclick="setPh(2)" style="${ph===2?"background:var(--ink);color:#fff":""}">Fase 2 · casa</button></div></div>

  <details open><summary>La strategia in due fasi</summary><div class="dc">
    <div class="sm"><b>Fase 1 — fino al 6 settembre.</b> Hai bilancieri, macchine e cavi: usali per imparare i movimenti con carico vero e per il face pull, che a casa senza attrezzi non si replica.</div>
    <div class="sm" style="margin-top:9px"><b>Fase 2 — dal 7 settembre.</b> Due bottiglie da 1,5 L sono 3 kg: come carico non bastano, e va bene così. A casa la progressione non passa dai chili ma da leve più lunghe, appoggi su una gamba sola, discese rallentate e giri in più.</div>
    <div class="callout g" style="margin-bottom:0"><b>L'unica cosa da comprare: elastici a fasce, 25–30 €.</b> Sbloccano tutte le trazioni orizzontali, che sono esattamente i movimenti di cui hanno bisogno le tue spalle. In alternativa gratis: uno zaino con 8–12 kg di libri.</div></div></details>

  <details><summary>I tuoi numeri</summary><div class="dc">
    <table><tbody>
      <tr><td>Mantenimento stimato</td><td class="n"><b>1.950 kcal</b></td></tr>
      <tr><td>Media obiettivo</td><td class="n"><b>1.650 kcal</b></td></tr>
      <tr><td>Proteine al giorno</td><td class="n"><b>100–110 g</b></td></tr>
      <tr><td>Pavimento invalicabile</td><td class="n"><b>1.400 kcal</b></td></tr>
      <tr><td>Ritmo atteso</td><td class="n"><b>−0,35 kg / sett.</b></td></tr>
      <tr><td>Budget cibo</td><td class="n"><b>~149 € / mese</b></td></tr>
    </tbody></table>
    <div class="xs" style="margin-top:10px">Stima su 20 anni, 162 cm, 65 kg, donna, con tre allenamenti e camminate quotidiane.</div></div></details>

  <details><summary>"Slim" con struttura ossea robusta</summary><div class="dc">
    <div class="sm"><b>Quello che non cambia:</b> larghezza delle spalle, polso, gabbia toracica, bacino. È scheletro, e nessun allenamento lo modifica. Chi promette il contrario ti sta vendendo qualcosa.</div>
    <div class="sm" style="margin-top:9px"><b>Quello che cambia moltissimo:</b> lo strato di grasso sopra, la circonferenza del punto vita e la postura. Sono questi tre — non le ossa — a decidere se una persona legge come slim. Struttura robusta con poco grasso e spalle aperte viene letta come asciutta e atletica; la stessa struttura con qualche chilo in più e le spalle chiuse viene letta come massiccia.</div>
    <div class="sm" style="margin-top:9px">Per questo il piano usa ripetizioni alte e carichi moderati, molto volume su schiena, core e glutei, poco su spinta e braccia, e tre uscite di cardio. I pesi restano: senza, perdi peso <em>e</em> muscolo insieme, e il risultato è più piccolo ma molle.</div></div></details>

  <details><summary>Il ciclo, fase per fase</summary><div class="dc">
    <div class="callout" style="margin-top:0"><b>Come fa l'app a saperlo, con un ciclo irregolare.</b> Non usa un ciclo teorico di 28 giorni: misura i tuoi intervalli reali dai giorni che segni sul calendario. E siccome la parte variabile di un ciclo irregolare è quasi sempre la prima metà mentre la fase luteale dura sempre 12–14 giorni, l'ovulazione viene stimata <em>all'indietro</em> dalla lunghezza dei tuoi cicli, non contando in avanti dal primo giorno. Più cicli segni, più la finestra si stringe. Quando la variabilità resta alta l'app te lo dice invece di fingere precisione.</div>
    <table><thead><tr><th>Fase</th><th>Come cambia il piano</th></tr></thead><tbody>
    <tr><td><b>Mestruale</b><br><span class="xs">giorni segnati · 1.550 kcal</span></td><td class="sm">Volume ridotto del 20–30%. Se stai male, camminata. Occhio al ferro.</td></tr>
    <tr><td><b>Follicolare</b><br><span class="xs">fino all'ovulazione · 1.550 kcal</span></td><td class="sm">La finestra migliore: qui alzi i carichi e provi le progressioni nuove.</td></tr>
    <tr><td><b>Ovulatoria</b><br><span class="xs">finestra stimata · 1.650 kcal</span></td><td class="sm">Picco di forza ma legamenti più lassi: niente salti, cura gli atterraggi.</td></tr>
    <tr><td><b>Luteale</b><br><span class="xs">ultimi 12–14 giorni · 1.800 kcal</span></td><td class="sm">Tutto sembra più faticoso: mantieni la frequenza, non cercare record. Ritenzione idrica di 1–2 kg: ignora la bilancia.</td></tr>
    </tbody></table>
    <div class="callout w" style="margin-bottom:0"><b>Il segnale da non ignorare.</b> Se il ciclo diventa irregolare o sparisce, fermati e risali con le calorie. Non è un effetto collaterale dell'allenamento: è il corpo che segnala energia insufficiente, e trascinarlo per mesi ha conseguenze sulla densità ossea. È il motivo per cui il pavimento delle 1.400 kcal non è un consiglio ma un limite. Parlane con un medico.</div></div></details>

  <details><summary>Il ferro</summary><div class="dc">
    <div class="sm">È la carenza più diffusa tra le ragazze che si allenano e passa quasi sempre inosservata: le perdite mestruali si sommano al deficit calorico e il risultato è stanchezza cronica, fiato corto e allenamenti sempre più duri del dovuto — che quasi tutte scambiano per un limite personale.</div>
    <div class="sm" style="margin-top:9px">Due accortezze che valgono più della quantità: <b>abbina sempre vitamina C</b> al ferro vegetale (limone su legumi e spinaci, pomodoro nell'insalata), e <b>non bere tè o caffè durante i pasti principali</b>, perché lo bloccano. Se dopo 4–6 settimane sei stanca in modo anomalo, chiedi al medico emocromo e ferritina.</div></div></details>

  <details><summary>Mangiare così con 150 € al mese</summary><div class="dc">
    <div class="sm">Il piano costa circa <b>34 € a settimana, 149 € al mese</b> a prezzi pieni da discount. Sta dentro il budget, ma senza avanzo: per lasciarti dei soldi servono le tre abitudini qui sotto, che valgono realisticamente il 15–20% — cioè 20–30 € al mese.</div>
    <div class="callout" style="margin-bottom:9px"><b>Perché ho abbassato le proteine da 115 a 100 g.</b> Non è una rinuncia dettata dal budget: 115 g erano 1,8 g per chilo, più del necessario. Per proteggere il muscolo in deficit ne bastano 1,5–1,6, cioè 100–105 g per te. Erano soldi spesi per un margine che non ti serviva.</div>
    <h4 style="margin-top:0">Le tre leve vere</h4>
    <ul class="clean small">
      <li><b>Legumi secchi, non in scatola.</b> Un chilo di ceci secchi fa quasi tre chili di ceci cotti e costa 2,50 €; la stessa quantità in barattolo ne costa 7. Ammollo la sera, cottura la domenica, porzioni in frigo. Sono ~10 € al mese di differenza sul piatto più ricorrente del piano.</li>
      <li><b>Verdure surgelate.</b> Costano la metà delle fresche, hanno gli stessi valori nutrizionali e soprattutto <em>non marciscono</em>: buttare via mezza busta d'insalata è la perdita più comune e invisibile di tutte.</li>
      <li><b>Le proteine solo in offerta, e le congeli.</b> Pollo, uova e tonno vanno a promozione di continuo. Comprane la confezione grande quando costa poco, dividila in porzioni e mettila nel congelatore — anche se ne hai poco, le porzioni piatte in busta occupano pochissimo.</li>
    </ul>
    <h4>La classifica delle proteine per prezzo</h4>
    <table><thead><tr><th>Alimento</th><th class="n">€ ogni 10 g di proteine</th></tr></thead><tbody>
      <tr><td>Lenticchie e ceci secchi</td><td class="n"><b>0,15</b></td></tr>
      <tr><td>Latte</td><td class="n"><b>0,38</b></td></tr>
      <tr><td>Uova</td><td class="n"><b>0,40</b></td></tr>
      <tr><td>Sovracosce di pollo</td><td class="n"><b>0,24</b></td></tr>
      <tr><td>Petto di pollo</td><td class="n"><b>0,27</b></td></tr>
      <tr><td>Tonno in scatola</td><td class="n"><b>0,42</b></td></tr>
      <tr><td>Yogurt greco</td><td class="n"><b>0,44</b></td></tr>
      <tr><td>Polipo</td><td class="n"><b>0,67</b></td></tr>
      <tr><td>Manzo magro</td><td class="n"><b>0,62</b></td></tr>
      <tr><td>Trancio di salmone</td><td class="n"><b>1,00</b></td></tr>
      <tr><td>Salmone affumicato</td><td class="n"><b>1,50</b></td></tr>
    </tbody></table>
    <div class="callout g"><b>Il polipo e il salmone restano.</b> Non li ho tolti: li ho spostati fuori dalla settimana predefinita e messi nel ricettario col prezzo accanto. Una cena di polipo costa 3,65 € contro 1,50 di una frittata: sono due euro, non un lusso irraggiungibile. Scegli tu quando spenderli — la scheda Spesa ti dice in tempo reale se ci stai dentro.</div>
    <div class="callout"><b>Il conto che fa più male.</b> Una pizza fuori è 6 €. Una volta a settimana fa 26 € al mese, cioè un sesto del budget alimentare. Nella settimana predefinita ho messo la pizza fatta in casa: 1,30 € e viene buona. Se poi vuoi uscire con le amiche, che è una cosa sana, sai esattamente quanto ti costa e da dove tirarlo fuori.</div></div></details>

  <details><summary>Le 6 regole alimentari</summary><div class="dc"><table><tbody>
    <tr><td class="sm"><b>1 · Proteine a ogni pasto.</b> Un palmo di mano, senza pesare niente. L'unica abitudine che da sola cambia la composizione corporea.</td></tr>
    <tr><td class="sm"><b>2 · Metà piatto di verdura</b> a pranzo e cena. Riempie lo stomaco con 40 calorie invece che con 400.</td></tr>
    <tr><td class="sm"><b>3 · Zero calorie liquide.</b> Bibite, succhi e alcolici sono calorie che non registri e che non saziano. 2–2,5 litri d'acqua al giorno.</td></tr>
    <tr><td class="sm"><b>4 · La regola dei tortellini.</b> Non li elimini: li pesi, 110–120 g crudi, con accanto proteine e verdura.</td></tr>
    <tr><td class="sm"><b>5 · Due pasti liberi, pianificati.</b> Non sgarri: pasti decisi in anticipo e già dentro i conti.</td></tr>
    <tr><td class="sm"><b>6 · Dormi 7–8 ore.</b> Il moltiplicatore invisibile: con 5 ore hai più fame, meno forza e recuperi peggio.</td></tr>
  </tbody></table></div></details>

  <details><summary>Le cinque cose da non fare</summary><div class="dc"><table><tbody>
    <tr><td class="sm"><b>Non scendere sotto 1.400 kcal.</b> È il punto in cui si smonta muscolo insieme al grasso, e il muscolo è ciò che rende il risultato tonico invece che molle.</td></tr>
    <tr><td class="sm"><b>Non fare addominali per togliere la pancia.</b> Il dimagrimento localizzato non esiste, per nessuno.</td></tr>
    <tr><td class="sm"><b>Non saltare i giorni storti: falli ridotti.</b> Dieci minuti valgono infinitamente più di zero.</td></tr>
    <tr><td class="sm"><b>Non cambiare piano prima di quattro settimane.</b> È il modo più elegante per non progredire mai su niente.</td></tr>
    <tr><td class="sm"><b>Non forzare le spalle per sbloccarle.</b> Range ridotto ripetuto ogni giorno, non un'ora di stretching aggressivo a settimana.</td></tr>
  </tbody></table></div></details>

  <details><summary>Cosa aspettarsi, onestamente</summary><div class="dc"><table><tbody>
    <tr><td><b>Sett. 1–2</b></td><td class="sm">Dolori muscolari, sonno migliore, peso che oscilla senza scendere. Normale: il muscolo trattiene acqua e maschera il grasso perso.</td></tr>
    <tr><td><b>Sett. 3–4</b></td><td class="sm">Carichi e ripetizioni salgono in fretta. Le spalle si aprono, la postura cambia. Primo calo sul girovita.</td></tr>
    <tr><td><b>Sett. 5–8</b></td><td class="sm">Il peso scende regolare, circa 1,5 kg al mese. Il fiato cambia in modo evidente sulle scale.</td></tr>
    <tr><td><b>Sett. 9–12</b></td><td class="sm">Cambia la forma, non solo il numero: vita più stretta, gambe più asciutte, linea più definita.</td></tr>
  </tbody></table></div></details>

  <div class="xs" style="margin:18px 0 8px;line-height:1.6"><b>Nota.</b> Questo piano è costruito su dati generali e sulle informazioni che hai fornito: non sostituisce il parere di un medico o di un professionista dell'esercizio fisico. Se compaiono dolore articolare persistente, vertigini, dolore al petto o affanno anomalo, fermati e senti un medico.</div>`;
  document.getElementById("v-info").innerHTML = h;
}
function setPh(p){ st.phaseOverride = (st.phaseOverride===p) ? null : p; save(); render();
  toast(st.phaseOverride ? "Fase forzata manualmente" : "Fase automatica ripristinata"); }

/* ---------------- render / nav ---------------- */
function render(){
  document.getElementById("hDate").textContent = cur.getDate()+" "+MONTHS[cur.getMonth()]+" "+cur.getFullYear();
  document.getElementById("hDay").textContent = DAYS[cur.getDay()];
  renderOggi(); renderCibo(); renderSpesa(); renderProg(); renderInfo();
}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll("nav button").forEach(x=>x.classList.remove("on")); b.classList.add("on");
  document.querySelectorAll(".view").forEach(v=>v.classList.remove("on"));
  document.getElementById("v-"+b.dataset.v).classList.add("on"); window.scrollTo(0,0);
});
document.getElementById("bPrev").onclick=()=>{ cur.setDate(cur.getDate()-1); render(); };
document.getElementById("bNext").onclick=()=>{ cur.setDate(cur.getDate()+1); render(); };
document.getElementById("bToday").onclick=()=>{ cur=new Date(); cur.setHours(12,0,0,0); render(); };
render();

</script>

/* ============================================================
   CONFERMARE I PIATTI
   ------------------------------------------------------------
   Un piatto confermato non cambia più da solo: né quando togli
   un ingrediente, né quando il pianificatore rifà la settimana.
   È quello che rende affidabile la lista della spesa.
   ============================================================ */
function lockKey(key, slot){ return key + "|" + slot; }
function isLocked(key, slot){ return !!(st.lock||{})[lockKey(key, slot)]; }
function setLock(key, slot, id, on){
  st.lock = st.lock || {};
  const kk = lockKey(key, slot);
  if(on){
    st.meals = st.meals || {}; st.meals[key] = st.meals[key] || {};
    st.meals[key][slot] = id;
    st.lock[kk] = 1;
  } else delete st.lock[kk];
}
function toggleLock(key, slot, id){
  const was = isLocked(key, slot);
  setLock(key, slot, id, !was);
  save(); render();
  toast(was ? "Non è più confermato" : "Confermato: entra nella spesa così com'è");
}
/* la settimana della spesa parte di domenica, come la lista */
function shopWeekDays(){
  const s = parseD(weekKey()), out = [];
  for(let i=0;i<7;i++){ const d = new Date(s); d.setDate(d.getDate()+i); d.setHours(12,0,0,0); out.push(d); }
  return out;
}
function lockStats(){
  let n = 0, tot = 0;
  shopWeekDays().forEach(d=>{
    const key = k(d), sel = dayMeals(key, d.getDay());
    slots().forEach(s=>{ if(!sel[s]) return; tot++; if(isLocked(key, s)) n++; });
  });
  return {n:n, tot:tot};
}
function confirmWeek(){
  shopWeekDays().forEach(d=>{
    const key = k(d), sel = dayMeals(key, d.getDay());
    slots().forEach(s=>{ if(sel[s]) setLock(key, s, sel[s], true); });
  });
  save(); render(); toast("Settimana confermata. La spesa è questa.");
}
function unlockWeek(){
  shopWeekDays().forEach(d=>{ const key = k(d); slots().forEach(s=>setLock(key, s, null, false)); });
  save(); render(); toast("Settimana sbloccata: i piatti possono cambiare");
}
function lockCard(){
  const L = lockStats(), tutti = L.n === L.tot && L.tot > 0;
  return `<div class="card"><div class="row">
      <div><div class="mslot">Piatti confermati</div>
        <div style="font-family:var(--disp);font-weight:var(--disp-w);font-size:26px;letter-spacing:var(--disp-ls);margin-top:3px">${L.n}<span class="muted" style="font-size:15px">/${L.tot}</span></div></div>
      <button class="btn ${tutti?"sec":"acc"}" style="padding:11px 15px" onclick="${tutti?"unlockWeek()":"confirmWeek()"}">${tutti?"Sblocca":"Conferma tutti"}</button></div>
    <div class="xs" style="margin-top:11px">${tutti
      ? "Tutti i piatti della settimana sono fissi: questa lista non cambia più finché non li sblocchi."
      : "Finché un piatto non è confermato può ancora cambiare — se togli un ingrediente o se rigeneri la settimana. Conferma quello che sei sicura di cucinare e la lista diventa affidabile."}</div></div>`;
}

/* ============================================================
   EQUILIBRIO DELLA GIORNATA
   ------------------------------------------------------------
   Le calorie non dicono se la giornata sta in piedi: pollo e
   patate a pranzo e pizza a cena possono tornare come numero e
   restare una giornata sbilanciata. Qui si guardano quattro
   cose — proteine, carboidrati, grassi, ferro — e si dice in
   una riga cosa manca e cosa avanza.
   I carboidrati sono stimati dagli ingredienti, come il ferro:
   servono a dare la direzione, non il grammo esatto.
   ============================================================ */
const CARB = [
  [/avena/i,60], [/tortellini/i,50], [/pasta/i,72], [/riso/i,78], [/cuscus/i,72],
  [/crostini|pane/i,45], [/farina/i,73], [/cornetto/i,45], [/pizza/i,33], [/patate/i,17],
  [/lenticchie|ceci|borlotti|fagioli/i,18],
  [/gnocchi/i,32], [/quinoa/i,64], [/zucca/i,7], [/funghi/i,3],
  [/fiocchi di latte/i,3], [/feta/i,1], [/formaggio spalmabile|stracchino/i,4], [/bresaola/i,0], [/avocado/i,9],
  [/banana/i,23], [/miele/i,80], [/cioccolato/i,30], [/mandorle|noci/i,9],
  [/frutti di bosco|fragol/i,7], [/mela|pera|arance|spremuta|frutta/i,12],
  [/yogurt/i,4], [/latte/i,5], [/ricotta/i,3], [/mozzarella/i,2], [/grana/i,0],
  [/passata|pomodor/i,4], [/verdur|insalata|zucchin|peperon|spinaci|cipolla|carot|rucola|funghi/i,5],
  [/uov/i,0], [/pollo|tacchino|manzo|sovracosce|tonno|salmone|polipo/i,0], [/olio/i,0]
];
function carbOf(name, q, u){
  for(const [re, g] of CARB){
    if(re.test(name)){
      if(q == null) return 0;
      if(u === ""){ const pz = PZ_G[Object.keys(PZ_G).find(x=>name.toLowerCase().includes(x))] || 150; return q*pz/100*g; }
      return q/100*g;
    }
  }
  return 0;
}
function mealCarb(id){
  const m = MEALS[id]; if(!m) return 0;
  let c = 0;
  (m.ing||[]).forEach(raw=>{ const it = parseIng(raw); c += carbOf(it.n, it.q, it.u); });
  return Math.round(c);
}

/* ---------------- i conti della giornata ---------------- */
function macrosOf(sel, key){
  let kc = 0, pr = 0, ca = 0, fe = 0;
  slots().forEach(s=>{
    const id = sel[s], m = MEALS[id]; if(!m) return;
    kc += m.k; pr += m.p; ca += mealCarb(id); fe += mealIron(id).mg;
  });
  const X = extraSum(key || todayKey());
  kc += X.k; pr += X.p;
  const fat = Math.max(0, (kc - 4*pr - 4*ca) / 9);
  return {kc:kc, p:pr, c:ca, f:Math.round(fat), fe:Math.round(fe*10)/10,
          pQ:kc? 4*pr/kc : 0, cQ:kc? 4*ca/kc : 0, fQ:kc? 9*fat/kc : 0};
}
/* ---------------- il giudizio ---------------- */
function balance(M){
  const tp = goal().prot;
  const out = [];
  if(M.p < tp*0.85) out.push({t:"Poche proteine", c:"var(--clay)", d:"Sei a " + M.p + " g su " + tp + ". Sono quelle che tengono il muscolo mentre dimagrisci: sposta uno spuntino su yogurt greco o uova."});
  if(M.cQ > 0.60)   out.push({t:"Troppi carboidrati", c:"var(--clay)", d:Math.round(M.cQ*100) + "% delle calorie viene da pane, pasta, riso e patate. Non è un veleno, ma a parità di calorie sazia meno e lascia meno spazio a proteine e verdure."});
  if(M.cQ < 0.30 && M.kc > 800) out.push({t:"Pochi carboidrati", c:"var(--sky)", d:"Solo il " + Math.round(M.cQ*100) + "%. Con tre allenamenti a settimana servono: sono la benzina delle sedute, e tagliarli fa sembrare tutto più faticoso."});
  if(M.fQ < 0.18 && M.kc > 800) out.push({t:"Pochi grassi", c:"var(--sky)", d:"Sotto il 20% delle calorie. Servono per gli ormoni — e con il ciclo irregolare non è un dettaglio. Un cucchiaio d'olio, frutta secca o un uovo in più."});
  if(M.fe < IRON_TARGET*0.7) out.push({t:"Ferro basso", c:"var(--clay)", d:"Sei a " + M.fe + " mg su " + IRON_TARGET + ". Cerca i piatti con l'etichetta del ferro, e metti qualcosa di acido nello stesso pasto: limone o pomodoro."});
  if(!out.length) return {t:"Equilibrato", c:"var(--ok)", d:"Proteine, carboidrati, grassi e ferro sono tutti dove devono stare.", ok:true};
  return {t:out[0].t, c:out[0].c, d:out[0].d, more:out.length-1, ok:false};
}
function dayBalance(key, dow){ return balance(macrosOf(dayMeals(key, dow), key)); }
/* come cambierebbe se al posto di un piatto ne mettessi un altro */
function balanceIf(key, dow, slot, id){
  const sel = Object.assign({}, dayMeals(key, dow)); sel[slot] = id;
  return balance(macrosOf(sel, key));
}
function balanceCard(key, dow){
  const M = macrosOf(dayMeals(key, dow), key), B = balance(M);
  /* ogni barra ha la sua tacca: dove dovrebbe stare. Così il numero da solo
     non deve significare niente — si guarda se la barra arriva alla tacca. */
  const bar = (lab, q, tick, col, txt) =>
    '<div class="mbar"><span>' + lab + '</span><i>'
    + '<b style="width:' + Math.min(100, Math.round(q*100)) + '%;background:' + col + '"></b>'
    + '<u style="left:calc(' + Math.min(100, Math.round(tick*100)) + '% - 1px)"></u></i>'
    + '<em>' + txt + '</em></div>';
  const tp = goal().prot;
  const pTick = M.kc ? 4*tp/M.kc : 0.25;
  const it = n => String(Math.round(n*10)/10).replace(".", ",");
  return '<div class="card"><div class="row">'
    + '<span class="bstat" style="color:' + B.c + ';border-color:' + B.c + '">' + B.t + '</span>'
    + '<span class="xs">' + M.kc + ' kcal</span></div>'
    + '<div class="sm" style="margin-top:9px">' + esc(B.d) + '</div>'
    + '<div style="margin-top:11px">'
    + bar("Proteine",    M.pQ, pTick, "var(--ok)",     M.p + "/" + tp + " g")
    + bar("Carboidrati", M.cQ, 0.48,  "var(--sage-2)", M.c + " g · " + Math.round(M.cQ*100) + "%")
    + bar("Grassi",      M.fQ, 0.28,  "var(--lilac)",  M.f + " g · " + Math.round(M.fQ*100) + "%")
    + bar("Ferro", M.fe/(IRON_TARGET*1.35), 1/1.35, "var(--clay)", it(M.fe) + "/" + IRON_TARGET + " mg")
    + '</div>'
    + '<div class="xs" style="margin-top:9px">La tacca su ogni barra è il punto dove dovrebbe arrivare.</div>'
    + '</div>';
}
/* etichetta piccola per la lista delle alternative:
   compare solo se scegliendo quel piatto la giornata cambia giudizio */
function balanceTag(key, dow, slot, id){
  const now = dayBalance(key, dow), B = balanceIf(key, dow, slot, id);
  if(B.t === now.t) return "";
  return '<span class="bdg" style="color:' + B.c + '">→ ' + (B.ok ? "equilibrata" : B.t.toLowerCase()) + '</span>';
}
/* etichetta del ferro, da mettere insieme alle altre */
function ironBadge(id){
  const mg = mealIron(id).mg;
  if(mg >= 4.5) return '<span class="bdg" style="color:var(--ok)">Ferro alto</span>';
  if(mg <= 1)   return '<span class="bdg" style="color:var(--clay)">Ferro scarso</span>';
  return "";
}

/* ---------------- quante calorie farebbe la giornata ---------------- */
function kcalIf(key, dow, slot, id){
  const sel = Object.assign({}, dayMeals(key, dow)); sel[slot] = id;
  let kc = 0;
  slots().forEach(s=>{ const m = MEALS[sel[s]]; if(m) kc += m.k; });
  return kc + extraSum(key).k;
}
/* il numero della giornata se scegliessi quel piatto, rosso se sfori */
function kcalTag(key, dow, slot, id, target){
  const tot = kcalIf(key, dow, slot, id), d = tot - target;
  const col = d > 130 ? "var(--clay)" : d < -130 ? "var(--sky)" : "var(--ok)";
  return '<div style="color:' + col + ';font-weight:700;margin-top:3px">' + tot
    + '<span style="font-weight:400;font-size:9.5px"> kcal · ' + (d>0?"+":"") + d + '</span></div>';
}

/* ============================================================
   SALVATAGGIO AUTOMATICO
   ------------------------------------------------------------
   Tre livelli, dal più automatico al più sicuro:
   1. ogni tocco è già salvato subito nella memoria del telefono
   2. a ogni apertura l'app tiene da parte una copia del giorno,
      e ne conserva cinque: se qualcosa va storto torni indietro
   3. ogni due settimane ti chiede il backup su file, che è
      l'unico che sopravvive se cancelli i dati del browser
   Un salvataggio davvero automatico fuori dal telefono non è
   possibile senza un account e un server: questa è una pagina
   che gira solo a casa tua.
   ============================================================ */
const SNAP = "pianoForma_snap_";
const BK_OGNI = 14;

function snapKeys(){
  const out = [];
  try{
    for(let i=0;i<localStorage.length;i++){
      const kk = localStorage.key(i);
      if(kk && kk.indexOf(SNAP) === 0) out.push(kk);
    }
  }catch(e){}
  return out.sort();
}
function autoSnap(){
  const kk = SNAP + todayKey();
  try{ if(localStorage.getItem(kk)) return; }catch(e){ return; }
  const dati = JSON.stringify(st);
  /* se la memoria è piena, butta la copia più vecchia e riprova:
     meglio quattro copie che nessuna */
  for(let giro=0; giro<5; giro++){
    try{ localStorage.setItem(kk, dati); break; }
    catch(e){ const keys = snapKeys(); if(!keys.length) return; try{ localStorage.removeItem(keys[0]); }catch(e2){ return; } }
  }
  try{ const keys = snapKeys(); while(keys.length > 5) localStorage.removeItem(keys.shift()); }catch(e){}
}
function snapDate(kk){ return kk.slice(SNAP.length); }
function snapSize(kk){
  try{ return Math.max(1, Math.round((localStorage.getItem(kk)||"").length/1024)) + " kB"; }catch(e){ return ""; }
}
function restoreSnap(kk){
  let d; try{ d = JSON.parse(localStorage.getItem(kk)); }catch(e){}
  if(!d) return toast("Copia illeggibile");
  if(!confirm("Tornare alla copia del " + fmtIt(snapDate(kk)) + "? Quello che hai fatto dopo si perde.")) return;
  st = Object.assign(stVuoto(), d);
  _combos = null; _mc = null; _mf = null;        /* il pianificatore deve ripartire da zero */
  migrate(); save(); applySkin(); render();
  toast("Ripristinata la copia del " + fmtIt(snapDate(kk)));
}

/* ---------------- il backup su file ---------------- */
function bkDays(){
  if(!st.bkLast) return 999;
  return Math.round((parseD(todayKey()) - parseD(st.bkLast)) / DAYMS);
}
/* quanto avresti da perdere: finché non c'è niente dentro, chiedere un
   backup il primo giorno è solo rumore */
function bkRoba(){
  return (st.meas||[]).length + (st.cycles||[]).length
       + Object.keys(st.done||{}).length + Object.keys(st.log||{}).length;
}
function bkDue(){ return bkRoba() >= 6 && bkDays() >= BK_OGNI; }
function doBackup(){
  expData();
  st.bkLast = todayKey(); save(); render();
}
function bkCard(){
  if(!bkDue()) return "";
  const mai = !st.bkLast;
  return '<div class="callout"><b>' + (mai ? "Non hai mai fatto un backup." : "Sono passate due settimane dall'ultimo backup.") + '</b> '
    + 'Un tocco e scarichi il file con tutto: misure, ciclo, spunte, scelte. '
    + 'È l\'unica copia che resta se cambi telefono o cancelli i dati del browser.'
    + '<br><br><button class="btn wide" onclick="doBackup()">Scarica il backup</button></div>';
}
function bkCardSet(){
  const snaps = snapKeys().slice().reverse();
  let h = '<div class="sec-t">Salvataggio</div><div class="card">'
    + '<div class="sm">Ogni cosa che tocchi è salvata subito nella memoria del telefono: non devi fare niente. '
    + 'Qui sotto ci sono le copie che l\'app tiene da parte da sola, una al giorno, le ultime cinque.</div>';
  if(snaps.length){
    h += '<div style="margin-top:11px">' + snaps.map(kk=>
      '<div class="altitem" onclick="restoreSnap(\'' + kk + '\')">'
      + '<div><b style="font-size:14px">Copia del ' + fmtIt(snapDate(kk)) + '</b>'
      + '<div class="xs">' + snapSize(kk) + ' · tocca per tornare a questa</div></div>'
      + '<div class="mmac">›</div></div>').join("") + '</div>';
  }
  h += '<div class="xs" style="margin-top:10px">'
    + (st.bkLast ? 'Ultimo backup su file: <b>' + fmtIt(st.bkLast) + '</b>, ' + bkDays() + ' giorni fa.'
                 : 'Non hai ancora scaricato nessun backup su file.')
    + ' Le copie qui sopra vivono nello stesso telefono: se cancelli i dati del browser spariscono anche loro. Il file no.</div>'
    + '<div class="g2" style="margin-top:12px">'
    + '<button class="btn" onclick="doBackup()">Scarica backup</button>'
    + '<label class="btn sec" style="cursor:pointer">Importa<input type="file" accept="application/json" style="display:none" onchange="impData(this)"></label></div>'
    + '</div>';
  return h + datiCard();
}

/* ---------------- dove vivono i tuoi dati ---------------- */
function datiCard(){
  return '<div class="sec-t">I tuoi dati</div><div class="card">'
    + '<div class="sm">Tutto quello che segni resta nella memoria del browser di <em>questo</em> dispositivo. '
    + 'Non passa da nessun server: non lo vede nessuno, nemmeno chi ha scritto l\'app. '
    + 'Vuol dire però due cose — telefono e computer <b>non sono collegati</b> fra loro, e se cancelli i dati '
    + 'di navigazione spariscono anche i progressi. Tieni un solo dispositivo come quello "ufficiale".</div>'
    + '<button class="btn sec wide" style="margin-top:12px;color:#a33" onclick="wipe()">Cancella tutti i dati</button>'
    + '</div>';
}

</script>
<script>
/* ============================================================
   LOGICA APP
   ============================================================ */
const KEY = "pianoForma_v1";
const PHASE2_START = "2026-09-07";
const DAYS = ["Domenica","Lunedì","Martedì","Mercoledì","Giovedì","Venerdì","Sabato"];
const MONTHS = ["gennaio","febbraio","marzo","aprile","maggio","giugno","luglio","agosto","settembre","ottobre","novembre","dicembre"];

let st = load();
let cur = new Date(); cur.setHours(12,0,0,0);
let view = "oggi";

/* la forma minima che il resto dell'app dà per scontata: qualunque cosa
   arrivi da una versione vecchia o da un backup viene rivestita di questa,
   altrimenti la prima schermata muore su una chiave che non c'è */
function stVuoto(){
  return { cycles:[], done:{}, log:{}, meals:{}, meas:[], phaseOverride:null,
           goal:"cut", prices:{}, shop:{}, taste:{}, no:[], lock:{}, leftover:{}, extras:{} };
}
function load(){
  try{ const r = localStorage.getItem(KEY); if(r) return Object.assign(stVuoto(), JSON.parse(r)); }catch(e){}
  /* recupera i dati di una versione precedente, qualunque nome avesse la chiave */
  try{
    for(let i=0;i<localStorage.length;i++){
      const kk = localStorage.key(i);
      if(kk && kk !== KEY && /^piano.*_v1$/.test(kk)){
        const old = localStorage.getItem(kk);
        if(old) return Object.assign(stVuoto(), JSON.parse(old));
      }
    }
  }catch(e){}
  return stVuoto();
}
function migrate(){
  if(!st.cycles) st.cycles=[];
  if(st.periods && st.periods.length){          /* elenco di giorni -> intervalli */
    const ds=[...new Set(st.periods)].sort(); let c=null;
    ds.forEach(x=>{
      if(c && Math.round((parseD(x)-parseD(c.e))/86400000)<=2) c.e=x;
      else { c={s:x,e:x}; st.cycles.push(c); }
    });
  }
  delete st.periods;
  if(st.cycleStart){                            /* data singola -> ciclo aperto */
    if(!st.cycles.some(c=>c.s===st.cycleStart)) st.cycles.push({s:st.cycleStart,e:null});
    delete st.cycleStart; delete st.cycleLen;
  }
  st.cycles.sort((a,b)=> a.s<b.s?-1:1);
}
migrate();

/* ---------------- pelli ---------------- */
const SKINS = [
  {k:"vetro",   n:"Vetro",   d:"Sfumatura salvia, schede di vetro"},
  {k:"notte",   n:"Notte",   d:"Fondo scuro, il verde come luce"},
  {k:"blocchi", n:"Blocchi", d:"Tessere piene, maiuscolo netto"}
];
function skinKey(){ return st.skin || "vetro"; }
function applySkin(){
  document.documentElement.dataset.skin = skinKey();
  const m = document.querySelector('meta[name="theme-color"]');
  if(m) m.setAttribute("content", skinKey()==="notte" ? "#131611" : skinKey()==="blocchi" ? "#a8b5a0" : "#f4f7f1");
}
function setSkin(v){ st.skin=v; save(); applySkin(); render();
  const o=SKINS.find(x=>x.k===v); toast(o?o.n:""); }
function cycleSkin(){ const i=SKINS.findIndex(x=>x.k===skinKey()); setSkin(SKINS[(i+1)%SKINS.length].k); }
function skinCard(){
  return `<div class="sec-t">Aspetto</div><div class="card">
    <div class="skinrow">${SKINS.map(o=>`<button class="${o.k===skinKey()?"on":""}" onclick="setSkin('${o.k}')">
      <s class="sk-${o.k}"></s>${o.n}</button>`).join("")}</div>
    <div class="xs" style="margin-top:11px">${esc((SKINS.find(o=>o.k===skinKey())||{}).d||"")}. Si cambia anche col cerchietto in alto.</div></div>`;
}

/* ---------------- testi: la riga si vede, il resto sta chiuso ---------------- */
function firstSent(t){ const m=String(t||"").match(/^[^.!?]*[.!?]/); return m ? m[0].trim() : String(t||""); }
function why(t, lab){
  t = String(t||"").trim(); if(!t) return "";
  return `<details class="why"><summary>${esc(lab||"perché")}</summary><div class="dc"><div class="sm">${esc(t)}</div></div></details>`;
}
function splitAdv(t){
  const f=firstSent(t), r=String(t||"").slice(f.length).trim();
  return {f:f, r:r};
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(st)); }catch(e){ toast("Salvataggio non riuscito"); } }
function k(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function parseD(s){ const p=s.split("-"); const d=new Date(+p[0],+p[1]-1,+p[2]); d.setHours(12,0,0,0); return d; }
function dayRec(key){ if(!st.done[key]) st.done[key]={ex:{},mob:{},steps:false}; const r=st.done[key];
  if(!r.ex)r.ex={}; if(!r.mob)r.mob={}; return r; }
function toast(m){ const t=document.getElementById("toast"); t.textContent=m; t.classList.add("on"); clearTimeout(t._x); t._x=setTimeout(()=>t.classList.remove("on"),1900); }
function fmtIt(ks){ const p=ks.split("-"); return p[2]+"/"+p[1]+"/"+p[0]; }
function fmtItShort(ks){ const p=ks.split("-"); return p[2]+"/"+p[1]; }
function parseIt(v){                      /* "16/08/2026" -> "2026-08-16" */
  const m=String(v||"").match(/^(\d{1,2})\D(\d{1,2})\D(\d{2,4})$/);
  if(!m) return null;
  let y=+m[3]; if(y<100) y+=2000;
  const d=+m[1], mo=+m[2];
  if(mo<1||mo>12||d<1||d>31) return null;
  return y+"-"+String(mo).padStart(2,"0")+"-"+String(d).padStart(2,"0");
}
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

/* ---------------- ciclo: calendario, pensato per cicli irregolari ----------------
   Nessuna durata fissa. L'app misura i TUOI intervalli reali dai giorni che segni,
   e dichiara sempre quanto è affidabile la stima invece di fingere precisione.     */
const PHASES = {
  mes:{n:"Fase mestruale",  cls:"pill-a", food:"In questi giorni il piano spinge su <b>ferro</b> (legumi, uova, manzo, spinaci) sempre abbinato a <b>vitamina C</b>, e su <b>magnesio</b> (avena, mandorle, cacao) che attenua i crampi. Piatti caldi e poco voluminosi, perché la digestione è più pigra.", adv:"Energia bassa e ferro in calo. Tieni la seduta ma taglia il volume del 20–30%: due giri invece di tre. Se stai male, sostituiscila con una camminata — il movimento leggero riduce i crampi, non li peggiora."},
  fol:{n:"Fase follicolare",cls:"pill-g", food:"È la fase in cui gestisci meglio i carboidrati e li usi meglio come benzina: qui il piano mette i piatti più ricchi di pasta, riso e cuscus, e li fa cadere vicino agli allenamenti.", adv:"La finestra migliore del mese: recuperi bene e tolleri più carico. È qui che alzi i pesi, provi il gradino successivo dei push-up e aggiungi il quarto giro."},
  ovu:{n:"Fase ovulatoria", cls:"pill-b", food:"Energia al massimo e appetito regolare: proteine alte e piatti normali. Niente di speciale da correggere, approfittane.", adv:"Picco di forza, ma anche picco di lassità dei legamenti. Approfitta della forza sui movimenti controllati e togli i salti: squat normali invece degli squat jump, e negli affondi bulgari appoggia il piede senza rimbalzare."},
  lut:{n:"Fase luteale",    cls:"pill-p", food:"Le calorie salgono e il piano vira su <b>magnesio</b> e carboidrati complessi, che alzano la serotonina e spengono la voglia di dolce invece di combatterla. Sale ridotto: limita la ritenzione.", adv:"Mezzo grado di temperatura in più rende tutto più faticoso: mantieni la frequenza ma non aspettarti record. Le calorie salgono per questi dodici-quattordici giorni, non è un cedimento. Sulla bilancia stai guardando acqua, ignorala."}
};
const DAYMS = 86400000;
const FLOW_DEFAULT = 5;   /* durata presunta finché non ne conosco una tua */
const GRACE = 3;          /* giorni di attesa prima di convalidare da sola */

/* Un ciclo = {s:"inizio", e:"fine"|null, auto:true se l'ha chiuso l'app} */
function cycles(){ return st.cycles || (st.cycles=[]); }
function addD(s,n){ const d=parseD(s); d.setDate(d.getDate()+n); return k(d); }
function dlen(a,b){ return Math.round((parseD(b)-parseD(a))/DAYMS)+1; }
function avgFlow(){
  const c=cycles().filter(x=>x.e && !x.auto);
  if(!c.length) return FLOW_DEFAULT;
  return Math.max(1, Math.round(c.reduce((a,x)=>a+dlen(x.s,x.e),0)/c.length));
}
function effEnd(cy){ return cy.e || addD(cy.s, avgFlow()-1); }
function openCycle(){ return cycles().find(c=>!c.e) || null; }
/* chiude da sola i cicli lasciati aperti, ma li marca come "convalidati dall'app" */
function autoConfirm(){
  const today=k(new Date()); let ch=false;
  cycles().forEach(cy=>{
    if(!cy.e){
      const pe=addD(cy.s, avgFlow()-1);
      /* il periodo di tolleranza parte dal più recente fra la fine presunta e il giorno
         in cui hai inserito il ciclo: così un ciclo segnato a ritroso non viene chiuso
         all'istante, e hai il tempo di toccare il suo ultimo giorno. */
      const from = (cy.t && cy.t > pe) ? cy.t : pe;
      if(today > addD(from, GRACE)){ cy.e=pe; cy.auto=true; ch=true; }
    }
  });
  if(ch) save();
}
function dayState(ks){
  const cy = cycles().find(c=> ks>=c.s && ks<=effEnd(c));
  if(!cy) return null;
  if(!cy.e) return "prov";
  return cy.auto ? "auto" : "sure";
}
function cstats(){
  autoConfirm();
  const g=cycles().slice().sort((a,b)=>a.s<b.s?-1:1), lens=[];
  for(let i=1;i<g.length;i++){ const L=Math.round((parseD(g[i].s)-parseD(g[i-1].s))/DAYMS); if(L>=18&&L<=70) lens.push(L); }
  const conf=g.filter(x=>x.e&&!x.auto);
  return { g:g, lens:lens,
    avg: lens.length?Math.round(lens.reduce((a,b)=>a+b,0)/lens.length):null,
    min: lens.length?Math.min.apply(null,lens):null,
    max: lens.length?Math.max.apply(null,lens):null,
    varia: lens.length?Math.max.apply(null,lens)-Math.min.apply(null,lens):null,
    dur: conf.length?Math.round(conf.reduce((a,x)=>a+dlen(x.s,x.e),0)/conf.length):null,
    nconf: conf.length };
}
function kcalFor(phaseKey){
  const g=goal();
  const v = g.base + (phaseKey?(g.delta[phaseKey]||0):0) + (st.kcalAdj||0);
  return Math.max(1400, v);                              /* il pavimento resta un limite */
}
function protFor(){ return goal().prot; }
/* da dove esce il numero di oggi: base + fase + correzione dall'andamento */
function kcalBreak(c){
  const g = goal();
  const d = c.key ? (g.delta[c.key]||0) : 0, a = st.kcalAdj||0;
  if(!d && !a) return "";
  const p = n => (n>0?"+":"−") + Math.abs(n);
  let s = '<div class="xs" style="text-align:right;margin-top:-2px">' + g.base + ' di base';
  if(d) s += ' <b>' + p(d) + '</b> ' + (c.n||"").toLowerCase().replace(/^fase\s+/, "fase ");
  if(a) s += ' <b>' + p(a) + '</b> dal tuo andamento';
  if(c.kcal === 1400 && g.base + d + a < 1400) s += ' · fermato al pavimento di 1.400';
  return s + '</div>';
}
function mk(key,day,conf,extra){
  const p=PHASES[key];
  return {known:true, key:key, day:day, conf:conf, kcal:kcalFor(key), n:p.n, cls:p.cls,
          food:p.food, adv:(extra?extra+" ":"")+p.adv};
}
function cyc(d){
  const S=cstats(), ks=k(d);
  const inCy = S.g.find(c=> ks>=c.s && ks<=effEnd(c));
  if(inCy){
    const day=dlen(inCy.s,ks);
    if(!inCy.e) return mk("mes",day,"in corso","Ciclo in corso: sto assumendo una durata di "+avgFlow()+" giorni. Quando finisce, tocca l'ultimo giorno sul calendario.");
    if(inCy.auto) return mk("mes",day,"convalidata dall'app","Non avevi segnato la fine, quindi ho chiuso il ciclo a "+dlen(inCy.s,inCy.e)+" giorni. Se non è esatto, correggilo sul calendario.");
    return mk("mes",day,"certa","Giorno di ciclo che hai registrato.");
  }
  const past=S.g.filter(c=> c.s<=ks);
  if(!past.length) return {known:false,kcal:kcalFor(null),n:"Ciclo da registrare",cls:"pill-b",day:null,key:null,conf:null,
    adv:"Il calendario sta nella scheda Progressi, in fondo alla barra: tocca il primo giorno del ciclo, poi l'ultimo. Puoi farlo anche a ritroso, se te li ricordi. Da due cicli in poi l'app calcola i tuoi intervalli reali e stima le fasi; fino ad allora l'obiettivo resta fisso."};
  const last=past[past.length-1];
  const day=dlen(last.s,ks);
  if(S.lens.length<2) return {known:true,kcal:kcalFor(null),n:"Fase non stimabile",cls:"pill-b",day:day,key:null,conf:"nessuna",
    adv:"Ho un solo ciclo registrato: per stimare le fasi servono almeno due intervalli, e con un ciclo irregolare anche di più. Continua a segnare. Intanto usa l'autoregolazione: senti il carico al primo esercizio e aggiusta in base a come esce, invece di seguire il calendario."};
  /* La fase luteale dura ~12–14 giorni ed è la parte stabile anche nei cicli irregolari:
     l'ovulazione si stima all'indietro dalla lunghezza dei tuoi cicli, non in avanti.
     Ampiezza legata alla tua variabilità, ma limitata a ±5 giorni. */
  const LUT_MAX = 16;
  const centro=Math.max(10,(S.avg||28)-14), half=Math.min(5,Math.max(2,Math.round((S.varia||4)/2)));
  const ovLo=Math.max(8,centro-half), ovHi=centro+half;
  const wide=(S.varia||0)>=8;
  if(day<ovLo) return mk("fol",day, wide?"larga":"buona",
    wide?"I tuoi cicli variano parecchio, quindi la stima è larga: prendila come indicazione, non come certezza.":"");
  if(day<=ovHi) return mk("ovu",day, wide?"molto larga":"stimata",
    "Finestra ovulatoria stimata tra il giorno "+ovLo+" e il "+ovHi+(wide?", ampia perché i tuoi cicli variano molto: tieni la cautela sui salti per tutto l'intervallo.":"."));
  /* La luteale non dura più di ~16 giorni: è la parte fissa del ciclo.
     Oltre quel limite non sei "in luteale da un mese" — o l'ovulazione è
     arrivata più tardi della stima, o non c'è stata, o semplicemente non hai
     ancora segnato il ciclo. In tutti e tre i casi il +150 della luteale non
     ha più motivo di esserci, e l'obiettivo torna a quello di base. */
  const lutFine = ovHi + LUT_MAX;
  if(day > lutFine){
    const gg = day - lutFine;
    return {known:true, key:null, kcal:kcalFor(null), n:"Fase da ricalibrare", cls:"pill-b", day:day, conf:"scaduta",
      food:PHASES.fol.food,
      adv:"Sono passati " + day + " giorni dall'ultimo inizio che hai segnato, e la fase luteale non dura più di " + LUT_MAX + " giorni: da " + gg + " giorni non ho più una stima attendibile, quindi le calorie sono tornate all'obiettivo di base. "
        + "Se il ciclo è arrivato e non l'hai registrato, segnalo sul calendario in Progressi e tutto si riallinea in un secondo. "
        + "Se invece non è arrivato davvero, un ritardo lungo con cicli già irregolari è la cosa che vale la pena portare a un medico — e nel frattempo non scendere con le calorie."};
  }
  const late=(S.max||0)?day-S.max:0;
  return mk("lut",day,"stimata", late>3
    ? "Sei "+late+" giorni oltre il tuo ciclo più lungo registrato. Con cicli irregolari succede spesso; se il ritardo si allunga molto o si ripete, vale una parola col medico."
    : "");
}
function nextWindow(){
  const S=cstats(); if(!S.g.length||!S.min) return null;
  const s=parseD(S.g[S.g.length-1].s).getTime();
  return {lo:new Date(s+S.min*DAYMS), hi:new Date(s+S.max*DAYMS)};
}

function progPhase(d){ if(st.phaseOverride) return st.phaseOverride; return d >= parseD(PHASE2_START) ? 2 : 1; }

/* ---------------- disegno esercizi ---------------- */
function fig(ex, w){
  const P = w==="b" ? ex.b : ex.a;
  const L=(a,b,c)=> a&&b ? `<line class="${c}" x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}"/>` : "";
  let pr = "", eq = "";
  (ex.props||[]).forEach(o=>{
    if(o[0]==="line") pr += `<line class="fp" x1="${o[1]}" y1="${o[2]}" x2="${o[3]}" y2="${o[4]}" stroke-width="5"/>`;
    if(o[0]==="rect") pr += `<rect class="fp2" x="${o[1]}" y="${o[2]}" width="${o[3]}" height="${o[4]}" rx="3"/>`;
    if(o[0]==="circ") pr += `<circle class="fp" cx="${o[1]}" cy="${o[2]}" r="${o[3]}" fill="none" stroke-width="4"/>`;
    if(o[0]==="db")   eq += `<g class="fq"><rect x="${o[1]-7}" y="${o[2]-2}" width="14" height="4" rx="2"/><rect x="${o[1]-10}" y="${o[2]-5}" width="5" height="10" rx="2"/><rect x="${o[1]+5}" y="${o[2]-5}" width="5" height="10" rx="2"/></g>`;
    if(o[0]==="bar")  eq += `<g class="fq"><rect x="${o[1]-30}" y="${o[2]-2}" width="60" height="4" rx="2"/><rect x="${o[1]-34}" y="${o[2]-9}" width="6" height="18" rx="2"/><rect x="${o[1]+28}" y="${o[2]-9}" width="6" height="18" rx="2"/></g>`;
  });
  return `<svg class="figsvg" viewBox="0 0 200 160" role="img" aria-label="${esc(ex.n)}">
    <g stroke-linecap="round" stroke-width="4.5" fill="none">${pr}
      ${L(P.n,P.e2,"ff")}${L(P.e2,P.w2,"ff")}${L(P.p,P.k2,"ff")}${L(P.k2,P.f2,"ff")}
      <line class="fn" x1="${P.n[0]}" y1="${P.n[1]}" x2="${P.p[0]}" y2="${P.p[1]}" stroke-width="6"/>
      ${L(P.n,P.e,"fn")}${L(P.e,P.w,"fn")}${L(P.p,P.k,"fn")}${L(P.k,P.f,"fn")}
      <circle class="fh" cx="${P.h[0]}" cy="${P.h[1]}" r="9" stroke-width="4.5"/>
      ${eq}
    </g></svg>`;
}

/* ================= MODALITÀ MINIMA =================
   Costruita sui quattro meccanismi che rendono compulsivo lo scroll,
   riportati su qualcosa che ti fa bene:
   1. attrito zero          -> un pulsante, due minuti, permesso di smettere
   2. ricompensa variabile  -> peschi una carta, non sai quale
   3. ricompensa immediata  -> come ti senti DOPO, misurato e mostrato
   4. nessun fallimento     -> giorni attivi su 14, non una serie che si azzera
   Più due interventi con prova sperimentale: temptation bundling
   (Milkman, Minson, Volpp — Management Science 2014) e implementation
   intention (meta-analisi Silva 2018, Peng 2022).                    */
function miniOn(){ return st.mini !== false && st.mini !== undefined ? true : st.mini===true; }
function todayKey(){ return k(new Date()); }
function pickCard(){
  const key=todayKey();
  st.card = st.card || {};
  if(!st.card[key]) st.card[key] = Math.floor(Math.random()*MICRO.length);
  return MICRO[st.card[key]];
}
function reshuffle(){
  const key=todayKey();
  st.card = st.card || {};
  let i, guard=0;
  do { i = Math.floor(Math.random()*MICRO.length); guard++; } while(i===st.card[key] && guard<20);
  st.card[key]=i; st.rerolls=(st.rerolls||0)+1; save(); renderOggi();
}
function doneDays(n){
  const out=[]; const today=new Date();
  for(let i=0;i<n;i++){ const d=new Date(today); d.setDate(d.getDate()-i); out.push(k(d)); }
  return out;
}
function activeCount(n){
  const md=st.miniDone||{};
  return doneDays(n).filter(x=>md[x]).length;
}
function moodStats(){
  const m=st.mood||{}; const v=Object.values(m);
  return { n:v.length, better:v.filter(x=>x==="+").length };
}
function markDone(){
  st.miniDone = st.miniDone||{}; st.miniDone[todayKey()]=true;
  save(); renderOggi(); toast("Fatto. Adesso dimmi come stai.");
}
function setMood(v){
  st.mood = st.mood||{}; st.mood[todayKey()]=v; save(); renderOggi();
  toast(v==="+"?"Segnato: meglio":v==="="?"Segnato: uguale":"Segnato: peggio");
}
function saveBundle(){ st.bundle=(document.getElementById("bnd").value||"").trim(); save(); renderOggi(); toast(st.bundle?"Patto salvato":"Patto rimosso"); }
function saveTrigger(){
  st.trigA=(document.getElementById("trA").value||"").trim();
  st.trigB=(document.getElementById("trB").value||"").trim();
  save(); renderOggi(); toast("Frase salvata");
}
function setMini(v){ st.mini=v; save(); render(); toast(v?"Modalità minima attiva":"Piano completo ripristinato"); }

function renderMini(){
  const key=todayKey(), done=(st.miniDone||{})[key], card=pickCard();
  const mood=(st.mood||{})[key], ms=moodStats(), act14=activeCount(14), act7=activeCount(7);
  let h="";

  h += `<div class="card" style="text-align:center;padding:26px 18px">
    <div class="mslot" style="letter-spacing:.24em">Oggi, una cosa sola</div>
    <div style="font-family:var(--disp);font-size:27px;font-weight:400;line-height:1.15;letter-spacing:-.02em;margin:12px 0 6px">${esc(card.n)}</div>
    <div class="sm muted" style="max-width:34ch;margin:0 auto">${esc(card.d)}</div>
    <div class="xs" style="margin-top:12px">circa ${card.m} minuti${st.bundle?` · solo mentre ${esc(st.bundle)}`:""}</div>
    ${done
      ? `<div class="callout g" style="margin:18px 0 0;text-align:left"><b>Fatto oggi.</b> Non serve altro. Se ti va di fare di più, la scheda completa è sempre lì — ma il conto di oggi è già chiuso.</div>`
      : `${palMiniBtn()}
         <button class="btn wide" style="margin-top:8px;padding:16px;font-size:16px" onclick="markDone()">L'ho fatto</button>
         <button class="btn sec wide" style="margin-top:8px" onclick="reshuffle()">Dammene un'altra</button>`}
  </div>`;

  if(!done) h += `<div class="callout"><b>Puoi smettere dopo due minuti.</b> Senza spiegazioni.${why("La parte difficile non è l'esercizio, è l'inizio: se ti dai il permesso di smettere subito, il costo di partire crolla. Nove volte su dieci, dopo due minuti, finisci.")}</div>`;

  if(done && !mood){
    h += `<div class="card"><div class="mslot">Come stai adesso</div>
      <div class="sm" style="margin:8px 0 12px">Rispondi ora, non domani.</div>
      <div class="g2" style="grid-template-columns:1fr 1fr 1fr">
        <button class="btn sec" onclick="setMood('+')">Meglio</button>
        <button class="btn sec" onclick="setMood('=')">Uguale</button>
        <button class="btn sec" onclick="setMood('-')">Peggio</button>
      </div></div>`;
  }

  if(ms.n>=3){
    const pct=Math.round(ms.better/ms.n*100);
    h += `<div class="callout ${pct>=60?"g":""}"><b>${ms.better} volte su ${ms.n} ti sei sentita meglio dopo.</b>${why(pct>=60
      ? "Il "+pct+"% delle volte. È il dato che conta più del peso: chi vive l'attività come piacevole continua a farla, ed è l'unico predittore di aderenza che regge nel tempo."
      : "Per ora il bilancio è incerto, e spesso vuol dire che stai spingendo troppo. Prova la versione più leggera, quella che ti lascia con la sensazione di poterne fare ancora.")}</div>`;
  }

  h += `<div class="card">
    <div class="row"><div>
      <div class="mslot">Ultimi 14 giorni</div>
      <div style="font-family:var(--disp);font-size:30px;font-weight:400;line-height:1.05;letter-spacing:-.02em;margin-top:4px">${act14}<span class="muted" style="font-size:17px">/14</span></div>
    </div><div style="text-align:right"><div class="mslot">Questa settimana</div>
      <div style="font-family:var(--disp);font-size:30px;font-weight:400;line-height:1.05;letter-spacing:-.02em;margin-top:4px">${act7}<span class="muted" style="font-size:17px">/7</span></div></div></div>
    <div style="display:flex;gap:4px;margin-top:14px">${doneDays(14).reverse().map(d=>
      `<div style="flex:1;height:26px;border-radius:6px;background:${(st.miniDone||{})[d]?"var(--sage-2)":"var(--sage-wash)"}"></div>`).join("")}</div>
    <div class="xs" style="margin-top:10px">Non è una serie che si azzera.${why("Un giorno saltato non cancella niente: le app che ti resettano il contatore a zero ti fanno mollare al primo buco, ed è il motivo per cui qui non c'è.")}</div>
  </div>`;

  h += `<details><summary>Il patto: cosa ti concedi solo muovendoti</summary><div class="dc">
    <div class="sm">Una cosa che ti piace e che fai comunque — la serie, il podcast, la playlist — te la concedi <b>solo</b> mentre ti muovi. Sposta la voglia: non devi volere l'esercizio, ti basta volere la serie. <span class="muted">(Milkman, Minson e Volpp, Management Science 2014.)</span></div>
    <div class="f" style="margin-top:12px;margin-bottom:8px"><label>Me lo concedo solo mentre…</label>
      <input id="bnd" placeholder="guardo la mia serie" value="${esc(st.bundle||"")}"></div>
    <button class="btn wide" onclick="saveBundle()">Salva il patto</button></div></details>`;

  h += `<details><summary>La frase che decide per te</summary><div class="dc">
    <div class="sm">Non «voglio muovermi di più», ma <b>quando</b> succede una cosa precisa, <b>allora</b> ne faccio un'altra. Togli la decisione: nel momento hai già scelto. <span class="muted">(Silva, PLoS One 2018; Peng, IJERPH 2022.)</span></div>
    <div class="f" style="margin-top:12px"><label>Quando…</label><input id="trA" placeholder="finisco di cenare" value="${esc(st.trigA||"")}"></div>
    <div class="f"><label>…allora</label><input id="trB" placeholder="stendo il tappetino in salotto" value="${esc(st.trigB||"")}"></div>
    <button class="btn wide" onclick="saveTrigger()">Salva</button>
    ${st.trigA&&st.trigB?`<div class="callout g" style="margin-bottom:0">Quando <b>${esc(st.trigA)}</b>, allora <b>${esc(st.trigB)}</b>.</div>`:""}</div></details>`;

  h += `<details><summary>Perché è difficile, e non è pigrizia</summary><div class="dc">
    <div class="sm"><b>Prima ipotesi, la più concreta: il ferro.</b> La carenza di ferro dà esattamente questo quadro — stanchezza, nessuna voglia di muoversi, sforzo che sembra sproporzionato — e viene sistematicamente scambiata per pigrizia da chi la ha. Prima di lavorare sulla motivazione vale la pena rifare emocromo e ferritina: se il problema è quello, nessuna tecnica psicologica lo compensa.</div>
    <div class="sm" style="margin-top:11px"><b>Seconda: il compito era troppo grande.</b> Tre sedute da mezz'ora più un menù più la spesa da tracciare non è un piano, è un secondo lavoro. Il cervello non rifiuta l'esercizio, rifiuta il costo di attivazione — ed è la stessa ragione per cui lo scroll vince: costa un pollice.</div>
    <div class="sm" style="margin-top:11px"><b>Terza: la ricompensa arriva troppo tardi.</b> Instagram ti paga entro un secondo, la palestra entro sei settimane. Contro questo non esiste forza di volontà, esiste solo spostare la ricompensa più vicino — ed è quello che fa la domanda "come stai adesso".</div>
    <div class="xs" style="margin-top:12px">Fonti verificate su PubMed: Milkman, Minson & Volpp, <em>Management Science</em> 2014 (temptation bundling); Williams et al., <em>Journal of Sport & Exercise Psychology</em> 2016 e 2008 (la risposta affettiva all'esercizio predice l'aderenza, e l'intensità scelta da sé la migliora); Silva et al., <em>PLoS One</em> 2018 e Peng et al., <em>IJERPH</em> 2022 (implementation intentions). Sul ferro parlo da quello che so, non da uno studio che ho verificato adesso.</div>
  </div></details>`;

  h += `<button class="btn sec wide" style="margin-top:14px" onclick="setMini(false)">Apri il piano completo</button>
    <div class="xs" style="margin-top:8px;text-align:center">Resta tutto dov'era: allenamenti, cibo, spesa, misure.</div>`;

  document.getElementById("v-oggi").innerHTML=h;
}

/* ---------------- vista OGGI ---------------- */
function renderOggi(){
  if(st.mini===true){ renderMini(); return; }
  const key = k(cur), dow = cur.getDay(), c = cyc(cur), ph = progPhase(cur), plan = WEEK[dow], rec = dayRec(key);
  let h = "";

  h += meNudge();
  h += bkCard();
  const A = splitAdv(c.adv);
  h += `<div class="card" style="border-color:${c.known?"var(--line)":"var(--sage-2)"}">

function doseFor(dose, phk){

}
function exRow(id0, dose, key, rec, ph, isMob){

function prevLog(id, key){
  const ks = Object.keys(st.log).filter(x=>x<key && st.log[x][id] && (st.log[x][id].w||st.log[x][id].r)).sort();
  if(!ks.length) return null;

  return { when: fmtItShort(kk), txt: [v.w,v.r].filter(Boolean).join(" × ") };
}
function tgl(id, isMob){

  } else {

      h += `<div class="callout w"><b>I tuoi cicli variano di ${S.varia} giorni.</b> È una variabilità alta, quindi non ti prometto una previsione precisa: la finestra ovulatoria che vedi è volutamente larga, e la fase luteale può iniziare prima o dopo. Le due cose su cui puoi contare restano vere comunque — i giorni di ciclo registrati sono certi, e la fase luteale dura sempre 12–14 giorni, quindi appena arriva il ciclo sai a posteriori dov'eri. Nel dubbio, autoregolazione: come ti senti al primo esercizio vale più del calendario.</div>`;

function tapDay(ks){

  if(open){
    if(ks===open.s){ st.cycles=cy.filter(c=>c!==open); toast("Inizio annullato"); }
    else if(ks>open.s){ open.e=ks; delete open.auto; toast("Ciclo di "+dlen(open.s,ks)+" giorni registrato"); }
    else { open.s=ks; toast("Inizio spostato al "+parseD(ks).getDate()); }
  } else {
    const prev = cy.filter(c=> c.s<=ks).pop();

      st.cycles=cy.filter(c=>c!==prev); toast("Ciclo eliminato");

      prev.e=ks; delete prev.auto;

      cy.push({s:ks,e:null,t:k(new Date())});

function chart(ms){
  const W=320,H=176,pad=34;
  const series=[["w","Girovita","#b0441c"],["h","Fianchi","#2b5580"],["p","Peso","#2f6b4f"]].filter(s=>ms.filter(m=>m[s[0]]!=null).length>=2);
  if(!series.length) return `<div class="xs">Servono almeno due valori della stessa misura per disegnare il grafico.</div>`;
  const all=[]; series.forEach(s=>ms.forEach(m=>{ if(m[s[0]]!=null) all.push(m[s[0]]); }));
  let lo=Math.min.apply(null,all), hi=Math.max.apply(null,all); const sp=(hi-lo)||4; lo-=sp*.25; hi+=sp*.25;
  const t0=parseD(ms[0].d).getTime(), t1=parseD(ms[ms.length-1].d).getTime(), td=(t1-t0)||1;
  const X=d=>pad+(parseD(d).getTime()-t0)/td*(W-pad-12);
  const Y=v=>H-24-(v-lo)/(hi-lo)*(H-24-22);
  let g=`<svg class="chart" viewBox="0 0 ${W} ${H}">`;
  [0,.5,1].forEach(f=>{ const y=Y(lo+(hi-lo)*f);
    g+=`<line x1="${pad}" y1="${y}" x2="${W-8}" y2="${y}" stroke="#ece7e0" stroke-width="1"/><text x="3" y="${y+3.5}" font-size="9.5" fill="#9b948c">${(lo+(hi-lo)*f).toFixed(0)}</text>`; });
  series.forEach(s=>{
    const pts=ms.filter(m=>m[s[0]]!=null);
    g+=`<polyline fill="none" stroke="${s[2]}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" points="${pts.map(m=>X(m.d).toFixed(1)+","+Y(m[s[0]]).toFixed(1)).join(" ")}"/>`;
    pts.forEach(m=>g+=`<circle cx="${X(m.d).toFixed(1)}" cy="${Y(m[s[0]]).toFixed(1)}" r="3.1" fill="#fff" stroke="${s[2]}" stroke-width="2"/>`);
  });
  g+=`</svg><div style="display:flex;gap:14px;flex-wrap:wrap;margin-top:6px">`+
    series.map(s=>`<span class="xs"><span style="display:inline-block;width:9px;height:9px;border-radius:9px;background:${s[2]};margin-right:5px"></span>${s[1]}</span>`).join("")+`</div>`;
  return g;
}
function trendCheck(){
  /* usa il peso se lo stai segnando, altrimenti il girovita:
     i due numeri si muovono a velocità diverse e hanno soglie diverse */
  const all = st.meas || [];
  const nP = all.filter(m=>m.p!=null).length, nW = all.filter(m=>m.w!=null).length;
  const usaPeso = trackMode() !== "misure" && nP >= 2 && nP >= nW;
  const key = usaPeso ? "p" : "w";
  const ms = all.filter(m=>m[key]!=null).sort((a,b)=>a.d<b.d?-1:1);
  if(ms.length<2) return null;
  const a=ms[0], b=ms[ms.length-1];
  const days=Math.round((parseD(b.d)-parseD(a.d))/DAYMS);
  if(days<18) return {short:true, days:days, peso:usaPeso};
  const perWeek=Math.round((b[key]-a[key])/days*7*100)/100;
  const g=goalKey();
  /* [scende bene da, a] · in cm il girovita si muove più lentamente */
  const S = usaPeso ? {ok:[-0.7,-0.15], fermo:0.2, su:[0.1,0.4]} : {ok:[-1.0,-0.15], fermo:0.3, su:[0.1,0.5]};
  let verdict, action=null;
  if(g==="cut"){
    if(perWeek<=S.ok[1] && perWeek>=S.ok[0]) verdict="giusto";
    else if(perWeek>S.ok[1]){ verdict="lento"; action=-150; }
    else { verdict="veloce"; action=+150; }
  } else if(g==="recomp"){
    if(Math.abs(perWeek)<=S.fermo) verdict="giusto";
    else if(perWeek>S.fermo){ verdict="sale"; action=-150; }
    else { verdict="scende"; action=+150; }
  } else {
    if(perWeek>=S.su[0] && perWeek<=S.su[1]) verdict="giusto";
    else if(perWeek<S.su[0]){ verdict="lento"; action=+200; }
    else { verdict="veloce"; action=-150; }
  }
  return {days:days, perWeek:perWeek, verdict:verdict, action:action,
          wA:a[key], wB:b[key], from:a.d, to:b.d, peso:usaPeso,
          unit:usaPeso?"kg":"cm", cosa:usaPeso?"Il peso":"Il girovita"};
}

/* ---------------- generatore di settimane dentro il budget ----------------
   Enumera tutte le giornate valide (calorie in range e proteine sopra soglia),
   parte dalla settimana più economica possibile e poi la "arricchisce" finché
   resta sotto il tetto di spesa. Nessun pranzo o cena si ripete nella settimana. */
function kWin(){ const b=goal().base; return [b-180, b+180]; }
function pMin(){ return Math.round(protFor()*0.88); }
const PHASE_PREF = { mes:["fe","mg","comfort"], fol:["carb","light"], ovu:["prot"], lut:["mg","carb","comfort"] };
function phaseScore(id, ph){
  if(!ph) return 0;
  const want=PHASE_PREF[ph]||[], tags=(MEALS[id].tag)||[];
  return want.reduce((a,t)=>a+(tags.indexOf(t)>=0?1:0),0);
}
function whyPhase(id, ph){
  if(!ph) return "";
  const tags=(MEALS[id].tag)||[], want=PHASE_PREF[ph]||[];
  const hit=want.filter(t=>tags.indexOf(t)>=0);
  if(!hit.length) return "";
  const L={fe:"ricco di ferro",mg:"ricco di magnesio",carb:"carboidrati per la benzina",
           light:"leggero e poco gonfiante",comfort:"caldo e consolatorio",prot:"molto proteico"};
  return hit.map(t=>L[t]).join(" · ");
}
let _combos=null, _sig="";
function bySlot(){
  return {col:allowed("col"), pra:allowed("pra"), spu:allowed("spu"), cen:allowed("cen")};
}
/* carboidrati e ferro di ogni piatto si calcolano una volta sola:
   sono sessanta piatti, ma le combinazioni da filtrare sono cinquantamila */
let _mc=null;
function mCarb(id){ if(!_mc) _mc={}; return _mc[id]!==undefined ? _mc[id] : (_mc[id]=mealCarb(id)); }
let _mf=null;
function mFe(id){ if(!_mf) _mf={}; return _mf[id]!==undefined ? _mf[id] : (_mf[id]=mealIron(id).mg); }
function combos(){
  const KMIN=kWin()[0], KMAX=kWin()[1], PMIN=pMin();
  const sig=KMIN+"|"+KMAX+"|"+PMIN+"|"+JSON.stringify(st.prices||{})+"|"+JSON.stringify(st.taste||{})+"|"+JSON.stringify(st.no||[]);
  if(_combos && _sig===sig) return _combos;
  _sig=sig;
  const B=bySlot(), out=[], loose=[], two=slots().indexOf("spu2")>=0, TP=protFor();
  B.col.forEach(c=>B.pra.forEach(a=>B.spu.forEach(s2=>B.cen.forEach(e=>{
    const s3 = two ? (SPU_ALT[s2]||"s3") : null;
    const add2k = two ? MEALS[s3].k : 0, add2p = two ? MEALS[s3].p : 0;
    const k=MEALS[c].k+MEALS[a].k+MEALS[s2].k+MEALS[e].k+add2k;
    if(k<KMIN || k>KMAX) return;
    const p=MEALS[c].p+MEALS[a].p+MEALS[s2].p+MEALS[e].p+add2p;
    if(p<PMIN) return;
    const fe=mFe(c)+mFe(a)+mFe(s2)+mFe(e)+(two?mFe(s3):0);
    const x={c:c,a:a,s:s2,e:e,s3:s3,k:k,p:p,fe:fe,
             eur:mealCost(c)+mealCost(a)+mealCost(s2)+mealCost(e)+(two?mealCost(s3):0)};
    /* la giornata deve reggere anche come equilibrio, non solo come numeri:
       è lo stesso giudizio che poi leggi sulla scheda. */
    const ca=mCarb(c)+mCarb(a)+mCarb(s2)+mCarb(e)+(two?mCarb(s3):0);
    const fat=Math.max(0,(k-4*p-4*ca)/9), cQ=4*ca/k, fQ=9*fat/k;
    if(p>=TP && cQ<=0.54 && cQ>=0.33 && fQ>=0.21 && fe>=IRON_TARGET*0.78) out.push(x);
    else loose.push(x);

  /* se i vincoli pieni lasciano troppo poco (pochi piatti rimasti dopo le tue
     esclusioni), si riapre il campo invece di non proporre niente */
  _combos = out.length >= 40 ? out : out.concat(loose);
  return _combos;
}
function shuffled(arr){ const x=arr.slice(); for(let i=x.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [x[i],x[j]]=[x[j],x[i]]; } return x; }
function comboPhaseScore(x){
  const ph=cyc(new Date()).key;
  const ids=[x.c,x.a,x.s,x.e].concat(x.s3?[x.s3]:[]);
  const base=ids.reduce((a,i)=>a+phaseScore(i,ph)+seasonScore(i)*2+tasteOf(i)*4+satiety(i)*0.35, 0);
  return base + (x.fe>=IRON_TARGET*0.85 ? 3 : x.fe>=IRON_TARGET*0.7 ? 1 : -2);

function cheapWeek(){
  const asc=shuffled(combos()).sort((x,y)=> (x.eur-y.eur) || (comboPhaseScore(y)-comboPhaseScore(x)));
  const cap=legumeCap();
  /* prova prima con il vincolo pieno, poi allenta un gradino alla volta:
     varietà dei piatti e tetto dei legumi. Meglio un compromesso che nessuna settimana. */
  for(const legCap of [cap, cap+1, cap+2, 99]){
    for(const maxRep of [1,2,3]){
      const cA={}, cE={}, days=[]; let leg=0;
      for(const x of asc){
        if(days.length===7) break;
        if((cA[x.a]||0)>=maxRep || (cE[x.e]||0)>=maxRep) continue;
        const L=legumeMeals(x);
        if(leg+L>legCap) continue;
        cA[x.a]=(cA[x.a]||0)+1; cE[x.e]=(cE[x.e]||0)+1; leg+=L; days.push(x);
      }
      if(days.length===7) return days;
    }
  }
  return null;
}
function enrich(days, cap, legCap){
  const desc=shuffled(combos()).sort((x,y)=> (y.eur-x.eur) || (comboPhaseScore(y)-comboPhaseScore(x)));
  let cost=days.reduce((a,x)=>a+x.eur,0), moved=true, guard=0;
  while(moved && guard++<40){
    moved=false;
    for(let i=0;i<7;i++){
      const uA=new Set(), uE=new Set();
      days.forEach((d,j)=>{ if(j!==i){ uA.add(d.a); uE.add(d.e); } });
      for(const x of desc){
        if(x.eur<=days[i].eur) break;                  /* desc: da qui in giù non migliora */
        if(uA.has(x.a)||uE.has(x.e)) continue;
        const nc=cost-days[i].eur+x.eur;
        if(nc<=cap){ cost=nc; days[i]=x; moved=true; break; }
      }
    }
  }
  return {days:days, cost:cost};
}
function applyWeek(days){
  const start=parseD(weekKey()), order=[1,2,3,4,5,6,0];
  order.forEach((dow,i)=>{
    for(let j=0;j<7;j++){
      const d=new Date(start); d.setDate(d.getDate()+j); d.setHours(12,0,0,0);
      if(d.getDay()===dow){
        const key=k(d), cur0=dayMeals(key, d.getDay());
        const o={col:days[i].c, pra:days[i].a, spu:days[i].s, cen:days[i].e};
        if(days[i].s3) o.spu2=days[i].s3;
        slots().forEach(s=>{ if(isLocked(key,s) && cur0[s]) o[s]=cur0[s]; });   /* i confermati restano */
        st.meals[key]=o;
      }
    }
  });
  pruneLeftovers();                     /* gli avanzi della vecchia settimana non valgono più */
  save();
}
function stats(days){
  const k2=days.reduce((a,x)=>a+x.k,0)/7, p2=days.reduce((a,x)=>a+x.p,0)/7;
  return {k:Math.round(k2), p:Math.round(p2), e:days.reduce((a,x)=>a+x.eur,0)};
}
function legumeMeals(x){
  const ids=[x.c,x.a,x.s,x.e].concat(x.s3?[x.s3]:[]);
  return ids.filter(i=>/lenticchie|ceci|borlotti|fagioli/i.test(MEALS[i].ing.join(" "))).length;
}
function rampWeeks(){
  if(!st.rampStart) return 0;
  const d=daysBetween(st.rampStart, todayKey());
  return d<0?0 : d<7?1 : d<14?2 : d<21?3 : 0;    /* 0 = fase di abitudine finita */
}
function startRamp(){

function legumeCap(){ const w=rampWeeks(); return w===1?1 : w===2?2 : w===3?3 : 9; }
function fitBudget(){
  const cap=budget()/4.33;

  if(!base){ toast("Non riesco a comporre la settimana"); return; }
  const floor=base.reduce((a,x)=>a+x.eur,0);
  if(floor>cap){

    const s2=stats(base);
    st.lastFit={ok:false, cap:cap, floor:floor, k:s2.k, p:s2.p}; save(); render();
    toast("Budget troppo stretto — leggi la nota");

  }
  const r=enrich(base, cap, legumeCap());
  applyWeek(r.days);
  const s2=stats(r.days);
  st.lastFit={ok:true, cap:cap, e:s2.e, k:s2.k, p:s2.p}; save(); render();

function parseIng(s){
  const m = s.match(/^([\d.,]+)\s*(kg|g|ml|l)?\s+(.+)$/i);
  if(!m) return {q:null,u:"",n:s.trim()};
  let q=parseFloat(m[1].replace(",",".")), u=(m[2]||"").toLowerCase();
  if(u==="kg"){ q*=1000; u="g"; } if(u==="l"){ q*=1000; u="ml"; }
  return {q:q, u:u, n:m[3].trim()};
}
const SYN=[[/^uovo$/i,"uova"],[/^insalata mista$/i,"insalata"],[/^verdure (miste|di stagione|da grigliare)$/i,"verdure miste"],
  [/^pomodorini$/i,"pomodori"],[/^pomodoro$/i,"pomodori"],[/^fiocchi d'avena$/i,"avena"]];
function normIng(n){ for(const [re,v] of SYN){ if(re.test(n)) return v; } return n; }
function normPrice(n){ n=n.toLowerCase(); if(n.indexOf("uov")===0) return "uova"; return n; }
function priceRow(name){
  const n=normPrice(name); let best=null;
  PRICE_LIST.forEach(r=>{ const kk=r.k.toLowerCase(); if(n.indexOf(kk)>=0 && (!best || kk.length>best.k.length)) best=r; });
  return best;
}
function priceVal(row){ const o=(st.prices||{})[row.k]; return (o===undefined||o===null||o==="")?row.e:+o; }
function priceOf2(name,q,u){
  const r=priceRow(name);
  if(!r) return q==null ? 0.15 : 0.30;
  const v=priceVal(r);
  if(r.u==="pz") return (q||1)*v;
  if(q==null) return 0.15;      /* erbe, spezie, limone: forfait */
  if(u==="")  { const g=PZ_G[Object.keys(PZ_G).find(x=>name.toLowerCase().includes(x))]||150; return q*g/1000*v; }
  return q/1000*v;
}
function ironOf(name,q,u){
  for(const [re,mg,kind] of IRON){
    if(re.test(name)){
      if(kind==="pz") return (q||1)*mg;
      if(q==null) return 0;
      if(u==="") { const g=PZ_G[Object.keys(PZ_G).find(x=>name.toLowerCase().includes(x))]||150; return q*g/100*mg; }
      return q/100*mg;
    }
  }
  return 0;
}
function mealIron(id){
  const m=MEALS[id]; if(!m) return {mg:0, c:false};
  let mg=0, c=false;
  m.ing.forEach(raw=>{ const it=parseIng(raw); mg+=ironOf(it.n,it.q,it.u); if(VIT_C.test(raw)) c=true; });
  return {mg:Math.round(mg*10)/10, c:c};
}
function dayIron(sel){
  let mg=0, meals=0, withC=0;
  slots().forEach(sl=>{ const r=mealIron(sel[sl]); mg+=r.mg; meals++; if(r.c&&r.mg>=1.5) withC++; });
  return {mg:Math.round(mg*10)/10, withC:withC};
}
function mealCost(id){

  m.ing.forEach(raw=>{ const it=parseIng(raw); c+=priceOf2(it.n,it.q,it.u); });

}

function shopList(){

    slots().forEach(sl=>{

      m.ing.forEach(raw=>{

    ${Object.keys(GOALS).map(g=>`<div class="altitem ${g===gk?"cur":""}" onclick="setGoal('${g}')">
      <div><b style="font-size:14.5px">${GOALS[g].n}</b>
        <div class="xs">${baseFor(g)} kcal di base · ${protForGoal(g)} g di proteine</div></div>
      <div class="mmac">${g===gk?"✓":""}</div></div>`).join("")}
    <div class="xs" style="margin-top:10px">${esc(G.gym)}</div>
    ${gk==="gain"?`<div class="callout" style="margin-bottom:0"><b>Una nota onesta sul mettere massa.</b> Con un surplus calorico il girovita sale insieme al muscolo: è inevitabile. Ha senso se vuoi diventare più forte e più piena, non se vuoi asciugarti.</div>`:""}
    ${gk==="recomp"?`<div class="callout g" style="margin-bottom:0"><b>È l'opzione che quasi nessuno sceglie e che a molte serve.</b> A calorie di mantenimento con proteine alte e pesi, la bilancia resta ferma mentre la composizione cambia: più lento da vedere, ma sostenibile per mesi senza il logoramento del deficit.</div>`:""}
  </div>

  <div class="sec-t">Come funziona</div>
  <div class="card"><div class="sm">Sei nella <b>Fase ${ph}</b> del programma: ${ph===1?"allenamenti in palestra, fino al 6 settembre.":"allenamenti a casa, con tappetino, sedia e zaino carico."} L'app cambia da sola le schede il 7 settembre.</div>
  <div class="g2" style="margin-top:11px">
    <button class="btn sec" onclick="setPh(1)" style="${ph===1?"background:var(--ink);color:#fff":""}">Fase 1 · palestra</button>
    <button class="btn sec" onclick="setPh(2)" style="${ph===2?"background:var(--ink);color:#fff":""}">Fase 2 · casa</button></div></div>`;
  document.getElementById("sheetBody").innerHTML = h + choicesCard() + bkCardSet();
}

function renderExp(){
  const ph=progPhase(cur);
  const G=goal(), gk=goalKey();
  let h = `  <details open><summary>La strategia in due fasi</summary><div class="dc">
    <div class="sm"><b>Fase 1 — fino al 6 settembre.</b> Hai bilancieri, macchine e cavi: usali per imparare i movimenti con carico vero e per il face pull, che a casa senza attrezzi non si replica.</div>
    <div class="sm" style="margin-top:9px"><b>Fase 2 — dal 7 settembre.</b> Due bottiglie da 1,5 L sono 3 kg: come carico non bastano, e va bene così. A casa la progressione non passa dai chili ma da leve più lunghe, appoggi su una gamba sola, discese rallentate e giri in più.</div>
    <div class="callout g" style="margin-bottom:0"><b>L'unica cosa da comprare: elastici a fasce, 25–30 €.</b> Sbloccano tutte le trazioni orizzontali, che sono esattamente i movimenti di cui hanno bisogno le tue spalle. In alternativa gratis: uno zaino con 8–12 kg di libri.</div></div></details>

  <details><summary>Da dove vengono le calorie</summary><div class="dc">
    ${meOk() ? `<table><tbody>
      <tr><td>Quanto bruci da ferma, a letto tutto il giorno</td><td class="n"><b>${bmr()}</b></td></tr>
      <tr><td>Con la vita di tutti i giorni, senza allenarti</td><td class="n"><b>${tdeeFermi()}</b></td></tr>
      <tr><td>Con tre allenamenti e le camminate</td><td class="n"><b>${tdeeAttiva()}</b></td></tr>
      <tr><td>Il tuo obiettivo</td><td class="n"><b>${G.base}</b></td></tr>
      <tr><td>Proteine al giorno</td><td class="n"><b>${G.prot} g</b></td></tr>
      <tr><td>Pavimento invalicabile</td><td class="n"><b>1.400</b></td></tr>
    </tbody></table>
    <div class="sm" style="margin-top:12px"><b>${G.base} non è tanto: è già poco.</b> Il primo numero è il metabolismo basale, quello che consumi solo per esistere. L'obiettivo sta ${Math.max(0,tdeeAttiva()-G.base)} kcal sotto il consumo di una giornata in cui ti alleni.</div>
    <div class="sm" style="margin-top:9px"><b>Attenzione a una cosa:</b> nelle settimane in cui non ti muovi il consumo scende verso ${tdeeFermi()}, e lo stesso numero diventa quasi mantenimento. La risposta non è tagliare ancora: è che il movimento è la metà del piano che sposta l'ago, non un contorno.</div>` : `<div class="sm">I conti compaiono qui appena inserisci i tuoi dati qui sopra: metabolismo basale, consumo reale e da dove esce l'obiettivo del giorno. Finché mancano, l'app usa numeri generici.</div>`}
    <div class="sm" style="margin-top:9px"><b>Sotto 1.400 non si scende, mai.</b> A quel punto togli energia al funzionamento di base, non al grasso: si perde muscolo, si abbassa il ferro, e se il ciclo è già irregolare è il modo più rapido per farlo sparire del tutto. È il danno che costa di più recuperare.</div>
    <div class="xs" style="margin-top:10px">Se ti muovi meno o più di così, non serve rifare i conti a mano: nella scheda Progressi l'app guarda l'andamento reale del tuo peso e corregge le calorie da sola.</div></div></details>

  <details><summary>Cosa cambia e cosa no</summary><div class="dc">
    <div class="sm"><b>Quello che non cambia:</b> larghezza delle spalle, polso, gabbia toracica, bacino. È scheletro, e nessun allenamento lo modifica. Chi promette il contrario ti sta vendendo qualcosa.</div>
    <div class="sm" style="margin-top:9px"><b>Quello che cambia moltissimo:</b> lo strato di grasso sopra, la circonferenza del punto vita e la postura. Sono questi tre — non le ossa — a decidere se una persona legge come slim. Struttura robusta con poco grasso e spalle aperte viene letta come asciutta e atletica; la stessa struttura con qualche chilo in più e le spalle chiuse viene letta come massiccia.</div>
    <div class="sm" style="margin-top:9px">Per questo il piano usa ripetizioni alte e carichi moderati, molto volume su schiena, core e glutei, poco su spinta e braccia, e tre uscite di cardio. I pesi restano: senza, perdi peso <em>e</em> muscolo insieme, e il risultato è più piccolo ma molle.</div></div></details>

  <details><summary>Il ciclo, fase per fase</summary><div class="dc">
    <div class="callout" style="margin-top:0"><b>Come fa l'app a saperlo, con un ciclo irregolare.</b> Non usa un ciclo teorico di 28 giorni: misura i tuoi intervalli reali dai giorni che segni sul calendario. E siccome la parte variabile di un ciclo irregolare è quasi sempre la prima metà mentre la fase luteale dura sempre 12–14 giorni, l'ovulazione viene stimata <em>all'indietro</em> dalla lunghezza dei tuoi cicli, non contando in avanti dal primo giorno. Più cicli segni, più la finestra si stringe. Quando la variabilità resta alta l'app te lo dice invece di fingere precisione.</div>
    <table><thead><tr><th>Fase</th><th>Come cambia il piano</th></tr></thead><tbody>
    <tr><td><b>Mestruale</b><br><span class="xs">giorni segnati · ${kcalFor("mes")} kcal</span></td><td class="sm">Volume ridotto del 20–30%. Se stai male, camminata. Occhio al ferro.</td></tr>
    <tr><td><b>Follicolare</b><br><span class="xs">fino all'ovulazione · ${kcalFor("fol")} kcal</span></td><td class="sm">La finestra migliore: qui alzi i carichi e provi le progressioni nuove.</td></tr>
    <tr><td><b>Ovulatoria</b><br><span class="xs">finestra stimata · ${kcalFor("ovu")} kcal</span></td><td class="sm">Picco di forza ma legamenti più lassi: niente salti, cura gli atterraggi.</td></tr>
    <tr><td><b>Luteale</b><br><span class="xs">ultimi 12–14 giorni · ${kcalFor("lut")} kcal</span></td><td class="sm">Tutto sembra più faticoso: mantieni la frequenza, non cercare record. Ritenzione idrica di 1–2 kg: ignora la bilancia.</td></tr>
    </tbody></table>
    <div class="callout w" style="margin-bottom:0"><b>Il segnale da non ignorare.</b> Se il ciclo diventa irregolare o sparisce, fermati e risali con le calorie. Non è un effetto collaterale dell'allenamento: è il corpo che segnala energia insufficiente, e trascinarlo per mesi ha conseguenze sulla densità ossea. È il motivo per cui il pavimento delle 1.400 kcal non è un consiglio ma un limite. Parlane con un medico.</div></div></details>

  <details><summary>Il ferro</summary><div class="dc">
    <div class="sm">È la carenza più diffusa tra le ragazze che si allenano e passa quasi sempre inosservata: le perdite mestruali si sommano al deficit calorico e il risultato è stanchezza cronica, fiato corto e allenamenti sempre più duri del dovuto — che quasi tutte scambiano per un limite personale.</div>
    <div class="sm" style="margin-top:9px">Due accortezze che valgono più della quantità: <b>abbina sempre vitamina C</b> al ferro vegetale (limone su legumi e spinaci, pomodoro nell'insalata), e <b>non bere tè o caffè durante i pasti principali</b>, perché lo bloccano. Se dopo 4–6 settimane sei stanca in modo anomalo, chiedi al medico emocromo e ferritina.</div></div></details>

  <details><summary>Mangiare così con 150 € al mese</summary><div class="dc">
    <div class="sm">Il piano costa circa <b>34 € a settimana, 149 € al mese</b> a prezzi pieni da discount. Sta dentro il budget, ma senza avanzo: per lasciarti dei soldi servono le tre abitudini qui sotto, che valgono realisticamente il 15–20% — cioè 20–30 € al mese.</div>
    <div class="callout" style="margin-bottom:9px"><b>Perché ho abbassato le proteine da 115 a 100 g.</b> Non è una rinuncia dettata dal budget: 115 g erano 1,8 g per chilo, più del necessario. Per proteggere il muscolo in deficit ne bastano 1,5–1,6, cioè 100–105 g per te. Erano soldi spesi per un margine che non ti serviva.</div>
    <h4 style="margin-top:0">Le tre leve vere</h4>
    <ul class="clean small">
      <li><b>Legumi secchi, non in scatola.</b> Un chilo di ceci secchi fa quasi tre chili di ceci cotti e costa 2,50 €; la stessa quantità in barattolo ne costa 7. Ammollo la sera, cottura la domenica, porzioni in frigo. Sono ~10 € al mese di differenza sul piatto più ricorrente del piano.</li>
      <li><b>Verdure surgelate.</b> Costano la metà delle fresche, hanno gli stessi valori nutrizionali e soprattutto <em>non marciscono</em>: buttare via mezza busta d'insalata è la perdita più comune e invisibile di tutte.</li>
      <li><b>Le proteine solo in offerta, e le congeli.</b> Pollo, uova e tonno vanno a promozione di continuo. Comprane la confezione grande quando costa poco, dividila in porzioni e mettila nel congelatore — anche se ne hai poco, le porzioni piatte in busta occupano pochissimo.</li>
    </ul>
    <h4>La classifica delle proteine per prezzo</h4>
    <table><thead><tr><th>Alimento</th><th class="n">€ ogni 10 g di proteine</th></tr></thead><tbody>
      <tr><td>Lenticchie e ceci secchi</td><td class="n"><b>0,15</b></td></tr>
      <tr><td>Latte</td><td class="n"><b>0,38</b></td></tr>
      <tr><td>Uova</td><td class="n"><b>0,40</b></td></tr>
      <tr><td>Sovracosce di pollo</td><td class="n"><b>0,24</b></td></tr>
      <tr><td>Petto di pollo</td><td class="n"><b>0,27</b></td></tr>
      <tr><td>Tonno in scatola</td><td class="n"><b>0,42</b></td></tr>
      <tr><td>Yogurt greco</td><td class="n"><b>0,44</b></td></tr>
      <tr><td>Polipo</td><td class="n"><b>0,67</b></td></tr>
      <tr><td>Manzo magro</td><td class="n"><b>0,62</b></td></tr>
      <tr><td>Trancio di salmone</td><td class="n"><b>1,00</b></td></tr>
      <tr><td>Salmone affumicato</td><td class="n"><b>1,50</b></td></tr>
    </tbody></table>
    <div class="callout g"><b>Il polipo e il salmone restano.</b> Non li ho tolti: li ho spostati fuori dalla settimana predefinita e messi nel ricettario col prezzo accanto. Una cena di polipo costa 3,65 € contro 1,50 di una frittata: sono due euro, non un lusso irraggiungibile. Scegli tu quando spenderli — la scheda Spesa ti dice in tempo reale se ci stai dentro.</div>
    <div class="callout"><b>Il conto che fa più male.</b> Una pizza fuori è 6 €. Una volta a settimana fa 26 € al mese, cioè un sesto del budget alimentare. Nella settimana predefinita ho messo la pizza fatta in casa: 1,30 € e viene buona. Se poi vuoi uscire con le amiche, che è una cosa sana, sai esattamente quanto ti costa e da dove tirarlo fuori.</div></div></details>

  <details><summary>Le 6 regole alimentari</summary><div class="dc"><table><tbody>
    <tr><td class="sm"><b>1 · Proteine a ogni pasto.</b> Un palmo di mano, senza pesare niente. L'unica abitudine che da sola cambia la composizione corporea.</td></tr>
    <tr><td class="sm"><b>2 · Metà piatto di verdura</b> a pranzo e cena. Riempie lo stomaco con 40 calorie invece che con 400.</td></tr>
    <tr><td class="sm"><b>3 · Zero calorie liquide.</b> Bibite, succhi e alcolici sono calorie che non registri e che non saziano. 2–2,5 litri d'acqua al giorno.</td></tr>
    <tr><td class="sm"><b>4 · La regola dei tortellini.</b> Non li elimini: li pesi, 110–120 g crudi, con accanto proteine e verdura.</td></tr>
    <tr><td class="sm"><b>5 · Due pasti liberi, pianificati.</b> Non sgarri: pasti decisi in anticipo e già dentro i conti.</td></tr>
    <tr><td class="sm"><b>6 · Dormi 7–8 ore.</b> Il moltiplicatore invisibile: con 5 ore hai più fame, meno forza e recuperi peggio.</td></tr>
  </tbody></table></div></details>

  <details><summary>Le cinque cose da non fare</summary><div class="dc"><table><tbody>
    <tr><td class="sm"><b>Non scendere sotto 1.400 kcal.</b> È il punto in cui si smonta muscolo insieme al grasso, e il muscolo è ciò che rende il risultato tonico invece che molle.</td></tr>
    <tr><td class="sm"><b>Non fare addominali per togliere la pancia.</b> Il dimagrimento localizzato non esiste, per nessuno.</td></tr>
    <tr><td class="sm"><b>Non saltare i giorni storti: falli ridotti.</b> Dieci minuti valgono infinitamente più di zero.</td></tr>
    <tr><td class="sm"><b>Non cambiare piano prima di quattro settimane.</b> È il modo più elegante per non progredire mai su niente.</td></tr>
    <tr><td class="sm"><b>Non forzare le spalle per sbloccarle.</b> Range ridotto ripetuto ogni giorno, non un'ora di stretching aggressivo a settimana.</td></tr>
  </tbody></table></div></details>

  <details><summary>Cosa aspettarsi, onestamente</summary><div class="dc"><table><tbody>
    <tr><td><b>Sett. 1–2</b></td><td class="sm">Dolori muscolari, sonno migliore, peso che oscilla senza scendere. Normale: il muscolo trattiene acqua e maschera il grasso perso.</td></tr>
    <tr><td><b>Sett. 3–4</b></td><td class="sm">Carichi e ripetizioni salgono in fretta. Le spalle si aprono, la postura cambia. Primo calo sul girovita.</td></tr>
    <tr><td><b>Sett. 5–8</b></td><td class="sm">Il peso scende regolare, circa 1,5 kg al mese. Il fiato cambia in modo evidente sulle scale.</td></tr>
    <tr><td><b>Sett. 9–12</b></td><td class="sm">Cambia la forma, non solo il numero: vita più stretta, gambe più asciutte, linea più definita.</td></tr>
  </tbody></table></div></details>

  <div class="xs" style="margin:18px 0 8px;line-height:1.6"><b>Nota.</b> Questo piano è costruito su dati generali e sulle informazioni che hai fornito: non sostituisce il parere di un medico o di un professionista dell'esercizio fisico. Se compaiono dolore articolare persistente, vertigini, dolore al petto o affanno anomalo, fermati e senti un medico.</div>`;
  document.getElementById("sheetBody").innerHTML = h;
}
/* ---------------- il foglio dietro l'ingranaggio ---------------- */
let sheetOpen = null;
function openSheet(which){
  sheetOpen = which || "menu";
  const S = document.getElementById("sheet"), T = document.getElementById("sheetTtl");
  S.classList.add("on"); document.body.style.overflow = "hidden";
  T.textContent = sheetOpen === "set" ? "Impostazioni" : sheetOpen === "exp" ? "Spiegazioni" : "Il piano";
  if(sheetOpen === "set") renderSet();
  else if(sheetOpen === "exp") renderExp();
  else document.getElementById("sheetBody").innerHTML = sheetMenu();
}
function sheetMenu(){
  return '<div class="menurow" onclick="openSheet(\'set\')">'
    + '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M4 12h4M16 12h4M12 4v4M12 16v4"/></svg>'
    + '<div><b>Impostazioni</b><div class="xs">I tuoi dati, cosa non mangi, aspetto, obiettivo, fase, la compagna</div></div><i>›</i></div>'
    + '<div class="menurow" onclick="openSheet(\'exp\')">'
    + '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>'
    + '<div><b>Spiegazioni</b><div class="xs">Come funziona il piano, il ciclo, il ferro, le calorie, cosa aspettarsi</div></div><i>›</i></div>'
    + '<div class="xs" style="margin-top:18px;text-align:center">Le spunte e i pasti stanno nelle schede in basso.</div>';
}
function sheetBack(){
  if(sheetOpen && sheetOpen !== "menu"){ openSheet("menu"); return; }
  closeSheet();
}
function closeSheet(){
  sheetOpen = null;
  document.getElementById("sheet").classList.remove("on");
  document.body.style.overflow = "";
}
function setPh(p){ st.phaseOverride = (st.phaseOverride===p) ? null : p; save(); render();
  toast(st.phaseOverride ? "Fase forzata manualmente" : "Fase automatica ripristinata"); }

/* ---------------- render / nav ---------------- */
function render(){
  document.getElementById("hDate").textContent = fmtIt(k(cur));
  document.getElementById("hDay").textContent = DAYS[cur.getDay()];
  renderOggi(); renderWeek(); renderCibo(); renderSpesa(); renderProg();
  if(sheetOpen) openSheet(sheetOpen);
}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll("nav button").forEach(x=>x.classList.remove("on")); b.classList.add("on");
  document.querySelectorAll(".view").forEach(v=>v.classList.remove("on"));
  document.getElementById("v-"+b.dataset.v).classList.add("on"); window.scrollTo(0,0);
});
/* salta a una scheda dal contenuto, non dalla barra */
function goTab(v){
  const b = document.querySelector('nav button[data-v="'+v+'"]');
  if(b) b.click();
}
document.getElementById("bGear").onclick=()=>openSheet("menu");
document.getElementById("bPrev").onclick=()=>{ cur.setDate(cur.getDate()-1); render(); };
document.getElementById("bNext").onclick=()=>{ cur.setDate(cur.getDate()+1); render(); };
document.getElementById("bToday").onclick=()=>{ cur=new Date(); cur.setHours(12,0,0,0); render(); };
applySkin();
fixBlocked();
pruneLeftovers();
autoSnap();
render();

</script>

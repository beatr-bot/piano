<style>
:root{
  --sage:#a8b5a0;            /* verdolino chiaro */
  --sage-2:#9cab92;          /* verdolino medio: barra in alto */
  --sage-wash:#eef1ea;
  --sage-mist:#f5f7f2;
  --bg:#f9f9f5; --card:#fff;
  --ink:#2c332a;             /* testo: verde così scuro da leggersi quasi nero */
  --ink-soft:#55634d;        /* accento leggibile, stessa famiglia */
  --muted:#7e8379;
  --line:#e9ebe3;
  --clay:#b9705a;            /* allarmi e giorni di ciclo */
  --clay-wash:#f9efeb;
  --ok:#5d8a6a; --ok-wash:#ebf1eb;
  --sky:#7d99b4; --sky-wash:#eff3f7;
  --lilac:#a389b0; --lilac-wash:#f4eff6;
  --safe-b:env(safe-area-inset-bottom,0px);
  --serif:ui-serif,"New York","Iowan Old Style",Georgia,Cambria,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  --shadow:0 1px 2px rgba(44,51,42,.03), 0 12px 30px -18px rgba(44,51,42,.18);
  --chip:#fff;               /* superfici bianche: caselle, pulsanti secondari */
  --on-ink:#fff;             /* testo sopra i pulsanti scuri */
  --cb-line:#d7dcd0;
  --chev:#bcc2b5;
  --nav-bg:rgba(252,252,249,.94);
  --page-bg:var(--bg);
  --disp:var(--serif); --disp-w:400; --disp-tt:none; --disp-ls:-.014em;
  --fig-near:#1b1a18; --fig-far:#a9a29a; --fig-head:#faf8f5;
  --fig-prop:#c3bbb1; --fig-prop2:#d9d2c8; --fig-eq:#8e8880;
  --pfig-near:#3f5741; --pfig-far:#b6c1ad; --pfig-head:#fbfcfa;
  --pfig-prop:#cfd5c9; --pfig-prop2:#dfe3d9;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--page-bg);color:var(--ink);font-size:15px;line-height:1.5;font-family:var(--sans);
  padding-bottom:calc(80px + var(--safe-b));-webkit-font-smoothing:antialiased}
.wrap{max-width:600px;margin:0 auto;padding:0 14px}
.wknum{font-family:var(--disp);font-weight:var(--disp-w);font-size:25px;letter-spacing:var(--disp-ls);line-height:1.05;margin-top:3px}
.wknum span{font-size:12px;color:var(--muted);margin-left:3px;font-family:var(--sans);font-weight:600}
.wkday{cursor:pointer}
.wkday.tod{border-color:var(--sage-2);box-shadow:0 0 0 1px var(--sage-2) inset,var(--shadow)}
.wkmeals{display:flex;flex-wrap:wrap;gap:5px;margin-top:11px}
.wkm{font-size:11.5px;color:var(--ink-soft);background:var(--sage-mist);border-radius:14px;padding:4px 9px}
.wkm.lo{background:var(--ok-wash);color:var(--ok)}
h1,h2,h3,h4{margin:0}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:inherit;font-size:16px;color:var(--ink)}

/* ---------- header ---------- */
.top{background:var(--sage-2);color:var(--ink);padding:calc(env(safe-area-inset-top,0px) + 15px) 0 15px;position:sticky;top:0;z-index:40}
.top .wrap{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.dt{font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;opacity:.62;font-weight:600}
.dn{font-family:var(--disp);font-size:27px;font-weight:400;letter-spacing:-.018em;line-height:1.02;margin-top:5px}
.navdate{display:flex;gap:6px;align-items:center;padding-bottom:4px}
.navdate button{height:33px;min-width:33px;border-radius:17px;background:rgba(255,255,255,.4);font-size:15px;
  line-height:1;display:grid;place-items:center;color:var(--ink)}
.navdate button:active{background:rgba(255,255,255,.8)}
#bToday{padding:0 13px;font-size:10.5px;font-weight:700;letter-spacing:.14em}

/* ---------- generico ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px;margin:10px 0;box-shadow:var(--shadow)}
.sec-t{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:19px 0 7px;padding-left:3px}
.muted{color:var(--muted)}
.sm{font-size:13.5px;line-height:1.5}
.xs{font-size:12px;line-height:1.45;color:var(--muted)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
h3{font-family:var(--disp);font-weight:var(--disp-w);letter-spacing:var(--disp-ls);text-transform:var(--disp-tt)}
h4{font-family:var(--disp);font-weight:400;font-size:17.5px;letter-spacing:-.008em}

.pill{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;padding:5px 12px;border-radius:20px}
.pill-a{background:var(--clay-wash);color:var(--clay)}
.pill-g{background:var(--ok-wash);color:var(--ok)}
.pill-b{background:var(--sky-wash);color:var(--sky)}
.pill-p{background:var(--lilac-wash);color:var(--lilac)}

.callout{background:var(--sage-wash);padding:12px 14px;border-radius:14px;margin:10px 0;font-size:13px;line-height:1.5}
.callout b,.callout strong{color:var(--ink-soft);font-weight:700}
.callout.g{background:var(--ok-wash)} .callout.g b,.callout.g strong{color:var(--ok)}
.callout.p{background:var(--lilac-wash)} .callout.p b,.callout.p strong{color:var(--lilac)}
.callout.w{background:var(--clay-wash)} .callout.w b,.callout.w strong{color:var(--clay)}

.btn{display:inline-block;background:var(--ink);color:var(--on-ink);border-radius:13px;padding:11px 16px;font-weight:600;font-size:14px;text-align:center}
.btn:active{opacity:.78}
.btn.sec{background:var(--chip);color:var(--ink);border:1px solid var(--line)}
.btn.wide{display:block;width:100%}
.btn.acc{background:var(--sage-2);color:var(--ink);font-weight:700}

/* ---------- esercizi ---------- */
.exr{border-bottom:1px solid var(--line)}
.exr:last-child{border-bottom:none}
.exhead{display:flex;align-items:center;gap:12px;padding:10px 0}
.cb{width:25px;height:25px;border-radius:50%;border:1.5px solid var(--cb-line);flex:0 0 auto;display:grid;place-items:center;background:var(--chip);transition:.15s}
.cb.on{background:var(--sage-2);border-color:var(--sage-2)}
.cb svg{width:13px;height:13px;opacity:0;stroke:#fff;stroke-width:3.2;fill:none}
.cb.on svg{opacity:1}
.cb.on svg path{stroke:var(--on-cb,#fff)}
.exname{flex:1;min-width:0}
.exname b{display:block;font-size:14.5px;font-weight:600;line-height:1.3}
.exr.done .exname b{opacity:.4;text-decoration:line-through}
.exdose{font-size:12.5px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.chev{width:24px;text-align:center;color:var(--chev);font-size:11px;transition:.2s}
.exr.open .chev{transform:rotate(180deg)}
.exbody{display:none;padding:2px 0 16px}
.exr.open .exbody{display:block}
figure{margin:0 0 12px;background:var(--sage-mist);border-radius:18px;overflow:hidden}
figure svg{display:block;width:100%;height:auto;background:var(--sage-mist)}
.figcap{display:flex;gap:5px;padding:7px}
.figcap button{flex:1;padding:8px;font-size:11.5px;font-weight:600;color:var(--muted);border-radius:12px;letter-spacing:.02em}
.figcap button.on{background:var(--chip);color:var(--ink);box-shadow:0 1px 4px rgba(44,51,42,.1)}
.errl{list-style:none;padding:0;margin:12px 0 0}
.errl li{position:relative;padding-left:18px;font-size:13px;color:var(--muted);margin-bottom:6px;line-height:1.52}
.errl li::before{content:"";position:absolute;left:2px;top:8px;width:5px;height:5px;border-radius:5px;background:var(--clay)}
.logrow{display:flex;gap:9px;align-items:center;margin-top:13px}
.logrow input{flex:1;min-width:0;border:1px solid var(--line);border-radius:14px;padding:11px 13px;background:var(--sage-mist)}
.prev{font-size:12px;color:var(--muted);margin-top:7px}
.yt{display:inline-flex;align-items:center;gap:6px;margin-top:13px;font-size:13px;font-weight:600;color:var(--ink-soft);text-decoration:none}

.pbar{height:5px;border-radius:5px;background:var(--sage-wash);overflow:hidden;margin-top:9px}
.pbar i{display:block;height:100%;background:var(--sage-2);width:0;transition:.35s;border-radius:6px}

/* ---------- pasti ---------- */
.mcard{border:1px solid var(--line);border-radius:18px;margin:9px 0;overflow:hidden;background:var(--card);box-shadow:var(--shadow)}
.mhead{padding:13px 15px;display:flex;justify-content:space-between;gap:11px;align-items:flex-start}
.mslot{font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);font-weight:600}
.mname{font-family:var(--disp);font-size:17.5px;font-weight:var(--disp-w);margin-top:3px;line-height:1.15;letter-spacing:var(--disp-ls)}
.mmac{font-size:11px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums;text-align:right;line-height:1.55}
.mbody{padding:12px 15px 13px;background:var(--sage-mist)}
.ingl{list-style:none;padding:0;margin:0 0 12px}
.ingl li{font-size:13px;padding:2px 0 2px 14px;position:relative}
.ingl li::before{content:"";position:absolute;left:2px;top:12px;width:4px;height:4px;border-radius:4px;background:var(--sage-2)}
.procl{padding-left:17px;margin:0;font-size:13px}
.procl li{margin-bottom:5px;line-height:1.45}
.macts{display:flex;gap:6px;padding:0 15px 12px;align-items:center}
.macts button{flex:1;border:1px solid var(--line);border-radius:12px;padding:9px 6px;font-size:12px;font-weight:600;color:var(--muted);background:var(--chip);white-space:nowrap}
.macts button.on{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.alt{padding:0 18px 16px}
.altitem{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);border-radius:13px;padding:10px 12px;margin-bottom:6px}
.altitem:active{background:var(--sage-mist)}
.altitem.cur{border-color:var(--sage-2);background:var(--sage-wash)}

/* ---------- tabelle ---------- */
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:9.5px;text-transform:uppercase;letter-spacing:.18em;color:var(--muted);padding:8px 8px 8px 0;border-bottom:1px solid var(--line);font-weight:600}
td{padding:11px 8px 11px 0;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:none}
td.n{white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right;padding-right:0}
td.n b{color:var(--ink);font-weight:600}

/* ---------- form ---------- */
.f{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}
.f label{font-size:10px;text-transform:uppercase;letter-spacing:.18em;color:var(--muted);font-weight:600}
.f input,.f select{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--sage-mist);width:100%}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}

/* ---------- calendario ---------- */
.calhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.calhead b{font-family:var(--disp);font-size:18.5px;font-weight:400;letter-spacing:-.012em}
.calhead button{width:33px;height:33px;border-radius:17px;background:var(--sage-mist);color:var(--muted);font-size:14px;line-height:1;display:grid;place-items:center}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cdow{text-align:center;font-size:9px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;padding-bottom:6px}
.cd{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:13.5px;font-weight:500;
    border:1.5px solid transparent;background:var(--sage-mist);color:var(--ink);position:relative;cursor:pointer;user-select:none;font-variant-numeric:tabular-nums}
.cd.emp{background:none;cursor:default}
.cd.fut{opacity:.38;cursor:default}
.cd.mes{background:#f4e2db;color:#8d5040}
.cd.fol{background:var(--sage-wash);color:var(--ink-soft)}
.cd.ovu{background:var(--sky-wash);color:#4c6480}
.cd.lut{background:var(--lilac-wash);color:#775a83}
.cd.per{background:var(--clay);color:#fff;border-color:var(--clay)}
.cd.per::after{content:"";position:absolute;bottom:5px;width:3px;height:3px;border-radius:3px;background:rgba(255,255,255,.9)}
.cd.per.prov{background:repeating-linear-gradient(135deg,var(--clay),var(--clay) 4px,#d1917d 4px,#d1917d 9px)}
.cd.per.autoc{background:#e3b6a7;color:#7d3f2c;border:1.5px dashed var(--clay)}
.cd.pred{background:repeating-linear-gradient(135deg,#fbf1ec,#fbf1ec 4px,#f3e0d7 4px,#f3e0d7 8px);color:#b08876;border-color:#f1ddd4}
.cd.tod{border-color:var(--ink)}
.leg{display:flex;flex-wrap:wrap;gap:11px;margin-top:15px}
.leg span{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.leg i{width:11px;height:11px;border-radius:50%;display:block;flex:0 0 auto}
.legprov{background:repeating-linear-gradient(135deg,var(--clay),var(--clay) 3px,#d1917d 3px,#d1917d 7px)}

/* ---------- spesa ---------- */
.shrow{display:flex;align-items:flex-start;gap:13px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.shrow:last-child{border-bottom:none}
.shtxt{flex:1;min-width:0;font-size:14px;line-height:1.42}
.shq{font-weight:700;color:var(--ink-soft);margin-right:7px;font-variant-numeric:tabular-nums}
.shrow.on .shtxt{opacity:.36;text-decoration:line-through}
.shrow.on .shq{color:var(--muted)}
.shadd{display:flex;gap:9px;margin-top:12px}
.shadd input{flex:1;min-width:0;border:1px solid var(--line);border-radius:15px;padding:12px;background:var(--sage-mist)}

/* ---------- nav ---------- */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--nav-bg);backdrop-filter:blur(18px);
    border-top:1px solid var(--line);display:flex;z-index:50;padding-bottom:var(--safe-b)}
nav button{flex:1;padding:11px 1px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--muted);font-size:9.5px;font-weight:600;letter-spacing:.04em;min-width:0}
nav button svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--ink)}
nav button.on svg{stroke-width:2}
.view{display:none}
.view.on{display:block}

details{border:1px solid var(--line);border-radius:18px;background:var(--card);margin:9px 0;overflow:hidden;box-shadow:var(--shadow)}
details summary{padding:13px 15px;font-family:var(--disp);font-weight:var(--disp-w);font-size:16px;letter-spacing:-.01em;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:12px}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"";width:7px;height:7px;border-right:1.5px solid var(--chev);border-bottom:1.5px solid var(--chev);transform:rotate(45deg) translateY(-2px);transition:.2s;flex:0 0 auto}
details[open] summary::after{transform:rotate(-135deg) translateY(1px)}
details .dc{padding:0 15px 15px}
.chart{width:100%;height:auto;display:block}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(94px + var(--safe-b));background:var(--ink);color:var(--on-ink);
  padding:13px 21px;border-radius:18px;font-size:13.5px;font-weight:500;z-index:99;opacity:0;pointer-events:none;transition:.28s;max-width:88%;
  box-shadow:0 10px 30px -12px rgba(44,51,42,.5)}
.toast.on{opacity:1}

/* ---------- compagna di allenamento ---------- */
#pal,#sheet{position:fixed;inset:0;z-index:95;background:var(--page-bg);display:none;flex-direction:column}
#pal.on,#sheet.on{display:flex}
#sheet .pal-top{justify-content:flex-start;gap:14px}
#sheet .pal-top b{flex:1;text-align:center}
.menurow{display:flex;align-items:center;gap:15px;background:var(--card);border:1px solid var(--line);
  border-radius:22px;padding:19px;margin:14px 0;box-shadow:var(--shadow);cursor:pointer}
.menurow svg{width:22px;height:22px;flex:0 0 auto;fill:none;stroke:var(--ink-soft);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.menurow b{display:block;font-family:var(--disp);font-weight:var(--disp-w);font-size:19px;letter-spacing:var(--disp-ls)}
.menurow .xs{margin-top:3px}
.menurow i{margin-left:auto;font-style:normal;color:var(--chev)}
.pal-top{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--sage-2);color:var(--ink);
  padding:calc(env(safe-area-inset-top,0px) + 15px) 17px 15px}
.pal-top b{font-family:var(--disp);font-size:20px;font-weight:400;letter-spacing:-.012em}
.pal-x{width:34px;height:34px;border-radius:17px;background:rgba(255,255,255,.45);display:grid;place-items:center;font-size:16px;flex:0 0 auto}
.pal-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 17px calc(26px + var(--safe-b))}
.pal-scroll>:first-child{margin-top:14px}
.pal-stage{background:#fff;border:1px solid var(--line);border-radius:24px;padding:17px;margin:14px 0;box-shadow:var(--shadow)}
.pal-name{font-family:var(--disp);font-size:25px;font-weight:400;line-height:1.14;letter-spacing:-.02em;margin-top:6px}
.palfig{background:var(--sage-mist);border-radius:19px;margin:13px 0;padding:5px}
.palfig svg{display:block;width:100%;height:auto}
.palfig.big{padding:9px 5px}
.pal-duo{display:grid;grid-template-columns:1fr 1fr;gap:11px;text-align:center;margin-top:4px}
.pal-duo>div{border:1px solid var(--line);border-radius:20px;padding:13px 8px;background:var(--sage-mist)}
.pal-duo .lab{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:600}
.pal-num{font-family:var(--disp);font-size:46px;font-weight:400;line-height:1.02;letter-spacing:-.03em;font-variant-numeric:tabular-nums;margin-top:3px}
.pal-big{font-family:var(--disp);font-size:70px;font-weight:400;line-height:1;letter-spacing:-.04em;font-variant-numeric:tabular-nums;margin:6px 0 4px}
.pal-pair{margin-top:11px;text-align:center;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600}
.pal-pair b{font-family:var(--disp);font-size:26px;font-weight:400;letter-spacing:-.02em;color:var(--ink);text-transform:none;margin:0 5px;vertical-align:-3px}
.pal-pair span{display:block;text-transform:none;letter-spacing:0;font-weight:400;font-size:11.5px;margin-top:2px}
.pal-timer{text-align:center;margin-top:6px}
.pal-timer span{font-family:var(--disp);font-size:62px;font-weight:400;line-height:1;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.pal-timer i{display:block;font-style:normal;font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-top:5px}
.pal-say{min-height:23px;display:flex;align-items:center;font-size:13.5px;color:var(--ink-soft);margin-top:11px;line-height:1.5}

/* ---------- colori delle figure ---------- */
.figsvg .fn,.figsvg .ff,.figsvg .fp{fill:none}
.figsvg .fn{stroke:var(--fig-near)}
.figsvg .ff{stroke:var(--fig-far)}
.figsvg .fh{fill:var(--fig-head);stroke:var(--fig-near)}
.figsvg .fp{stroke:var(--fig-prop)}
.figsvg .fp2{fill:var(--fig-prop2)}
.figsvg .fq{fill:var(--fig-eq)}
.palfig .pn{stroke:var(--pfig-near)}
.palfig .pf{stroke:var(--pfig-far)}
.palfig .ph{fill:var(--pfig-head);stroke:var(--pfig-near)}
.palfig .pp{stroke:var(--pfig-prop)}
.palfig .pp2{fill:var(--pfig-prop2)}
.palfig .pq{fill:var(--fig-eq)}


/* ---------- gusto e gradimento ---------- */
.tasterow{display:flex;gap:6px}
.tb{flex:0 0 auto;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);
  border-radius:12px;width:38px;height:34px;color:var(--muted);background:var(--chip)}
.tb svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tb.on{background:var(--sage-wash);border-color:var(--sage-2);color:var(--ink-soft)}
.tb.on svg{fill:var(--sage-2);stroke:var(--sage-2)}
.tb.no.on{background:var(--clay-wash);border-color:var(--clay);color:var(--clay)}
.tb.no.on svg{fill:none;stroke:var(--clay)}
.flav{margin-top:13px;padding-top:12px;border-top:1px solid var(--line)}
.flav li{font-size:13.5px;line-height:1.55;padding:4px 0 4px 16px;position:relative;list-style:none}
.flav li::before{content:"";position:absolute;left:2px;top:12px;width:5px;height:5px;border-radius:5px;background:var(--clay)}
.flav ul{padding:0;margin:6px 0 0}
.bdgs{display:flex;flex-wrap:wrap;gap:5px}
.bstat{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;
  border:1px solid currentColor;border-radius:20px;padding:4px 10px;flex:0 0 auto}
.mbar{display:flex;align-items:center;gap:9px;margin-top:6px;font-size:11px;color:var(--muted)}
.mbar span{width:78px;flex:0 0 auto}
.mbar i{flex:1;height:5px;border-radius:5px;background:var(--sage-wash);display:block;position:relative}
.mbar i b{display:block;height:100%;border-radius:5px}
.mbar i u{position:absolute;top:-3px;width:2px;height:11px;border-radius:2px;background:var(--ink);opacity:.42}
.mbar em{font-style:normal;width:82px;text-align:right;font-variant-numeric:tabular-nums;font-size:10.5px}
.bdgrow{display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin-top:6px}
.bdg{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  border:1px solid currentColor;border-radius:20px;padding:2px 7px;opacity:.9}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.chips .chip{display:inline-flex;align-items:center;gap:7px;background:var(--sage-wash);color:var(--ink-soft);
  border-radius:20px;padding:7px 11px;font-size:12.5px;font-weight:600}
.chips .chip b{font-weight:700;color:var(--ink)}
.chips .chip i{font-style:normal;cursor:pointer;opacity:.5;font-size:11px}
.lockb{display:inline-flex;align-items:center;gap:4px;font-size:9px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;border:1px solid var(--line);border-radius:20px;padding:5px 10px;color:var(--muted);
  background:var(--chip);cursor:pointer;white-space:nowrap;padding:3px 9px;letter-spacing:.1em}
.lockb svg{width:11px;height:11px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.lockb.on{background:var(--sage-2);border-color:var(--sage-2);color:var(--ink)}
.chips .chip.ghost{background:none;border:1px dashed var(--line);color:var(--muted);cursor:pointer;font-weight:500}
.ingl li.skip{opacity:.5;text-decoration:line-through}
.ingl li.skip b{text-decoration:none;font-size:11.5px;color:var(--clay)}
.procl s.noW{opacity:.4}
.altitem .heart{color:var(--sage-2);margin-left:5px}

/* ---------- "perché": spiegazioni chiuse ---------- */
details.why{border:0;background:none;box-shadow:none;margin:8px 0 0;border-radius:0}
details.why summary{padding:5px 0;font-family:var(--sans);font-size:10.5px;letter-spacing:.16em;
  text-transform:uppercase;font-weight:700;color:var(--muted);justify-content:flex-start;gap:8px}
details.why summary::after{width:5px;height:5px;border-width:1.2px}
details.why .dc{padding:0 0 4px}
details.why .sm{color:var(--muted)}

/* ---------- selettore della pelle ---------- */
#bGear{width:33px;height:33px;border-radius:17px;background:rgba(255,255,255,.4);display:grid;place-items:center}

.skinrow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}
.skinrow button{border:1px solid var(--line);border-radius:16px;padding:12px 6px 11px;background:var(--chip);
  display:flex;flex-direction:column;align-items:center;gap:7px;font-size:11.5px;font-weight:600;color:var(--muted)}
.skinrow button.on{border-color:var(--sage-2);color:var(--ink);box-shadow:0 0 0 1px var(--sage-2) inset}
.skinrow s{width:100%;height:26px;border-radius:9px;display:block;text-decoration:none}
.sk-notte{background:linear-gradient(135deg,#131611 0 55%,#a8b5a0 55% 100%)}
.sk-blocchi{background:linear-gradient(135deg,#a8b5a0 0 50%,#20261e 50% 100%)}
.sk-vetro{background:linear-gradient(135deg,#dfe8d7 0%,#f0eaf3 60%,#fafbf8 100%)}

/* ============================================================
   PELLE · NOTTE
   ============================================================ */
html[data-skin="notte"]{
  --bg:#131611; --page-bg:#131611; --card:#1b1f18;
  --ink:#e9ede4; --ink-soft:#a8b5a0; --muted:#78826f;
  --line:#252a1f; --chip:#20251d; --on-ink:#131611; --on-cb:#131611;
  --cb-line:#39422f; --chev:#5a6450;
  --sage-wash:#22271e; --sage-mist:#191d16;
  --clay:#d08a72; --clay-wash:#2a201c;
  --ok:#8fb79a; --ok-wash:#1e261f;
  --sky:#9db6cf; --sky-wash:#1c2228;
  --lilac:#bfa3cc; --lilac-wash:#241e28;
  --nav-bg:rgba(19,22,17,.92);
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 16px 34px -22px rgba(0,0,0,.7);

}
html[data-skin="notte"] .top{background:#131611;border-bottom:1px solid #252a1f;color:var(--ink)}
html[data-skin="notte"] .dn{color:#a8b5a0}
html[data-skin="notte"] .navdate button,html[data-skin="notte"] #bGear{background:#20251d;color:var(--ink)}
html[data-skin="notte"] .navdate button:active{background:#2c3327}
html[data-skin="notte"] .btn.acc{background:#a8b5a0;color:#131611}
html[data-skin="notte"] .cb.on{background:#a8b5a0;border-color:#a8b5a0}
html[data-skin="notte"] .pal-top{background:#1b1f18;color:#a8b5a0;border-bottom:1px solid #252a1f}
html[data-skin="notte"] .pal-x{background:#282e21;color:var(--ink)}
html[data-skin="notte"] .pal-stage,html[data-skin="notte"] .pal-duo>div{background:#1b1f18}
html[data-skin="notte"] .cd{background:#20251d}
html[data-skin="notte"] .cd.emp{background:none}


/* ============================================================
   PELLE · BLOCCHI
   ============================================================ */
html[data-skin="blocchi"]{

/* ============================================================
   PELLE · VETRO
   ============================================================ */
html[data-skin="vetro"]{

  font-family:"Cormorant Garamond",Georgia,serif;font-weight:300}

<script>
/* ============================================================
   COMPAGNA DI ALLENAMENTO
   ------------------------------------------------------------
   Non è un'amica finta e non finge di essere una persona: è un
   passo. Il motivo per cui è costruita così sta in un filone di
   studi sull'effetto Köhler — in un compito congiuntivo, dove il
   risultato della coppia vale quanto il membro più debole, chi si
   sente indispensabile resiste molto più a lungo. Nel lavoro di
   Irwin e colleghi (2012) il partner era un video, non una persona
   reale, e l'effetto c'era comunque. Da qui le tre regole:
     1. lei è poco più forte di te, non molto  (livello dal tuo storico)
     2. il punteggio della coppia è il TUO numero, non la media
     3. se ti fermi lei finisce la serie e non ti rimprovera
   Questa è una nota di onestà: la fonte l'ho citata a memoria,
   non l'ho potuta verificare mentre costruivo l'app.
   ============================================================ */

const PAL_NAMES = ["Nina","Giulia","Marta","Sara","Bea","Vale","Chiara","Emma","Lia","Alice"];
const PAL_TEMPO = { mountain:1.1, shouldertap:1.5, squat:2.5, disloc:2.6, ytw:2.8, wallslide:3.4,
  deadbug:3.4, openbook:3.6, plank:7, farmer:3, cardio:3, trazioni:3.4, pike:3.2 };
const PAL_MICRO_EX = ["wallslide","squat",null,"pushupInc","squat","plank",null,"deadbug","squat",null,null,"toracica","ponte",null];

const PAL_SAY = {
  greet:["Ci sono. Partiamo piano.","Sono qui. Non è una gara.","Eccomi. Facciamo la prima e poi si vede.","Pronta quando lo sei tu."],
  set:  ["{n} ripetizioni, insieme.","Ne faccio {n}. Tieni il mio ritmo.","{n}. Guardami e vai.","Andiamo di {n}, tranquilla."],
  last: ["Ultime.","Ci siamo.","Tienile.","Ancora poco."],
  end:  ["Fatta.","Bene così.","Serie chiusa.","Questa è andata."],
  stop: ["Finisco io, tu recupera.","Vado avanti da sola, tu respira.","Nessun problema: chiudo io la serie.","Ok, tengo il ritmo per due."],
  extra:["Quella in più contava doppio.","Ecco, quella non l'avevo chiesta.","Brava, una più di me.","Questa te la ricordi."],
  rest: ["Respira col naso.","Bevi un sorso.","Sciogli le spalle.","Non sederti, cammina un po'."],
  go:   ["Si riparte.","Andiamo.","Di nuovo.","Ancora una."],
  fine: ["Fatto. Ci vediamo la prossima.","Finita. Sei venuta, è la parte difficile.","Chiuso. A dopodomani.","Bene. Adesso mangia qualcosa."]
};
function palPick(cat, sub){
  const a = PAL_SAY[cat] || [""];
  let s = a[Math.floor(Math.random()*a.length)];
  if(sub) for(const kk in sub) s = s.split("{"+kk+"}").join(sub[kk]);
  return s;
}

/* ---------------- stato ---------------- */
function palState(){
  if(!st.pal) st.pal = { name:"", sessions:0, hist:[], h:"18:30", audio:true, vibra:true };
  const p = st.pal;
  if(!p.hist) p.hist = [];
  if(p.audio === undefined) p.audio = true;
  if(p.vibra === undefined) p.vibra = true;
  if(!p.h) p.h = "18:30";
  return p;
}
function palExists(){ return !!palState().name; }
function palCreate(){
  const v = (document.getElementById("palname").value||"").trim();
  if(!v){ toast("Scrivile un nome"); return; }
  const p = palState(); p.name = v.slice(0,14); save(); render();
  toast(p.name + " c'è.");
}
function palRename(){
  const p = palState(); const v = prompt("Come si chiama?", p.name);
  if(v && v.trim()){ p.name = v.trim().slice(0,14); save(); render(); }
}
function palDrop(){
  if(!confirm("Rimuovere la compagna? Le sedute già fatte restano nei tuoi progressi.")) return;
  st.pal.name = ""; save(); render(); toast("Rimossa");
}
function palAudio(v){ palState().audio = v; save(); render(); if(v) beep(660,.08,.1); }
function palVib(v){ palState().vibra = v; save(); render(); if(v) buzz(45); }
function palHour(v){ palState().h = v; save(); }

/* ---------------- suono, voce, vibrazione ---------------- */
let _voice = undefined, _actx = null;
function palVoice(){
  if(_voice !== undefined) return _voice;
  try{
    const vs = window.speechSynthesis ? speechSynthesis.getVoices() : [];
    _voice = vs.filter(v=>/^it/i.test(v.lang)).sort((a,b)=>
      (/alice|federica|elsa|donna|female/i.test(b.name)?1:0) - (/alice|federica|elsa|donna|female/i.test(a.name)?1:0))[0] || null;
  }catch(e){ _voice = null; }
  return _voice;
}
function say(txt){
  if(!palState().audio || !txt) return;
  try{
    if(!window.speechSynthesis) return;
    const u = new SpeechSynthesisUtterance(String(txt));
    u.lang = "it-IT"; u.rate = 1.06; u.pitch = 1.06; u.volume = 1;
    const v = palVoice(); if(v) u.voice = v;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  }catch(e){}
}
function beep(f, dur, vol){
  if(!palState().audio) return;
  try{
    if(!_actx){ const C = window.AudioContext||window.webkitAudioContext; if(!C) return; _actx = new C(); }
    if(_actx.state === "suspended") _actx.resume();
    const o = _actx.createOscillator(), g = _actx.createGain();
    o.type = "sine"; o.frequency.value = f || 640;
    o.connect(g); g.connect(_actx.destination);
    const t = _actx.currentTime, d = dur || .08, vv = (vol === undefined ? .12 : vol);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vv, t + .012);
    g.gain.linearRampToValueAtTime(0.0001, t + d);
    o.start(t); o.stop(t + d + .03);
  }catch(e){}
}
function buzz(ms){
  if(!palState().vibra) return;
  try{ if(navigator.vibrate) navigator.vibrate(ms || 40); }catch(e){}
}
let _wake = null, _wakeWant = false;
function wakeOn(){
  _wakeWant = true;
  try{ if(navigator.wakeLock) navigator.wakeLock.request("screen")
    .then(s=>{ if(_wakeWant) _wake = s; else { try{ s.release(); }catch(e){} } }).catch(()=>{}); }catch(e){}
}
function wakeOff(){ _wakeWant = false; try{ if(_wake){ _wake.release(); _wake=null; } }catch(e){} }
/* una notifica o un cambio di scheda fa cadere il blocco: se la sessione
   è ancora aperta lo si riprende, altrimenti lo schermo si spegne a metà */
document.addEventListener("visibilitychange", ()=>{
  if(document.visibilityState === "visible" && _wakeWant && !_wake) wakeOn();
});

/* ---------------- figura animata ---------------- */
/* Costruisce la figura una volta sola e restituisce una funzione
   update(t) con t da 0 (posa di partenza) a 1 (posa di arrivo):
   così l'animazione muove gli attributi e non ridisegna l'HTML. */
function palFig(box, ex){
  const NS = "http://www.w3.org/2000/svg";
  const el = (t,a)=>{ const e = document.createElementNS(NS,t); for(const kk in a) e.setAttribute(kk, a[kk]); return e; };
  box.innerHTML = "";
  const svg = el("svg", {viewBox:"0 0 200 160", "aria-hidden":"true"});
  /* riquadro calcolato sulle due pose: la figura riempie lo spazio invece
     di restare piccola in mezzo al bianco */
  (function(){
    let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
    const add=(x,y)=>{ if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; };
    [ex.a, ex.b||ex.a].forEach(P=>{ for(const kk in P) add(P[kk][0],P[kk][1]); });
    (ex.props||[]).forEach(o=>{
      if(o[0]==="line"){ add(o[1],o[2]); add(o[3],o[4]); }
      else if(o[0]==="rect"){ add(o[1],o[2]); add(o[1]+o[3],o[2]+o[4]); }
      else if(o[0]==="circ"){ add(o[1]-o[3],o[2]-o[3]); add(o[1]+o[3],o[2]+o[3]); }
      else add(o[1],o[2]);
    });
    if(x0>x1) return;
    const pad=15; x0-=pad; y0-=pad; x1+=pad; y1+=pad;
    let w=x1-x0, hh=y1-y0;
    if(w/hh < 1.2){ const nw=hh*1.2; x0-=(nw-w)/2; w=nw; }
    if(w/hh > 2.1){ const nh=w/2.1; y0-=(nh-hh)/2; hh=nh; }
    svg.setAttribute("viewBox", x0.toFixed(1)+" "+y0.toFixed(1)+" "+w.toFixed(1)+" "+hh.toFixed(1));
  })();
  const g = el("g", {"stroke-linecap":"round","stroke-width":"5",fill:"none"});
  svg.appendChild(g); box.appendChild(svg);

  (ex.props||[]).forEach(o=>{
    if(o[0]==="line") g.appendChild(el("line",{"class":"pp",x1:o[1],y1:o[2],x2:o[3],y2:o[4],"stroke-width":5}));
    if(o[0]==="rect") g.appendChild(el("rect",{"class":"pp2",x:o[1],y:o[2],width:o[3],height:o[4],rx:3,stroke:"none"}));
    if(o[0]==="circ") g.appendChild(el("circle",{"class":"pp",cx:o[1],cy:o[2],r:o[3],fill:"none","stroke-width":4}));
  });

  const seg = [];
  const mk = (a,b,c,w)=>{ const e = el("line",{"class":c,x1:0,y1:0,x2:0,y2:0,"stroke-width":w||5}); g.appendChild(e); seg.push([a,b,e]); };
  mk("n","e2","pf"); mk("e2","w2","pf"); mk("p","k2","pf"); mk("k2","f2","pf");
  mk("n","p","pn",6.5); mk("n","e","pn"); mk("e","w","pn"); mk("p","k","pn"); mk("k","f","pn");
  const head = el("circle",{"class":"ph",r:9.5,"stroke-width":5}); g.appendChild(head);

  const A = ex.a, B = ex.b || ex.a;
  const eq = [], used = {};
  (ex.props||[]).forEach(o=>{
    if(o[0] !== "db" && o[0] !== "bar") return;
    const cand = ["w","w2"].filter(j=>A[j]);
    if(!cand.length) return;
    let best = cand[0], bd = 1e9;
    cand.forEach(j=>{ const d = Math.abs(A[j][0]-o[1]) + Math.abs(A[j][1]-o[2]); if(d < bd){ bd = d; best = j; } });
    if(used[best]) return;                       /* un solo attrezzo per mano */
    used[best] = 1;
    const half = o[0]==="bar" ? 30 : 7, hh = o[0]==="bar" ? 9 : 5, pw = o[0]==="bar" ? 6 : 5;
    const gg = el("g",{"class":"pq",stroke:"none"});
    gg.appendChild(el("rect",{x:-half,y:-2,width:half*2,height:4,rx:2}));
    gg.appendChild(el("rect",{x:-half-4,y:-hh,width:pw,height:hh*2,rx:2}));
    gg.appendChild(el("rect",{x:half-1,y:-hh,width:pw,height:hh*2,rx:2}));
    g.appendChild(gg);
    eq.push({el:gg, j:best, dx:o[1]-A[best][0], dy:o[2]-A[best][1]});
  });

  return function(t){
    const P = {};
    for(const kk in A){ const a = A[kk], b = B[kk] || a; P[kk] = [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t]; }
    seg.forEach(s=>{
      const a = P[s[0]], b = P[s[1]]; if(!a || !b) return;
      s[2].setAttribute("x1",a[0]); s[2].setAttribute("y1",a[1]);
      s[2].setAttribute("x2",b[0]); s[2].setAttribute("y2",b[1]);
    });
    if(P.h){ head.setAttribute("cx",P.h[0]); head.setAttribute("cy",P.h[1]); }
    eq.forEach(q=>{ const j = P[q.j]; if(j) q.el.setAttribute("transform","translate("+(j[0]+q.dx)+","+(j[1]+q.dy)+")"); });
  };
}

/* ---------------- lettura della dose ---------------- */
function palParse(dose){
  let s = String(dose).trim(), sets = 1, side = false;
  const m = s.match(/^(\d+)\s*[×x]\s*(.+)$/i);
  if(m){ sets = +m[1]; s = m[2].trim(); }
  if(/per lato/i.test(s)){ side = true; s = s.replace(/per lato/i,"").trim(); }
  s = s.replace(/per lettera/i,"").trim();
  let z = s.match(/^(\d+)\s*"$/);            if(z) return {sets:sets, kind:"hold", secs:+z[1], side:side};
  z = s.match(/^(\d+)\s*second[io]$/i);      if(z) return {sets:sets, kind:"hold", secs:+z[1], side:side};
  z = s.match(/^(\d+)\s*ripetizion[ei]$/i);  if(z) return {sets:sets, kind:"reps", reps:+z[1], side:side};
  z = s.match(/^(\d+)\s*min$/i);             if(z) return {sets:sets, kind:"hold", secs:+z[1]*60, side:side};
  z = s.match(/^(\d+)\s*[–-]\s*(\d+)$/);     if(z) return {sets:sets, kind:"reps", reps:+z[2], side:side};
  z = s.match(/^(\d+)$/);                    if(z) return {sets:sets, kind:"reps", reps:+z[1], side:side};
  return {sets:sets, kind:"free", side:side};   /* "max−2", "40 m" */
}
function palTempo(id){ return (PAL_TEMPO[id] || 3) * 1000; }

/* Il livello di lei esce dal tuo storico: una in più dell'ultima volta,
   mai più di una. Se non ho storico, fa la dose scritta nella scheda. */
function palLastReps(id){
  const ks = Object.keys(st.log||{}).filter(x=>st.log[x][id] && st.log[x][id].r).sort();
  for(let i=ks.length-1;i>=0;i--){
    const v = parseInt(String(st.log[ks[i]][id].r).replace(/[^0-9]/g,""),10);
    if(v>0 && v<200) return v;
  }
  return 0;
}
function palTarget(id, base){
  const mine = palLastReps(id);
  if(!mine) return base || 10;
  return Math.min(mine + 1, (base || 10) + 8);
}

/* ---------------- sessione ---------------- */
let S = null, _upd = null, _raf = 0, _shown = "";

function palQueue(list){
  const q = [];
  list.forEach((it,ix)=>{
    for(let s=1; s<=it.sp.sets; s++){
      if(it.sp.side){ q.push({ix:ix,set:s,side:"destro"}); q.push({ix:ix,set:s,side:"sinistro"}); }
      else q.push({ix:ix,set:s,side:null});
    }
  });
  return q;
}
function palOpen(){
  document.getElementById("pal").classList.add("on");
  document.body.style.overflow = "hidden";
  wakeOn();
  beep(560,.05,.05);          /* sblocca l'audio con il gesto del dito */
  try{ if(window.speechSynthesis) speechSynthesis.getVoices(); }catch(e){}
}
function palStart(wid){
  const W = WORKOUTS[wid]; if(!W) return;
  palStartList(W.t, W.items, wid);
}
function palStartList(title, items, wid){
  const P = palState();
  if(!P.name){ toast("Prima dalle un nome: ingranaggio in alto \u2192 Impostazioni"); return; }
  const c = cyc(cur);
  /* stessi esercizi che vedi nella scheda: se ne hai scartato uno, la
     compagna non te lo ripropone, e la spunta finisce sullo stesso id */
  const list = items.map(it=>{
    const id = exSwap(it[0]);
    const d = doseFor(it[1], c.key);
    return { id:id, dose:d, sp:palParse(d), kg:"", best:0, done:false };
  }).filter(x=>EX[x.id]);
  if(!list.length){ toast("Hai scartato tutti gli esercizi di questa scheda"); return; }
  S = { kind:"work", wid:wid, title:title, list:list, q:palQueue(list), qi:0, st:"intro",
        mine:0, hers:0, target:0, rep:0, stopped:false, t0:0, rest:0, secs:0, last:-1,
        sumMine:0, sumPair:0, blocks:0 };
  palOpen();
  say(palPick("greet"));
  palShow();
  palLoopStart();
}

/* ---- "adesso": si parte senza aspettare il giorno giusto ---- */
const PAL_QUICK = [["squat",'2 × 40"'],["pushupInc",'2 × 30"'],["ponte",'2 × 30"'],["plank",'2 × 30"']];
function palNow(){
  const P = palState();
  if(!P.name){ toast("Prima dalle un nome: ingranaggio in alto \u2192 Impostazioni"); return; }
  S = { kind:"pick", st:"pick", list:[], q:[], qi:0, sumMine:0, sumPair:0, blocks:0 };
  palOpen();
  document.getElementById("palTtl").textContent = P.name;
  say(palPick("greet"));
  palShow();
}
function palPickDo(what){
  if(what === "quick"){ palStartList("Dieci minuti insieme", PAL_QUICK, "quick"); return; }
  if(what === "mob"){ const mk = mobPick(); palStartList(MOB_SET[mk].n, mobItems(), "mob"); return; }
  palStart(what);
}
function palClose(force){
  if(S && S.st !== "done" && !force){
    if(!confirm("Chiudere la sessione? Quello che hai già fatto resta segnato.")) return;
    palFinish(true);
  }
  cancelAnimationFrame(_raf); _raf = 0;
  try{ if(window.speechSynthesis) speechSynthesis.cancel(); }catch(e){}
  S = null; _upd = null; _shown = "";
  document.getElementById("pal").classList.remove("on");
  document.body.style.overflow = "";
  wakeOff(); render();
}
function palCur(){ const b = S.q[S.qi]; return b ? { b:b, it:S.list[b.ix] } : null; }

function palGo(){                            /* dalla schermata di presentazione al lavoro */
  const c = palCur(); if(!c) return;
  const it = c.it, sp = it.sp;
  const kgi = document.getElementById("palkg");
  if(kgi) it.kg = (kgi.value||"").trim();
  S.mine = 0; S.hers = 0; S.rep = 0; S.stopped = false; S.last = -1;
  S.t0 = performance.now();
  if(sp.kind === "hold"){ S.st = "hold"; S.secs = sp.secs; S.line = S.secs + ' secondi. Li tengo anche io.'; say(S.line); }
  else if(sp.kind === "free"){ S.st = "free"; S.line = "Fai il tuo, io ti tengo il tempo."; say(S.line); }
  else { S.st = "work"; S.target = palTarget(it.id, sp.reps); S.line = palPick("set",{n:S.target}); say(S.line); }
  palShow();
}
function palStop(){                          /* "mi fermo": lei continua, il punteggio è il tuo */
  if(S.st !== "work" || S.stopped) return;
  S.stopped = true; S.line = palPick("stop"); say(S.line); palShow();
}
function palPlus(){                          /* una in più delle sue */
  if(S.st !== "ended") return;
  S.mine++; buzz(35); beep(880,.08,.12); say(palPick("extra")); palShow();
}
function palEnded(){
  const c = palCur(); if(!c) return;
  const it = c.it;
  S.st = "ended";
  it.best = Math.max(it.best||0, S.mine);
  it.done = true;
  S.sumMine += S.mine; S.sumPair += Math.min(S.mine, S.hers); S.blocks++;
  buzz(70);
  say(S.stopped ? "Serie chiusa. Il conto della coppia è " + S.mine + "." : palPick("end"));
  palShow();
}
function palRest(){
  const nx = S.q[S.qi+1];
  if(!nx){ palDone(); return; }
  const c = palCur();
  const sameEx = nx.ix === c.b.ix;
  S.rest = c.b.side && nx.side === "sinistro" ? 15 : (sameEx ? 60 : 80);
  S.st = "rest"; S.t0 = performance.now(); S.last = -1;
  say(palPick("rest"));
  palShow();
}
function palSkipRest(){ if(S.st === "rest") palNext(); }
function palNext(){
  S.qi++;
  const nx = S.q[S.qi];
  if(!nx){ palDone(); return; }
  const prev = S.q[S.qi-1];
  if(prev && prev.ix !== nx.ix){ S.st = "intro"; palShow(); }
  else { say(palPick("go")); palGo(); }
}
function palDone(){
  S.st = "done"; palFinish(false);
  say(palPick("fine"));
  palShow();
}
function palFinish(partial){
  /* sempre oggi: la sessione l'hai fatta adesso, anche se nella scheda stavi
     guardando un altro giorno */
  const P = palState(), key = todayKey(), rec = dayRec(key);
  const mob = S.wid === "mob";
  if(!st.log[key]) st.log[key] = {};
  S.list.forEach(it=>{
    if(!it.done) return;
    if(mob) rec.mob[it.id] = true; else rec.ex[it.id] = true;
    if(it.best || it.kg){
      const v = st.log[key][it.id] || {};
      st.log[key][it.id] = { w: it.kg || v.w || "",              /* i giri che avevi scritto restano */
                             r: it.best ? String(it.best) + (it.sp && it.sp.kind === "hold" ? '"' : "") : (v.r || "") };
    }
  });
  if(S.blocks > 0){
    P.sessions = (P.sessions||0) + 1;
    P.last = key;
    P.hist.push({ d:key, pair:S.sumPair, mine:S.sumMine, b:S.blocks, w:S.wid||"micro", part: partial?1:0 });
    if(P.hist.length > 80) P.hist = P.hist.slice(-80);
    st.miniDone = st.miniDone || {}; st.miniDone[key] = true;
  }
  save();
}
function palMood(v){ setMood(v); palShow(); }

/* ---------------- il ciclo di animazione ---------------- */
function palLoopStart(){ if(_raf) cancelAnimationFrame(_raf); _raf = 0; palLoop(); }
function palLoop(){
  _raf = requestAnimationFrame(palLoop);
  if(!S) return;
  const now = performance.now(), c = palCur();

  if(S.st === "work" && c){
    const tp = palTempo(c.it.id), p = (now - S.t0)/tp, rep = Math.floor(p), fr = p - rep;
    if(_upd) _upd((1 - Math.cos(fr*2*Math.PI))/2);
    if(rep > S.rep){
      S.rep = rep;
      if(!S.stopped && S.mine < S.target) S.mine++;
      S.hers = Math.min(S.target, S.hers + 1);
      const left = S.target - S.hers;
      if(left <= 0){ palNums(); palEnded(); return; }
      beep(left <= 3 ? 760 : 600, .07, .1);
      if(left <= 3) say(left === 1 ? "una" : left === 2 ? "due" : "tre");
      else if(left === Math.floor(S.target/2)) say("metà");
      palNums();
    }
    return;
  }
  if(S.st === "hold" && c){
    const el = (now - S.t0)/1000, left = Math.max(0, S.secs - el);
    if(_upd) _upd((1 - Math.cos(el/(palTempo(c.it.id)/1000)*2*Math.PI))/2);
    const s = Math.ceil(left);
    if(s !== S.last){
      S.last = s;
      const n = document.getElementById("palTimer"); if(n) n.textContent = s;
      if(s <= 3 && s > 0){ beep(760,.07,.1); say(String(s)); }
    }
    if(left <= 0){ S.mine = S.secs; S.hers = S.secs; palEnded(); }
    return;
  }
  if(S.st === "free" && c){
    const el = (now - S.t0)/1000;
    if(_upd) _upd((1 - Math.cos(el/(palTempo(c.it.id)/1000)*2*Math.PI))/2);
    const s = Math.floor(el);
    if(s !== S.last){ S.last = s;
      const n = document.getElementById("palTimer"); if(n) n.textContent = palClock(s); }
    return;
  }
  if(S.st === "rest"){
    const left = Math.max(0, S.rest - (now - S.t0)/1000), s = Math.ceil(left);
    if(s !== S.last){
      S.last = s;
      const n = document.getElementById("palTimer"); if(n) n.textContent = s;
      if(s <= 3 && s > 0) beep(620,.06,.08);
    }
    if(left <= 0){ buzz(60); palNext(); }
    return;
  }
  if(S.st === "micro"){
    const el = (now - S.t0)/1000, left = Math.max(0, S.secs - el), s = Math.ceil(left);
    if(_upd) _upd((1 - Math.cos(el/3*2*Math.PI))/2);
    if(s !== S.last){
      S.last = s;
      const n = document.getElementById("palTimer"); if(n) n.textContent = palClock(s);
      if(s > 0 && s % 60 === 0 && s !== S.secs){ const q = document.getElementById("palSay"); if(q){ const t = palPick("rest"); q.textContent = t; say(t); } }
      if(s <= 3 && s > 0) beep(760,.07,.1);
    }
    if(left <= 0){ S.mine = 1; S.blocks = 1; S.st = "done"; palFinish(false); buzz(90); say(palPick("fine")); palShow(); }
    return;
  }
}
function palClock(s){ const m = Math.floor(s/60); return m + ":" + String(s%60).padStart(2,"0"); }
function palNums(){
  const a = document.getElementById("palMine"), b = document.getElementById("palHers"), p = document.getElementById("palPair");
  if(a) a.textContent = S.mine;
  if(b) b.textContent = S.hers;
  if(p) p.textContent = Math.min(S.mine, S.hers);
}

        + '<div class="sm" style="margin-top:14px">' + esc(palPick("fine")) + '</div></div>';

      h += '<div class="pal-stage"><div class="mslot">Come stai adesso</div>'
        + '<div class="sm" style="margin:8px 0 12px">Rispondi ora.</div>'

        + '<button class="btn sec" onclick="palMood(\'+\')">Meglio</button>'

  }

  if(S.st === "micro"){

      + '<div class="pal-name">' + esc(card.n) + '</div>'

      + '<div class="pal-big" id="palTimer">' + palClock(S.secs) + '</div>'
      + '<div class="pal-say" id="palSay" style="justify-content:center">' + esc(palPick("greet")) + '</div></div>';
    h += '<button class="btn sec wide" onclick="palMicroStop()">Basta, ho finito</button>';
    body.innerHTML = h;
    _upd = S.ex ? palFig(document.getElementById("palFig"), S.ex) : null;
    if(_upd) _upd(0);
    _shown = "micro"; return;
  }

  if(S.st === "pick"){
    const dow = cur.getDay(), plan = WEEK[dow], ph = progPhase(cur);
    const todayW = plan.type === "work" ? (ph === 1 ? "gym" : "home") + plan.slot : null;
    ttl.textContent = P.name;
    h += '<div class="pal-stage"><div class="mslot">Adesso</div>'
      + '<div class="pal-name">Cosa facciamo?</div>'
      + '<div class="xs" style="margin-top:7px">' + (todayW
        ? 'Oggi tocca la scheda ' + plan.slot + ', ma scegli tu: nessuna di queste è sbagliata.'
        : (plan.type === "rest"
          ? 'Sul piano oggi è riposo. Se hai voglia di muoverti lo stesso, meglio una cosa corta che niente.'
          : 'Oggi il piano non prevede pesi. Puoi fare la versione corta, oppure una scheda intera lo stesso.')) + '</div></div>';
    const row = (t, sub, fn) => '<div class="altitem" onclick="' + fn + '"><div><b style="font-size:14.5px">' + esc(t) + '</b>'

    if(todayW) h += row("La scheda di oggi", WORKOUTS[todayW].t + " · circa mezz'ora", "palPickDo('" + todayW + "')");
    h += row("Dieci minuti insieme", "Squat, push-up su rialzo, ponte glutei, plank. Niente attrezzi, ovunque tu sia.", "palPickDo('quick')");
    h += row("Cinque minuti di spalle", "Solo la mobilità: si fa anche in pigiama, davanti alla TV.", "palPickDo('mob')");
    h += '<div class="sec-t" style="margin-top:22px">Oppure una scheda intera</div>';
    ["A","B","C"].forEach(x=>{
      const w = (ph === 1 ? "gym" : "home") + x;

    });

  }

  if(!c){ palDone(); return; }
  const it = c.it, ex = EX[it.id], sp = it.sp;
  ttl.textContent = P.name + " · " + (c.b.ix+1) + "/" + S.list.length;

  if(S.st === "intro"){
    const tgt = sp.kind === "reps" ? palTarget(it.id, sp.reps) : 0;

      + '<div class="pal-name">' + esc(ex.n) + '</div>'

    body.innerHTML = h;
    _upd = palFig(document.getElementById("palFig"), ex); _upd(0); _shown = "intro";
    return;
  }

  if(S.st === "work" || S.st === "hold" || S.st === "free"){
    const lab = c.b.side ? " · lato " + c.b.side : "";
    h += '<div class="pal-stage"><div class="mslot">' + esc(ex.n) + '</div>'
      + '<div class="xs" style="margin-top:3px">Serie ' + c.b.set + ' di ' + sp.sets + esc(lab) + '</div>'
      + '<div class="palfig big" id="palFig"></div>';
    if(S.st === "work"){
      h += '<div class="pal-duo"><div><div class="lab">Tu</div><div class="pal-num" id="palMine">' + S.mine + '</div></div>'
        + '<div><div class="lab">' + esc(P.name) + '</div><div class="pal-num" id="palHers">' + S.hers + '</div></div></div>'
        + '<div class="pal-pair">Coppia <b id="palPair">' + Math.min(S.mine,S.hers) + '</b> <span>vale il numero più basso delle due</span></div>';
    } else {
      h += '<div class="pal-timer"><span id="palTimer">' + (S.st === "hold" ? S.secs : "0:00") + '</span>'
        + '<i>' + (S.st === "hold" ? "secondi" : "in corso") + '</i></div>';
    }
    h += '<div class="pal-say" id="palSay">' + esc(S.line || "") + '</div></div>';
    if(S.st === "work") h += S.stopped
      ? '<div class="callout"><b>Finisce lei.</b> La coppia resta ' + S.mine + ': è il tuo numero. Respira.</div>'
      : '<button class="btn sec wide" onclick="palStop()">Mi fermo</button>';
    if(S.st === "free") h += '<button class="btn wide acc" onclick="palFreeDone()">Fatto</button>';
    if(S.st === "hold") h += '<button class="btn sec wide" onclick="palHoldStop()">Non tengo più</button>';
    body.innerHTML = h;
    _upd = palFig(document.getElementById("palFig"), ex); _upd(0); _shown = S.st;
    return;
  }

  if(S.st === "ended"){
    const pair = Math.min(S.mine, S.hers), plus = S.mine > S.hers;
    h += '<div class="pal-stage" style="text-align:center">'
      + '<div class="mslot">' + (sp.kind === "hold" ? "Tenuto" : "Coppia") + '</div>'
      + '<div class="pal-big">' + (sp.kind === "hold" ? S.mine + '"' : pair) + '</div>'
      + '<div class="xs">' + (sp.kind === "hold" ? 'insieme, fino in fondo'

        : 'a pari, tutte e due ' + S.hers)) + '</div>'
      + '<div class="sm" style="margin-top:13px">' + esc(S.stopped
        ? 'Non è un fallimento: il numero è comunque salito nel diario, e la prossima volta lei parte da lì.'

    h += '<button class="btn wide acc" style="margin-top:8px" onclick="palRest()">' + (S.q[S.qi+1] ? "Recupero" : "Chiudi la seduta") + '</button>';

      + '<button class="btn sec" onclick="palSkipRest()">Riparto ora</button></div>';
    body.innerHTML = h; _upd = null; _shown = "rest"; return;
  }

function palHoldStop(){
  if(S.st !== "hold") return;
  S.mine = Math.max(1, Math.round((performance.now() - S.t0)/1000));
  S.hers = S.secs; palEnded();
}
function palRestAdd(n){ if(S.st === "rest"){ S.rest += n; S.last = -1; palShow(); } }
function palSkipEx(){
  const c = palCur(); if(!c) return;
  const ix = c.b.ix;
  while(S.q[S.qi] && S.q[S.qi].ix === ix) S.qi++;
  if(!S.q[S.qi]) palDone(); else { S.st = "intro"; palShow(); }
}
function palFreeDone(){ S.mine = 1; S.hers = 1; palEnded(); }

function flavour(id){
  const m = MEALS[id]; if(!m) return [];
  const txt = (m.n + " " + (m.ing||[]).join(" ")).toLowerCase();
  let out = [];
  FLAV.forEach(([re, tips])=>{ if(re.test(txt)) tips.forEach(t=>{ if(out.indexOf(t)<0) out.push(t); }); });
  const no = noList();
  out = out.filter(t=>!no.some(w=>w && t.toLowerCase().indexOf(w) >= 0));
  const dolce = /yogurt|porridge|avena|pancake|miele|frutti di bosco|cornetto/i.test(txt);
  if(st.piccante && !dolce && no.indexOf("peperoncino") < 0){
    if(out.some(t=>/peperoncino/i.test(t)))          /* ce l'ha già: lo porto in cima */
      out.sort((x,y)=>(/peperoncino/i.test(y)?1:0)-(/peperoncino/i.test(x)?1:0));
    else out.unshift("Peperoncino: un pizzico a crudo alla fine, o un pezzetto nell'olio all'inizio.");
  }
  return out.slice(0,3);
}

/* ---------------- quanto sazia ---------------- */
/* Non è la porzione a saziare: sono le proteine e il volume.
   Proteine per 100 kcal + quanti "riempitivi" onesti ci sono dentro. */
const VOLUM = [/verdur|insalat|pomodor|zucchin|spinac|broccol|cavol|melanzan|peperon|finocch|carot|cipoll/i,
               /patat/i, /zuppa|vellutata|brodo|minestr/i, /yogurt|ricotta|latte/i,
               /lentic|ceci|borlott|fagiol|legum/i, /frutta|mela|pera|banana|frutti di bosco|arance|fragol/i];
function satiety(id){
  const m = MEALS[id]; if(!m) return 0;
  const txt = (m.n + " " + (m.ing||[]).join(" ")).toLowerCase();
  const dens = m.p / Math.max(1, m.k/100);            /* g di proteine ogni 100 kcal */
  let vol = 0; VOLUM.forEach(re=>{ if(re.test(txt)) vol++; });
  return Math.min(10, dens*0.8 + vol*0.8);
}
function satLabel(id){
  const s = satiety(id);
  if(s >= 7.5) return {t:"Sazia a lungo", c:"var(--ok)"};
  if(s >= 5.2) return {t:"Sazia", c:"var(--ink-soft)"};
  return {t:"Sazia poco", c:"var(--clay)"};
}

/* ---------------- etichette ---------------- */
/* Il tempo diviso in due: quanto stai davvero in piedi a fare qualcosa
   (preparazione) e quanto invece il piatto si cuoce da solo. Sono due
   cose diverse quando torni stanca: 8 minuti di lavoro e 35 di forno
   non sono 45 minuti di fatica. */
const PREP = {
  c1:2, c2:3, c3:3, c4:3, c5:5, c6:5, c7:2, c8:4, c9:5,
  p1:10, p2:8, p3:10, p4:5, p5:8, p6:10, p7:6, p8:8, p9:0, p10:8, p11:8, p12:8, p13:7,
  s1:1, s2:1, s3:1, s4:1, s5:1, s6:2, s7:1, s8:1, s9:1, s10:2,
  e1:6, e2:8, e3:10, e4:6, e5:8, e6:12, e7:10, e8:10, e9:10, e10:8, e11:10, e12:8,
  c10:4, c11:3, c12:5, c13:5, c14:5, p14:7, p15:8, p16:6, p17:8, p18:10,
  s11:2, s13:3, e13:12, e14:10, e15:8, e16:8, e17:8
};
function times(id){
  const m = MEALS[id] || {}, t = m.t || 0;
  const p = Math.min(PREP[id] === undefined ? t : PREP[id], t);
  return {tot:t, prep:p, cook:Math.max(0, t - p)};
}
function timeLabel(id){
  const T = times(id);
  const col = T.tot <= 15 ? "var(--ok)" : T.tot <= 30 ? "var(--ink-soft)" : "var(--clay)";
  if(T.tot <= 3) return {t:"Subito", c:"var(--ok)"};
  if(!T.cook)    return {t:T.prep + "' di lavoro", c:col};
  return {t:T.prep + "' + " + T.cook + "' di cottura", c:col};
}
function badges(id){
  const T = timeLabel(id), S = satLabel(id);
  return '<div class="bdgs">'
    + '<span class="bdg" style="color:' + T.c + '">' + T.t + '</span>'
    + '<span class="bdg" style="color:' + S.c + '">' + S.t + '</span>'
    + ironBadge(id) + '</div>';
}

/* i piatti scartati escono dal pianificatore, ma solo finché restano
   abbastanza alternative per comporre una settimana */
function allowed(slot){
  const all = Object.keys(MEALS).filter(id=>MEALS[id].s===(slot==="spu2"?"spu":slot));
  const ok = all.filter(id=>tasteOf(id) !== -1 && !noHit(id).block);
  return ok.length >= 3 ? ok : all;
}
/* vero quando il ripiego qui sopra è entrato in funzione: sotto i tre piatti
   l'esclusione smette di valere, e va detto invece che lasciarlo capire */
function slotStretto(slot){
  const all = Object.keys(MEALS).filter(id=>MEALS[id].s===(slot==="spu2"?"spu":slot));
  return all.filter(id=>tasteOf(id) !== -1 && !noHit(id).block).length < 4;
}

/* ============================================================
   COSE CHE NON MANGI, E IL PICCANTE
   ------------------------------------------------------------
   La lista sta nella memoria del telefono, non nel file.
   Un ingrediente scritto senza quantità (aglio, prezzemolo) è un
   insaporitore: il piatto resta, quella riga si salta. Se invece
   ha un peso è un ingrediente vero, e il piatto esce dal piano.
   ============================================================ */
function noList(){ if(!st.no) st.no = []; return st.no; }
function addNo(){
  const i = document.getElementById("noi"); if(!i) return;
  const v = (i.value||"").trim().toLowerCase();
  if(!v) return;
  if(noList().indexOf(v) < 0) noList().push(v);
  i.value = ""; _combos = null;
  /* una parola troppo generica (olio, latte) svuota mezzo ricettario:
     meglio dirlo subito e disfare, che lasciarla fare danni in silenzio */
  const vuoti = ["col","pra","spu","cen"].filter(x=>
    Object.keys(MEALS).filter(id=>MEALS[id].s===x && tasteOf(id)!==-1 && !noHit(id).block).length < 3);
  if(vuoti.length){
    noList().splice(noList().indexOf(v), 1);
    render();
    return toast("\"" + v + "\" toglierebbe quasi tutti i piatti: non l'ho aggiunta");
  }
  save();
  const n = fixBlocked(); render();
  toast(n ? "Tolto: " + v + " · " + n + (n===1?" piatto cambiato":" piatti cambiati") : "Tolto dal piano: " + v);
}
function addNoQuick(w){
  if(noList().indexOf(w) < 0) noList().push(w);
  _combos = null; save();
  const n = fixBlocked(); render();
  toast(n ? "Tolto: " + w + " · " + n + (n===1?" piatto cambiato":" piatti cambiati") : "Tolto dal piano: " + w);
}
function delNo(i){ noList().splice(i,1); _combos = null; save(); render(); }
function togglePiccante(){ st.piccante = !st.piccante; save(); render();
  toast(st.piccante ? "Piccante: sì" : "Piccante: no"); }

/* "ceci" deve prendere anche "cece", "cipolle" anche "cipolla" */
function stemOf(w){ w = String(w).toLowerCase().trim(); return w.length > 4 ? w.slice(0,-1) : w; }
function hasWord(txt, w){ return txt.indexOf(stemOf(w)) >= 0; }

/* block = il piatto non va proposto · opt = righe da saltare */
function noHit(id){
  const m = MEALS[id], out = {block:false, opt:[]};
  if(!m) return out;
  noList().forEach(w=>{
    if(!w) return;
    if(hasWord((m.n||"").toLowerCase(), w)) out.block = true;
    (m.ing||[]).forEach((ing,i)=>{
      if(!hasWord(ing.toLowerCase(), w)) return;
      if(/\d/.test(ing)) out.block = true; else if(out.opt.indexOf(i) < 0) out.opt.push(i);
    });
  });
  return out;
}
/* il piatto migliore per rimpiazzarne uno bloccato: calorie vicine, poi gusto */
function bestAlt(slot, id){
  const base = MEALS[id] ? MEALS[id].k : 500;
  const c = allowed(slot).filter(x => x !== id && !noHit(x).block && tasteOf(x) !== -1);
  if(!c.length) return null;
  return c.sort((a,b)=>
    Math.abs(MEALS[a].k - base) - Math.abs(MEALS[b].k - base)
    || tasteOf(b) - tasteOf(a)
    || satiety(b) - satiety(a)
    || mealCost(a) - mealCost(b))[0];
}
/* rimpiazza nei giorni futuri tutto quello che è diventato off-limits.
   I giorni passati non si toccano: sono il tuo diario. */
function fixBlocked(){
  const today = todayKey(); let n = 0;
  for(let i=0;i<28;i++){
    const d = new Date(); d.setHours(12,0,0,0); d.setDate(d.getDate()+i);
    const key = k(d), sel = dayMeals(key, d.getDay());
    slots().forEach(s=>{
      const id = sel[s]; if(!id) return;
      if(!noHit(id).block && tasteOf(id) !== -1) return;
      if(isLocked(key, s)) return;                 /* l'hai confermato tu: non lo tocco */
      const alt = bestAlt(s, id); if(!alt) return;
      st.meals = st.meals || {}; st.meals[key] = st.meals[key] || {};
      st.meals[key][s] = alt;
      if(st.leftover) delete st.leftover[key + "|" + s];
      n++;
    });
  }
  if(n) save();
  return n;
}
/* stessa regola di noHit — prima una usava la parola intera e l'altra la
   radice, e un ingrediente escluso poteva restare nel piatto senza avviso */
function noWords(id){
  const m = MEALS[id], hit = [];
  if(!m) return hit;
  const txt = ((m.n||"")+" "+(m.ing||[]).join(" ")).toLowerCase();
  noList().forEach(w=>{ if(w && hasWord(txt, w)) hit.push(w); });
  return hit;
}
function procTxt(p){
  let t = esc(p);
  noList().forEach(w=>{
    if(!w) return;
    const re = new RegExp("(" + w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "ig");
    t = t.replace(re, '<s class="noW">$1</s>');
  });
  return t;
}

    + 'quindi potresti rivedere comparire qualcosa che avevi tolto. Se succede, togli un\'esclusione o chiedimi ricette nuove.</div>';

    + '<span class="exname"><b>Mi piace il piccante</b><div class="xs">Aggiunge il peperoncino ai consigli di ogni piatto salato.</div></span></div>';
  return h + '</div>';
}

/* ============================================================
   PROFILO
   ------------------------------------------------------------
   Nel file pubblicato non c'è nessun dato personale: né età, né
   altezza, né peso, né storia clinica. Li inserisci tu una volta
   e restano nella memoria del telefono, esattamente come le
   spunte e le misure. Chi apre il link vede un programma vuoto.
   Da questi tre numeri l'app ricava tutto il resto.
   ============================================================ */

function me(){
  if(!st.me) st.me = { eta:null, cm:null, kg:null, ferro:false };
  return st.me;
}
function meOk(){ const m = me(); return !!(m.eta && m.cm && m.kg); }
/* limiti larghi ma veri: servono a fermare gli errori di battitura, non a
   giudicare nessuno. Il caso tipico non è un peso di 500 kg, è scambiare
   altezza e peso, o scrivere l'altezza in metri. */
const ME_LIM = { eta:[14,80], cm:[130,210], kg:[35,200] };
function setMe(f, v){
  const m = me();
  if(f === "ferro"){ m.ferro = !m.ferro; _combos = null; save(); render(); return; }
  const raw = String(v).replace(",", ".").trim();
  if(raw === ""){ m[f] = null; _combos = null; save(); render(); return; }
  const n = parseFloat(raw);
  if(!(n > 0)){ render(); return toast("Ci va un numero"); }
  if(f === "cm" && n > 1.2 && n < 2.2){ m.cm = Math.round(n*100); _combos = null; save(); render();
    return toast("Letto come " + m.cm + " cm"); }
  const L = ME_LIM[f];
  if(L && (n < L[0] || n > L[1])){
    render();
    return toast(f==="eta" ? "L'eta va fra " + L[0] + " e " + L[1]
               : f==="cm"  ? "L'altezza va fra " + L[0] + " e " + L[1] + " cm"
               : "Il peso va fra " + L[0] + " e " + L[1] + " kg");
  }
  m[f] = n;
  _combos = null; save(); render();
}

/* Mifflin-St Jeor, formula femminile */
function bmr(){
  const m = me(); if(!meOk()) return 0;
  return Math.round(10*m.kg + 6.25*m.cm - 5*m.eta - 161);
}
function tdeeFermi(){ return meOk() ? Math.round(bmr()*1.2/10)*10 : 0; }      /* senza allenarsi */
function tdeeAttiva(){ return meOk() ? Math.round(bmr()*1.375/10)*10 : 0; }   /* col piano */

const BASE_NEUTRO = { cut:1700, recomp:1900, gain:2150 };
const PROT_NEUTRO = { cut:105,  recomp:110,  gain:115  };
function baseFor(gk){
  if(!meOk()) return BASE_NEUTRO[gk] || 1700;
  const t = tdeeAttiva();
  const v = gk === "cut" ? t-300 : gk === "gain" ? t+250 : t;
  return Math.max(1400, Math.round(v/10)*10);          /* il pavimento resta invalicabile */
}
function protForGoal(gk){
  if(!meOk()) return PROT_NEUTRO[gk] || 105;
  const f = gk === "cut" ? 1.7 : gk === "gain" ? 1.9 : 1.8;
  return Math.round(me().kg * f / 5) * 5;
}

function meCard(){
  const m = me();
  const f = (lab, key, ph, suf) => '<div class="f"><label>' + lab + '</label>'
    + '<input inputmode="decimal" placeholder="' + ph + '" value="' + (m[key] === null || m[key] === undefined ? "" : m[key]) + '"'

/* ---------------- il carico che sale, ma non ogni volta ---------------- */
/* Regole: serve lo storico di due sedute in cui hai centrato le ripetizioni,
   almeno sei giorni dall'ultimo aumento, e se dici "resto qui" non te lo
   richiedo per due settimane. */
const UP_WAIT = 6, UP_SNOOZE = 14;
/* Solo le sedute già chiuse: quella di oggi la stai ancora facendo, e se
   contasse basterebbe scrivere il peso per farsi dire subito di alzarlo. */
function lastLogs(id, n){
  const out = [], oggi = todayKey();
  Object.keys(st.log || {}).sort().reverse().forEach(d=>{
    if(d >= oggi) return;
    const v = (st.log[d] || {})[id];
    if(v && (v.r || v.w) && out.length < n) out.push({d:d, w:parseFloat(String(v.w).replace(",",".")) || 0, r:parseInt(String(v.r).replace(/[^0-9]/g,""),10) || 0});
  });
  return out;
}
function targetReps(dose){
  const m = String(dose).match(/(\d+)\s*[–-]\s*(\d+)/);
  if(m) return +m[2];
  const z = String(dose).match(/×\s*(\d+)/);
  if(z) return +z[1];
  const y = String(dose).match(/^(\d+)/);
  return y ? +y[1] : 0;
}
function daysBetween(a, b){ return Math.round((parseD(b) - parseD(a)) / DAYMS); }
/* Tenute e cardio non si fanno salire di "ripetizioni": 40 secondi di plank
   finiscono nel diario come 40, e senza questo controllo l'app direbbe
   "sei arrivata a 40 ripetizioni, oggi prova 42". */
function isHold(dose){ return /["”]|\bmin\b|\bsec\b/.test(String(dose)); }
function loadHint(id, dose){
  if(isHold(dose)) return null;
  const tgt = targetReps(dose); if(!tgt || tgt > 60) return null;
  const L = lastLogs(id, 2); if(L.length < 2) return null;
  if(!(L[0].r >= tgt && L[1].r >= tgt)) return null;
  const today = todayKey();
  const up = (st.lastUp || {})[id];
  if(up && daysBetween(up, today) < UP_WAIT) return null;
  const sn = (st.noUp || {})[id];
  if(sn && daysBetween(sn, today) < UP_SNOOZE) return null;
  /* In fase 2 la casella accanto all'esercizio non sono chili ma giri:
     lo stesso campo, due significati. Senza questo controllo l'app
     proporrebbe "4 kg" per uno squat a corpo libero. */
  if(L[0].w > 0 && progPhase(new Date()) === 1){
    const step = L[0].w < 10 ? 1 : 2;
    return {id:id, kind:"kg", from:L[0].w, to:L[0].w + step, r:L[0].r};
  }
  if(L[0].w > 0 && L[0].w < 8) return {id:id, kind:"giri", from:L[0].w, to:L[0].w + 1, r:L[0].r};
  return {id:id, kind:"rep", from:L[0].r, to:Math.min(L[0].r + 2, tgt + 6), r:L[0].r};
}
function takeUp(id){ st.lastUp = st.lastUp || {}; st.lastUp[id] = todayKey(); save(); renderOggi(); toast("Segnato. Se non esce, torni indietro senza problemi."); }
function skipUp(id){ st.noUp = st.noUp || {}; st.noUp[id] = todayKey(); save(); renderOggi(); toast("Resti lì. Non te lo richiedo per due settimane."); }
function hintBox(id, dose){
  const H = loadHint(id, dose); if(!H) return "";
  const txt = H.kind === "kg"
    ? "Le ultime due volte hai chiuso tutte le ripetizioni con " + H.from + " kg. Oggi prova <b>" + H.to + " kg</b>, e se non escono tutte va bene lo stesso."
    : H.kind === "giri"
    ? "Le ultime due volte hai chiuso tutti i giri. Oggi prova a farne <b>" + H.to + "</b>, e se ti fermi prima va bene lo stesso."
    : "Le ultime due volte sei arrivata a " + H.from + " ripetizioni piene. Oggi prova a fare <b>" + H.to + "</b>.";
  return '<div class="callout g" style="margin:12px 0 0"><b>Si può salire.</b> ' + txt
    + '<div class="g2" style="margin-top:11px">'
    + '<button class="btn" onclick="takeUp(\'' + id + '\')">Ci provo</button>'
    + '<button class="btn sec" onclick="skipUp(\'' + id + '\')">Resto qui</button></div></div>';
}

/* ---------------- i sette giorni ---------------- */
function weekStart(d){                       /* lunedì della settimana di d */
  const x = new Date(d); x.setHours(12,0,0,0);
  const dow = x.getDay();                    /* 0 = domenica */
  x.setDate(x.getDate() - (dow === 0 ? 6 : dow - 1));
  return x;
}
let wkOff = 0;                               /* 0 = questa settimana */
function wkShift(n){ wkOff += n; renderWeek(); }
function weekDays(){
  const s = weekStart(new Date()); s.setDate(s.getDate() + wkOff*7);
  const out = [];
  for(let i=0;i<7;i++){ const d = new Date(s); d.setDate(d.getDate()+i); d.setHours(12,0,0,0); out.push(d); }
  return out;
}
function dayTotals(d){
  const key = k(d), sel = dayMeals(key, d.getDay());
  let kc = 0, eu = 0;
  slots().forEach(s=>{ const m = MEALS[sel[s]]; if(m){ kc += m.k; eu += mealCost(sel[s]); } });
  const X = extraSum(key); kc += X.k; eu += X.eur;
  return {kc:kc, eur:eu, sel:sel, key:key};
}
function dayWork(d){
  const plan = WEEK[d.getDay()], ph = progPhase(d);
  if(plan.type === "work"){
    const wid = (ph===1?"gym":"home") + plan.slot;
    return {t:"Scheda " + plan.slot, n:WORKOUTS[wid].t, cls:"pill-g", wid:wid};
  }
  if(plan.type === "zona2") return {t:"Cardio", n:"Zona 2 · 30–40 minuti", cls:"pill-b"};
  if(plan.type === "steps") return {t:"Passi",  n:"8.000–10.000", cls:"pill-b"};
  return {t:"Riposo", n:"Solo i cinque minuti", cls:"pill-p"};
}
function dayDone(d){
  const r = (st.done||{})[k(d)] || {};
  const W = dayWork(d);
  if(W.wid){
    const it = WORKOUTS[W.wid].items;
    return {n:it.filter(x=>(r.ex||{})[exSwap(x[0])]).length, tot:it.length};
  }
  return {n:r.steps?1:0, tot:1};
}

/* ---------------- cucinare una volta per due ---------------- */
/* Si raddoppia quello che regge un giorno in frigo e che costa tempo:
   forno, zuppe, stufati, frittate, legumi. Non la pasta, non le insalate. */
function keeps(id){
  const m = MEALS[id]; if(!m) return false;
  const txt = (m.n + " " + (m.proc||[]).join(" ")).toLowerCase();
  if(/^pasta|insalatona|insalata mista|cuscus|tortellini|pasto libero/.test(m.n.toLowerCase())) return false;
  return /forno|zuppa|vellutata|stufat|ragù|frittata|lenticchie|ceci|polpett|arrosto|bollit|lessat/.test(txt) && (m.t||0) >= 20;
}
function lfKey(key, slot){ return key + "|" + slot; }
function isLeftover(key, slot){ return !!(st.leftover||{})[lfKey(key, slot)]; }
function cookDouble(key, slot, id){
  const d = parseD(key); d.setDate(d.getDate()+1);
  const nk = k(d);
  /* un piatto confermato non si tocca: la lista della spesa è già fatta su
     quello, e cambiarglielo sotto sarebbe esattamente la cosa che il
     lucchetto promette di non fare. */
  if(isLocked(nk, slot)) return toast("Il giorno dopo è già confermato: prima togli il lucchetto");
  st.meals = st.meals || {}; st.meals[nk] = st.meals[nk] || {};
  st.meals[nk][slot] = id;
  st.leftover = st.leftover || {}; st.leftover[lfKey(nk, slot)] = 1;
  save(); render();
  toast(slotName(slot) + " di " + DAYS[d.getDay()].toLowerCase() + ": lo riscaldi e basta");
}
/* l'avanzo vale solo finché il piatto resta quello: se cambia, il cartellino
   "avanzo di ieri" diventa una bugia */
function clearLeftover(key, slot){
  if(st.leftover) delete st.leftover[lfKey(key, slot)];
}
function pruneLeftovers(){
  if(!st.leftover) return;
  const lim = addD(todayKey(), -28);
  Object.keys(st.leftover).forEach(kk=>{
    const key = kk.split("|")[0], slot = kk.split("|")[1];
    if(key < lim){ delete st.leftover[kk]; return; }
    const pd = parseD(key); pd.setDate(pd.getDate()-1);
    const prev = dayMeals(k(pd), pd.getDay()), oggi = dayMeals(key, parseD(key).getDay());
    if(!prev[slot] || prev[slot] !== oggi[slot]) delete st.leftover[kk];
  });
}
function undoDouble(key, slot){
  if(st.leftover) delete st.leftover[lfKey(key, slot)];
  save(); render(); toast("Tolto l'avanzo");
}
function batchCard(D){
  const rows = [], oggi = todayKey();
  D.forEach(d=>{
    const key = k(d), T = dayTotals(d);
    if(key < oggi) return;                    /* i giorni passati sono il diario, non si cucina indietro */
    slots().forEach(s=>{
      const id = T.sel[s];
      if(!id || !keeps(id) || isLeftover(key, s)) return;
      const nd = new Date(d); nd.setDate(nd.getDate()+1);
      if(isLeftover(k(nd), s)) return;                       /* già raddoppiato */
      rows.push({key:key, s:s, id:id, d:d});
    });
  });
  if(!rows.length) return "";
  const r = rows.slice(0, 3);
  return `<div class="sec-t">Cucina una volta per due</div><div class="card">
    <div class="sm">Questi piatti reggono un giorno in frigo e costano tempo. Raddoppia le dosi e la sera dopo scaldi e basta: stessa spesa, mezz'ora in meno.</div>
    ${r.map(x=>`<div class="altitem" onclick="cookDouble('${x.key}','${x.s}','${x.id}')">
      <div><b style="font-size:14px">${esc(MEALS[x.id].n)}</b>
        <div class="xs">${DAYS[x.d.getDay()].toLowerCase()} · ${slotName(x.s).toLowerCase()} → avanza per ${DAYS[(x.d.getDay()+1)%7].toLowerCase()}</div></div>
      <div class="mmac">${MEALS[x.id].t} min<br><b style="color:var(--ok)">doppio</b></div></div>`).join("")}
  </div>`;
}
